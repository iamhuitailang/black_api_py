<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炸弹人冒险</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🏰 炸弹人冒险</h1>
            <div class="game-stats">
                <span class="stat">❤️ <span id="lives">3</span></span>
                <span class="stat">💣 <span id="bombs">1</span></span>
                <span class="stat">🔥 <span id="fire">1</span></span>
                <span class="stat">关卡 <span id="level">1</span></span>
                <span class="stat">得分 <span id="score">0</span></span>
            </div>
        </div>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            
            <div id="startScreen" class="overlay">
                <div class="menu">
                    <h2>🎮 炸弹人冒险</h2>
                    <p>经典地牢爆破游戏</p>
                    <button id="startBtn" class="btn btn-primary">开始游戏</button>
                    <button id="loadBtn" class="btn btn-secondary">继续游戏</button>
                    <div class="controls">
                        <p><strong>操作说明：</strong></p>
                        <p>↑↓←→ 或 WASD：移动</p>
                        <p>空格键：放置炸弹</p>
                        <p>P键：暂停游戏</p>
                    </div>
                </div>
            </div>
            
            <div id="pauseScreen" class="overlay hidden">
                <div class="menu">
                    <h2>⏸️ 游戏暂停</h2>
                    <button id="resumeBtn" class="btn btn-primary">继续游戏</button>
                    <button id="restartBtn" class="btn btn-secondary">重新开始</button>
                    <button id="quitBtn" class="btn btn-danger">退出游戏</button>
                </div>
            </div>
            
            <div id="gameOverScreen" class="overlay hidden">
                <div class="menu">
                    <h2>💀 游戏结束</h2>
                    <p>最终得分: <span id="finalScore">0</span></p>
                    <button id="retryBtn" class="btn btn-primary">再来一次</button>
                    <button id="homeBtn" class="btn btn-secondary">返回主菜单</button>
                </div>
            </div>
            
            <div id="levelCompleteScreen" class="overlay hidden">
                <div class="menu">
                    <h2>🎉 关卡通过!</h2>
                    <p>得分: <span id="levelScore">0</span></p>
                    <button id="nextLevelBtn" class="btn btn-primary">下一关</button>
                </div>
            </div>
        </div>
        
        <div class="game-controls">
            <button id="pauseBtn" class="control-btn">⏸️ 暂停</button>
        </div>
    </div>
    
    <script src="js/game.js"></script>
</body>
</html>
