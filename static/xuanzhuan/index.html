<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旋转木马站立挑战</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="gameCanvas" width="900" height="600"></canvas>

  <!-- 主菜单 -->
  <div id="menuScreen" class="screen active">
    <div class="menu-card">
      <h1 class="game-title">🎠 旋转木马站立挑战</h1>
      <p class="subtitle">比拼平衡定力，坚持到最后即为赢家！</p>

      <div class="section">
        <h3>选择角色</h3>
        <div id="characterSelect" class="char-select"></div>
      </div>

      <div class="section">
        <h3>选择场景</h3>
        <div id="themeSelect" class="theme-select"></div>
      </div>

      <div class="section">
        <h3>难度设置</h3>
        <div class="difficulty-row">
          <label><input type="radio" name="difficulty" value="easy" checked> 简单</label>
          <label><input type="radio" name="difficulty" value="normal"> 普通</label>
          <label><input type="radio" name="difficulty" value="hard"> 困难</label>
        </div>
      </div>

      <div class="section">
        <h3>对手数量</h3>
        <div class="difficulty-row">
          <label><input type="radio" name="aiCount" value="2"> 2人</label>
          <label><input type="radio" name="aiCount" value="3" checked> 3人</label>
          <label><input type="radio" name="aiCount" value="4"> 4人</label>
        </div>
      </div>

      <div class="btn-row">
        <button id="startBtn" class="btn-primary">开始游戏</button>
        <button id="resumeBtn" class="btn-secondary" style="display:none">继续游戏</button>
      </div>

      <div class="controls-hint">
        <p>⬅️ ➡️ 调整站位　　⬇️ 下蹲　　空格 释放技能</p>
      </div>

      <div id="bestRecords" class="best-records"></div>
    </div>
  </div>

  <!-- 游戏HUD -->
  <div id="hud" class="screen">
    <div class="hud-top">
      <div class="hud-item">
        <span class="label">⏱ 倒计时</span>
        <span id="countdown" class="value big">60</span>
      </div>
      <div class="hud-item">
        <span class="label">🏆 存活</span>
        <span id="survivors" class="value">4/4</span>
      </div>
      <div class="hud-item">
        <span class="label">🎯 排名</span>
        <span id="rank" class="value">1</span>
      </div>
    </div>

    <div id="playersBar" class="players-bar"></div>

    <div class="hud-bottom">
      <div class="skill-box">
        <div class="skill-icon">🛡️</div>
        <div id="skillCooldown" class="skill-cd">就绪</div>
      </div>
      <div id="effectAlert" class="effect-alert"></div>
      <div class="crouch-indicator">
        <div id="crouchBar" class="crouch-bar"></div>
        <span>蹲</span>
      </div>
    </div>

    <div id="pauseBtn" class="pause-btn">⏸</div>
  </div>

  <!-- 结算界面 -->
  <div id="resultScreen" class="screen">
    <div class="result-card">
      <h1 id="resultTitle" class="result-title">胜利！</h1>
      <div class="result-stats">
        <div class="stat-row">
          <span>坚持时长</span>
          <span id="statDuration">0秒</span>
        </div>
        <div class="stat-row">
          <span>最终排名</span>
          <span id="statRank">1</span>
        </div>
        <div class="stat-row">
          <span>存活人数</span>
          <span id="statSurvivors">1/4</span>
        </div>
        <div class="stat-row highlight">
          <span>获得积分</span>
          <span id="statScore">0</span>
        </div>
      </div>
      <div class="btn-row">
        <button id="playAgainBtn" class="btn-primary">再来一局</button>
        <button id="backToMenuBtn" class="btn-secondary">返回菜单</button>
      </div>
    </div>
  </div>

  <!-- 暂停界面 -->
  <div id="pauseScreen" class="screen">
    <div class="pause-card">
      <h2>游戏暂停</h2>
      <div class="btn-row">
        <button id="resumeFromPauseBtn" class="btn-primary">继续</button>
        <button id="quitBtn" class="btn-secondary">退出</button>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/input.js"></script>
<script src="js/character.js"></script>
<script src="js/ai.js"></script>
<script src="js/effects.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
