<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流程图编辑器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部工具栏 -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">流程图编辑器</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="exportPngBtn">
                    <span class="btn-icon">🖼️</span>
                    导出 PNG
                </button>
                <button class="btn btn-secondary" id="saveJsonBtn">
                    <span class="btn-icon">💾</span>
                    保存 JSON
                </button>
                <button class="btn btn-secondary" id="loadJsonBtn">
                    <span class="btn-icon">📂</span>
                    加载 JSON
                </button>
                <button class="btn btn-secondary" id="clearBtn">
                    <span class="btn-icon">🗑️</span>
                    清空画布
                </button>
            </div>
        </header>

        <!-- 主体区域 -->
        <div class="main-container">
            <!-- 左侧节点工具栏 -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3 class="sidebar-title">节点类型</h3>
                    <div class="node-palette">
                        <!-- 椭圆 - 开始/结束 -->
                        <div class="node-item" draggable="true" data-node-type="ellipse">
                            <div class="node-preview node-ellipse" style="background-color: #4CAF50;"></div>
                            <span class="node-label">开始/结束</span>
                        </div>
                        <!-- 矩形 - 处理步骤 -->
                        <div class="node-item" draggable="true" data-node-type="rectangle">
                            <div class="node-preview node-rectangle" style="background-color: #2196F3;"></div>
                            <span class="node-label">处理步骤</span>
                        </div>
                        <!-- 菱形 - 判断分支 -->
                        <div class="node-item" draggable="true" data-node-type="diamond">
                            <div class="node-preview node-diamond" style="background-color: #FF9800;"></div>
                            <span class="node-label">判断分支</span>
                        </div>
                        <!-- 圆角矩形 - 子流程 -->
                        <div class="node-item" draggable="true" data-node-type="rounded-rect">
                            <div class="node-preview node-rounded-rect" style="background-color: #9C27B0;"></div>
                            <span class="node-label">子流程</span>
                        </div>
                        <!-- 文档形 - 文档/数据 -->
                        <div class="node-item" draggable="true" data-node-type="document">
                            <div class="node-preview node-document" style="background-color: #607D8B;"></div>
                            <span class="node-label">文档/数据</span>
                        </div>
                        <!-- 圆形 - 连接点 -->
                        <div class="node-item" draggable="true" data-node-type="circle">
                            <div class="node-preview node-circle" style="background-color: #03A9F4;"></div>
                            <span class="node-label">连接点</span>
                        </div>
                    </div>
                </div>

                <!-- 属性面板 -->
                <div class="sidebar-section" id="propertyPanel">
                    <h3 class="sidebar-title">属性设置</h3>
                    <div class="property-content" id="propertyContent">
                        <div class="property-empty">
                            <p>选择一个节点或连线</p>
                            <p>查看并编辑属性</p>
                        </div>
                    </div>
                </div>

                <!-- 画布设置 -->
                <div class="sidebar-section">
                    <h3 class="sidebar-title">画布设置</h3>
                    <div class="canvas-settings">
                        <div class="setting-item">
                            <label class="setting-label">
                                <input type="checkbox" id="gridSnap" checked>
                                网格对齐
                            </label>
                        </div>
                        <div class="setting-item">
                            <label class="setting-label">
                                <input type="checkbox" id="showGrid" checked>
                                显示网格
                            </label>
                        </div>
                        <div class="setting-item">
                            <span class="setting-label">缩放:</span>
                            <div class="zoom-controls">
                                <button class="zoom-btn" id="zoomOutBtn">-</button>
                                <span class="zoom-value" id="zoomValue">100%</span>
                                <button class="zoom-btn" id="zoomInBtn">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- 画布区域 -->
            <main class="canvas-container">
                <canvas id="mainCanvas"></canvas>
                <!-- 编辑输入框（用于编辑节点文字） -->
                <textarea id="editInput" class="edit-input" style="display: none;"></textarea>
            </main>
        </div>

        <!-- 隐藏的文件输入 -->
        <input type="file" id="fileInput" accept=".json" style="display: none;">
    </div>

    <!-- 模块脚本 -->
    <script src="js/modules/utils.js"></script>
    <script src="js/modules/storage.js"></script>
    <script src="js/modules/nodeTypes.js"></script>
    <script src="js/modules/nodeManager.js"></script>
    <script src="js/modules/connectionManager.js"></script>
    <script src="js/modules/canvasManager.js"></script>
    <script src="js/modules/exportManager.js"></script>
    <script src="js/modules/uiManager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
