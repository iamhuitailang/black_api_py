<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素抢塔 - DOTA风格策略对战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="screen active">
            <div class="title">
                <h1>⚔️ 勇士抢塔 ⚔️</h1>
                <p>DOTA 2 风格策略对战游戏</p>
            </div>
            <div class="menu-buttons">
                <button id="start-btn" class="btn btn-primary">🎮 开始游戏</button>
                <button id="resume-btn" class="btn btn-secondary" style="display: none;">📂 继续游戏</button>
            </div>
            <div class="game-info">
                <h3>🎮 游戏说明</h3>
                <ul>
                    <li>🎯 摧毁夜魇基地获得胜利</li>
                    <li>💎 每秒自动获得金币</li>
                    <li>🏰 占领中央塔楼 +5💰/秒</li>
                    <li>⚔️ 合理搭配兵种克敌制胜</li>
                    <li>🛡️ 盾牌兵：高血量，克制弓箭手</li>
                    <li>🏹 弓箭手：远程输出，克制飞行兵</li>
                    <li>🚀 法师：范围伤害，克制集群</li>
                    <li>🦅 飞行兵：无视地面，突袭后排</li>
                </ul>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="player-info player-left">
                    <span class="player-name">我方</span>
                    <div class="resource">💎 <span id="player-gold">100</span></div>
                    <div class="base-hp">❤️ <span id="player-hp">1000</span>/1000</div>
                </div>
                <div class="game-controls">
                    <button id="pause-btn" class="btn btn-small">⏸️ 暂停</button>
                    <div class="game-time">⏱️ <span id="game-time">00:00</span></div>
                </div>
                <div class="player-info player-right">
                    <span class="player-name">敌方</span>
                    <div class="resource">💎 <span id="enemy-gold">100</span></div>
                    <div class="base-hp">❤️ <span id="enemy-hp">1000</span>/1000</div>
                </div>
            </div>

            <canvas id="game-canvas"></canvas>

            <div class="unit-panel">
                <div class="panel-title">部署兵种</div>
                <div class="unit-buttons">
                    <button class="unit-btn" data-unit="soldier">
                        <span class="unit-icon">👶</span>
                        <span class="unit-name">小兵</span>
                        <span class="unit-cost">10💎</span>
                    </button>
                    <button class="unit-btn" data-unit="shield">
                        <span class="unit-icon">🛡️</span>
                        <span class="unit-name">盾牌兵</span>
                        <span class="unit-cost">30💎</span>
                    </button>
                    <button class="unit-btn" data-unit="archer">
                        <span class="unit-icon">🏹</span>
                        <span class="unit-name">弓箭手</span>
                        <span class="unit-cost">20💎</span>
                    </button>
                    <button class="unit-btn" data-unit="mage">
                        <span class="unit-icon">🚀</span>
                        <span class="unit-name">法师</span>
                        <span class="unit-cost">35💎</span>
                    </button>
                    <button class="unit-btn" data-unit="flying">
                        <span class="unit-icon">🦅</span>
                        <span class="unit-name">飞行兵</span>
                        <span class="unit-cost">25💎</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="pause-screen" class="screen overlay">
            <div class="pause-menu">
                <h2>游戏暂停</h2>
                <div class="pause-buttons">
                    <button id="resume-game-btn" class="btn btn-primary">继续游戏</button>
                    <button id="restart-btn" class="btn btn-secondary">重新开始</button>
                    <button id="quit-btn" class="btn btn-danger">退出游戏</button>
                </div>
            </div>
        </div>

        <div id="end-screen" class="screen overlay">
            <div class="end-menu">
                <h2 id="end-title">游戏结束</h2>
                <p id="end-message"></p>
                <div class="end-stats">
                    <div class="stat">
                        <span class="stat-label">游戏时长</span>
                        <span id="end-time" class="stat-value">00:00</span>
                    </div>
                </div>
                <div class="end-buttons">
                    <button id="play-again-btn" class="btn btn-primary">再来一局</button>
                    <button id="back-to-menu-btn" class="btn btn-secondary">返回主菜单</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/unit.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
