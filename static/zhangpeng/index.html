<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帐篷塌了！- 狂奔逃生</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game-container">
    <div class="game-title">
      <h1>🎪 帐篷塌了！</h1>
      <p>狂奔逃生游戏</p>
    </div>
    <div class="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
    </div>
    <div class="game-controls">
      <div class="control-group">
        <span class="key">←</span><span class="key">→</span>
        <span class="label">移动</span>
      </div>
      <div class="control-group">
        <span class="key">↑</span><span class="key">Space</span>
        <span class="label">跳跃</span>
      </div>
      <div class="control-group">
        <span class="key">↓</span>
        <span class="label">下蹲</span>
      </div>
      <div class="control-group">
        <span class="key">Shift</span>
        <span class="label">冲刺</span>
      </div>
      <div class="control-group">
        <span class="key">P</span>
        <span class="label">暂停</span>
      </div>
    </div>
    <div class="game-footer">
      <p>躲避坍塌帐篷碎块、滚落木箱、失控野兽 | 拾取道具坚持抵达安全区</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/obstacle.js"></script>
  <script src="js/powerup.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
