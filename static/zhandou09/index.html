<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小小魂斗罗 - 末世废土</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="startScreen">
            <h1>小小魂斗罗</h1>
            <p class="subtitle">末世废土</p>
            <button id="startBtn" class="btn">开始游戏</button>
            <button id="continueBtn" class="btn" style="display: none;">继续游戏</button>
            <div class="controls-info">
                <h3>操作说明</h3>
                <p>← → / A D: 移动</p>
                <p>↓ / S: 下蹲</p>
                <p>↑ / W / Space: 跳跃</p>
                <p>J / K / E: 射击</p>
                <p>L / Q: 切换武器</p>
                <p>P / ESC: 暂停</p>
            </div>
        </div>

        <div id="gameScreen" class="hidden">
            <div id="hud">
                <div class="hud-left">
                    <div class="health">
                        <span class="label">生命:</span>
                        <div id="healthBar"></div>
                    </div>
                    <div class="weapon">
                        <span class="label">武器:</span>
                        <span id="weaponName">步枪</span>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="score">
                        <span class="label">得分:</span>
                        <span id="scoreValue">0</span>
                    </div>
                </div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <button id="pauseBtn" class="pause-btn">⏸</button>
        </div>

        <div id="pauseScreen" class="hidden">
            <div class="pause-menu">
                <h2>游戏暂停</h2>
                <button id="resumeBtn" class="btn">继续游戏</button>
                <button id="restartBtn" class="btn">重新开始</button>
                <button id="quitBtn" class="btn">退出游戏</button>
            </div>
        </div>

        <div id="gameOverScreen" class="hidden">
            <div class="game-over-menu">
                <h2>游戏结束</h2>
                <p class="final-score">最终得分: <span id="finalScore">0</span></p>
                <button id="retryBtn" class="btn">重新开始</button>
                <button id="exitBtn" class="btn">返回主菜单</button>
            </div>
        </div>

        <div id="mobileControls" class="mobile-controls hidden">
            <div class="dpad">
                <button id="btnUp" class="dpad-btn">↑</button>
                <button id="btnLeft" class="dpad-btn">←</button>
                <button id="btnDown" class="dpad-btn">↓</button>
                <button id="btnRight" class="dpad-btn">→</button>
            </div>
            <div class="action-btns">
                <button id="btnShoot" class="action-btn">B</button>
                <button id="btnJump" class="action-btn">A</button>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
