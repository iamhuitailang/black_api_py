<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运大转盘</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="spotlight" id="spotlight" style="opacity: 0;"></div>
    
    <div class="confetti-container" id="confettiContainer"></div>
    
    <div class="danmaku-container" id="danmakuContainer"></div>
    
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="sparkle">✨</span>
                幸运大转盘
                <span class="sparkle">✨</span>
            </h1>
            <p class="subtitle">转动转盘，赢取惊喜！</p>
        </header>
        
        <main class="main-content">
            <div class="left-panel">
                <div class="card settings-card">
                    <h2 class="card-title">
                        <span class="icon">⚙️</span>
                        奖品设置
                    </h2>
                    
                    <div class="form-group">
                        <label class="form-label">抽奖模式</label>
                        <div class="mode-selector">
                            <button class="mode-btn active" data-mode="prize">抽奖模式</button>
                            <button class="mode-btn" data-mode="name">名单模式</button>
                        </div>
                    </div>
                    
                    <div class="form-group" id="prize-form">
                        <label class="form-label">奖品列表（每行一个，格式：奖品名,颜色,权重）</label>
                        <div class="input-hint">示例：一等奖,#FFD700,15</div>
                        <textarea class="form-textarea" id="prizeInput" rows="6" placeholder="一等奖,#FFD700,15&#10;二等奖,#FF4444,20&#10;三等奖,#44DD44,30&#10;谢谢惠顾,#4488FF,35"></textarea>
                        <button class="btn btn-secondary" id="applyPrizes">应用奖品</button>
                    </div>
                    
                    <div class="form-group" id="name-form" style="display: none;">
                        <label class="form-label">抽奖名单（每行一个名字）</label>
                        <textarea class="form-textarea" id="nameInput" rows="6" placeholder="张三&#10;李四&#10;王五"></textarea>
                        <button class="btn btn-secondary" id="applyNames">应用名单</button>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="allowRepeat" checked>
                            <span>允许重复抽奖</span>
                        </label>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">自动停止时间（秒）</label>
                        <div class="time-selector">
                            <button class="time-btn active" data-time="3">3秒</button>
                            <button class="time-btn" data-time="5">5秒</button>
                            <button class="time-btn" data-time="8">8秒</button>
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" id="manualStop">
                            <span>手动点击停止</span>
                        </label>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="enableSound" checked>
                            <span>开启音效</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="center-panel">
                <div class="wheel-container">
                    <div class="light-ring" id="lightRing">
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                        <div class="light-dot"></div>
                    </div>
                    
                    <div class="pointer"></div>
                    
                    <div class="wheel-wrapper">
                        <canvas class="wheel" id="wheelCanvas" width="400" height="400"></canvas>
                        <div class="center-circle">
                            <span class="center-text">GO!</span>
                        </div>
                    </div>
                </div>
                
                <div class="spin-button-container">
                    <button class="spin-button" id="spinBtn">
                        <span class="spin-button-text">开始抽奖</span>
                        <div class="light-effect"></div>
                    </button>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="card history-card">
                    <div class="history-header">
                        <h2 class="card-title">
                            <span class="icon">📜</span>
                            抽奖历史
                        </h2>
                        <button class="btn btn-small btn-danger" id="clearHistory">清空记录</button>
                    </div>
                    <div class="history-list" id="historyList">
                        <div class="empty-history">暂无抽奖记录</div>
                    </div>
                </div>
                
                <div class="card result-card">
                    <h2 class="card-title">
                        <span class="icon">🎯</span>
                        抽奖结果
                    </h2>
                    <div class="result-display" id="resultDisplay">
                        <div class="result-placeholder">等待抽奖...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title" id="modalTitle">恭喜您！</h2>
            <p class="modal-result" id="modalResult"></p>
            <button class="btn btn-primary" id="closeModal">确定</button>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
