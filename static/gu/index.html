<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>架子鼓 · 节奏实验室</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>架子鼓 · 节奏实验室</h1>
            <p class="subtitle">点击鼓面或按键盘按键，体验当鼓手的乐趣</p>
        </header>

        <main>
            <div class="canvas-container">
                <canvas id="drumCanvas"></canvas>
            </div>

            <div class="control-panel">
                <div class="control-section">
                    <h3>示范曲目</h3>
                    <div class="demo-buttons">
                        <button class="demo-btn" data-demo="1">示范曲 1</button>
                        <button class="demo-btn" data-demo="2">示范曲 2</button>
                        <button class="demo-btn" data-demo="3">示范曲 3</button>
                        <button class="demo-btn stop" id="stopDemo">停止</button>
                    </div>
                    <div class="restore-demo-section" id="restoreDemoSection" style="display: none; margin-top: 15px; padding: 15px; background: linear-gradient(145deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%); border-radius: 10px; border: 1px solid rgba(102, 126, 234, 0.3);">
                        <p style="margin: 0 0 10px 0; color: #b0b0b0; font-size: 0.9rem;">上次播放中断，是否恢复？</p>
                        <button class="demo-btn" id="restoreDemoBtn" style="min-width: 100%;">恢复播放示范曲 <span id="restoreDemoNum">1</span></button>
                        <button class="demo-btn stop" id="dismissRestoreBtn" style="margin-top: 10px; min-width: 100%;">忽略</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>录制控制</h3>
                    <div class="record-buttons">
                        <button class="record-btn" id="recordBtn">开始录制</button>
                        <button class="record-btn" id="stopRecordBtn">停止录制</button>
                        <button class="record-btn" id="playbackBtn">回放</button>
                        <button class="record-btn" id="clearBtn">清空</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>音效调节</h3>
                    <div class="slider-controls">
                        <div class="slider-group">
                            <label for="volumeSlider">音量: <span id="volumeValue">100%</span></label>
                            <input type="range" id="volumeSlider" min="0" max="100" value="100">
                        </div>
                        <div class="slider-group">
                            <label for="tempoSlider">速度: <span id="tempoValue">120 BPM</span></label>
                            <input type="range" id="tempoSlider" min="60" max="200" value="120">
                        </div>
                        <div class="slider-group">
                            <label for="sustainSlider">延音: <span id="sustainValue">50%</span></label>
                            <input type="range" id="sustainSlider" min="10" max="100" value="50">
                        </div>
                    </div>
                </div>
            </div>

            <div class="keyboard-hints">
                <h3>键盘快捷键</h3>
                <div class="hints-grid">
                    <div class="hint-item">
                        <span class="key">R</span>
                        <span class="drum-name">通通鼓1</span>
                    </div>
                    <div class="hint-item">
                        <span class="key">T</span>
                        <span class="drum-name">通通鼓2</span>
                    </div>
                    <div class="hint-item">
                        <span class="key">Y</span>
                        <span class="drum-name">通通鼓3</span>
                    </div>
                    <div class="hint-item">
                        <span class="key">Z / B</span>
                        <span class="drum-name">底鼓</span>
                    </div>
                    <div class="hint-item">
                        <span class="key">X / N</span>
                        <span class="drum-name">军鼓</span>
                    </div>
                    <div class="hint-item">
                        <span class="key">C / M</span>
                        <span class="drum-name">踩镲</span>
                    </div>
                    <div class="hint-item">
                        <span class="key">V</span>
                        <span class="drum-name">强音镲</span>
                    </div>
                    <div class="hint-item">
                        <span class="key">F</span>
                        <span class="drum-name">节奏镲</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>使用 HTML5 Canvas + 原生 JS + CSS 实现 | 数据保存在本地 localStorage</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
