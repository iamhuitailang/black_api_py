<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️ 海盗语翻译器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-container" class="ui-container">
        <header class="header">
            <h1 class="title">🏴‍☠️ 海盗语翻译器</h1>
            <div class="theme-selector">
                <button class="theme-btn active" data-theme="pirate" title="经典海盗风">🏴‍☠️</button>
                <button class="theme-btn" data-theme="deepsea" title="深海传说">🧜‍♀️</button>
                <button class="theme-btn" data-theme="steampunk" title="蒸汽朋克">🤖</button>
            </div>
        </header>

        <main class="main-content">
            <div class="input-section">
                <label for="inputText">📝 输入文本</label>
                <textarea id="inputText" placeholder="输入日常用语，例如：Hello, my friend. How are you?" spellcheck="false"></textarea>
                <div class="examples">
                    <span class="examples-label">示例：</span>
                    <button class="example-btn" data-text="Hello">Hello</button>
                    <button class="example-btn" data-text="How are you?">How are you?</button>
                    <button class="example-btn" data-text="I love you">I love you</button>
                    <button class="example-btn" data-text="Thank you my friend">Thank you my friend</button>
                    <button class="example-btn" data-text="Goodbye">Goodbye</button>
                </div>
            </div>

            <div class="action-buttons">
                <button id="translateBtn" class="btn btn-primary">🏴‍☠️ 翻译</button>
                <button id="randomBtn" class="btn btn-secondary">🎲 随机语录</button>
                <button id="historyBtn" class="btn btn-secondary">📜 历史记录</button>
            </div>

            <div class="output-section">
                <label>⚓ 翻译结果</label>
                <div id="outputText" class="output-box"></div>
                <div class="output-actions">
                    <button id="speakBtn" class="btn btn-small">🔊 朗读</button>
                    <button id="copyBtn" class="btn btn-small">📋 复制</button>
                    <button id="shareBtn" class="btn btn-small">📤 分享</button>
                </div>
            </div>
        </main>

        <div id="historyModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>📜 翻译历史</h2>
                    <button id="closeHistoryBtn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="historyList" class="history-list"></div>
                    <button id="clearHistoryBtn" class="btn btn-danger">🗑️ 清空历史</button>
                </div>
            </div>
        </div>

        <div id="imageModal" class="modal hidden">
            <div class="modal-content image-modal-content">
                <div class="modal-header">
                    <h2>📸 分享图片</h2>
                    <button id="closeImageBtn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body image-modal-body">
                    <img id="shareImage" class="share-image" alt="分享图片" />
                    <p class="image-hint">💡 点击图片可保存，或点击下方按钮下载</p>
                    <button id="downloadImageBtn" class="btn btn-primary">💾 下载图片</button>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Arrr! 把日常用语变成海盗话吧， matey!</p>
        </footer>
    </div>

    <script src="js/dictionary.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/translator.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
