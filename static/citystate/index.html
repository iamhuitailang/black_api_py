<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古代城邦建设系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>🏰 古代城邦建设系统</h1>
            <div class="player-info">
                <span id="player-id">玩家ID: --</span>
                <span id="year-info">第 1 年 春季</span>
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar left-sidebar">
                <div class="panel resources-panel">
                    <h2>📦 资源</h2>
                    <div class="resource-grid">
                        <div class="resource-item food">
                            <span class="resource-icon">🌾</span>
                            <span class="resource-name">粮食</span>
                            <span class="resource-value" id="food-value">0</span>
                        </div>
                        <div class="resource-item stone">
                            <span class="resource-icon">🪨</span>
                            <span class="resource-name">石头</span>
                            <span class="resource-value" id="stone-value">0</span>
                        </div>
                        <div class="resource-item wood">
                            <span class="resource-icon">🪵</span>
                            <span class="resource-name">木材</span>
                            <span class="resource-value" id="wood-value">0</span>
                        </div>
                        <div class="resource-item gold">
                            <span class="resource-icon">💰</span>
                            <span class="resource-name">金币</span>
                            <span class="resource-value" id="gold-value">0</span>
                        </div>
                    </div>
                </div>

                <div class="panel status-panel">
                    <h2>📊 城邦状态</h2>
                    <div class="status-item">
                        <span>👥 人口</span>
                        <span><span id="pop-value">0</span> / <span id="max-pop-value">0</span></span>
                    </div>
                    <div class="status-item">
                        <span>⚔️ 士兵</span>
                        <span id="soldiers-value">0</span>
                    </div>
                    <div class="status-item">
                        <span>🏆 繁荣度</span>
                        <span id="prosperity-value">0</span>
                    </div>
                    <div class="status-item">
                        <span>🛡️ 防御力</span>
                        <span id="defense-value">0</span>
                    </div>
                </div>

                <div class="panel build-panel">
                    <h2>🏗️ 建造</h2>
                    <div class="building-list" id="building-list">
                    </div>
                </div>
            </aside>

            <main class="main-content">
                <div class="game-controls">
                    <button id="advance-season-btn" class="btn btn-primary">⏭️ 推进季节</button>
                    <button id="trigger-invasion-btn" class="btn btn-danger" disabled>⚔️ 抵御入侵</button>
                    <button id="trade-btn" class="btn btn-secondary">💱 市场交易</button>
                    <button id="refresh-btn" class="btn btn-secondary">🔄 刷新</button>
                </div>

                <div class="invasion-alert" id="invasion-alert" style="display: none;">
                    ⚠️ 冬季已至，蛮族即将入侵！请立即调整城防布局，建造更多城墙和兵营！
                </div>

                <div class="grid-container">
                    <div class="grid-wrapper">
                        <div id="city-grid" class="city-grid">
                        </div>
                    </div>
                </div>

                <div class="panel building-info-panel" id="building-info-panel" style="display: none;">
                    <h3 id="selected-building-name">建筑信息</h3>
                    <div id="selected-building-details"></div>
                    <button id="demolish-btn" class="btn btn-danger">🗑️ 拆除建筑</button>
                </div>
            </main>

            <aside class="sidebar right-sidebar">
                <div class="panel market-panel">
                    <h2>💱 市场汇率</h2>
                    <p class="rate-hint">（每小时刷新）</p>
                    <div class="rate-list" id="rate-list">
                    </div>
                </div>

                <div class="panel invasion-history-panel">
                    <h2>📜 入侵历史</h2>
                    <div class="invasion-history" id="invasion-history">
                        <p class="no-history">暂无入侵记录</p>
                    </div>
                </div>

                <div class="panel log-panel">
                    <h2>📋 事件日志</h2>
                    <div class="event-log" id="event-log">
                    </div>
                </div>
            </aside>
        </div>

        <div id="trade-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn" id="close-trade-modal">&times;</span>
                <h2>💱 市场交易</h2>
                <p class="modal-hint">需要先建造市场才能交易</p>
                <div class="trade-form">
                    <div class="form-group">
                        <label>出售资源</label>
                        <select id="from-resource">
                            <option value="food">🌾 粮食</option>
                            <option value="stone">🪨 石头</option>
                            <option value="wood">🪵 木材</option>
                            <option value="gold">💰 金币</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>换取资源</label>
                        <select id="to-resource">
                            <option value="gold">💰 金币</option>
                            <option value="food">🌾 粮食</option>
                            <option value="stone">🪨 石头</option>
                            <option value="wood">🪵 木材</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>数量</label>
                        <input type="number" id="trade-amount" value="10" min="1">
                    </div>
                    <div class="trade-preview">
                        <span id="trade-preview-text">预计获得: 0</span>
                    </div>
                    <button id="confirm-trade-btn" class="btn btn-primary">确认交易</button>
                </div>
            </div>
        </div>

        <div id="invasion-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 id="invasion-result-title">入侵结果</h2>
                <div id="invasion-result-content"></div>
                <button id="close-invasion-modal" class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
