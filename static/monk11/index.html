<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法术对战 · 元素对决</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="main-menu" class="screen">
                <div class="scroll-container">
                    <h1 class="title">法术对战</h1>
                    <h2 class="subtitle">元素对决</h2>
                    <button id="start-btn" class="btn">开始游戏</button>
                </div>
            </div>

            <div id="character-select" class="screen hidden">
                <div class="scroll-container">
                    <h2 class="title">选择你的法师</h2>
                    <div id="character-list" class="character-grid"></div>
                    <div class="character-info hidden" id="character-info">
                        <div class="info-content"></div>
                        <button id="confirm-char-btn" class="btn">确认选择</button>
                        <button id="back-to-menu-btn" class="btn secondary">返回</button>
                    </div>
                </div>
            </div>

            <div id="battle-screen" class="screen hidden">
                <div id="pause-menu" class="pause-menu hidden">
                    <div class="scroll-container small">
                        <h3>游戏暂停</h3>
                        <button id="resume-btn" class="btn">继续游戏</button>
                        <button id="restart-btn" class="btn">重新开始</button>
                        <button id="quit-btn" class="btn secondary">退出游戏</button>
                    </div>
                </div>
                <button id="pause-btn" class="pause-btn">⏸</button>
                <div id="battle-ui">
                    <div class="player-panel scroll-container">
                        <div class="character-display" id="player-display"></div>
                        <div class="stats">
                            <div class="stat-bar">
                                <span class="stat-label">生命</span>
                                <div class="bar-container">
                                    <div class="bar health" id="player-health-bar"></div>
                                </div>
                                <span class="stat-value" id="player-health-text">100/100</span>
                            </div>
                            <div class="stat-bar">
                                <span class="stat-label">魔力</span>
                                <div class="bar-container">
                                    <div class="bar mana" id="player-mana-bar"></div>
                                </div>
                                <span class="stat-value" id="player-mana-text">100/100</span>
                            </div>
                        </div>
                    </div>
                    <div class="enemy-panel scroll-container">
                        <div class="character-display" id="enemy-display"></div>
                        <div class="stats">
                            <div class="stat-bar">
                                <span class="stat-label">生命</span>
                                <div class="bar-container">
                                    <div class="bar health" id="enemy-health-bar"></div>
                                </div>
                                <span class="stat-value" id="enemy-health-text">100/100</span>
                            </div>
                        </div>
                    </div>
                    <div class="battle-log scroll-container" id="battle-log">
                        <div class="log-content"></div>
                    </div>
                    <div class="spells-panel scroll-container">
                        <h3>法术</h3>
                        <div id="spells-list" class="spells-grid"></div>
                    </div>
                </div>
            </div>

            <div id="victory-screen" class="screen hidden">
                <div class="scroll-container">
                    <h2 class="title">胜利！</h2>
                    <div class="rewards">
                        <p>获得经验值: <span id="exp-reward">0</span></p>
                        <p>获得金币: <span id="gold-reward">0</span></p>
                    </div>
                    <button id="continue-btn" class="btn">继续</button>
                </div>
            </div>

            <div id="defeat-screen" class="screen hidden">
                <div class="scroll-container">
                    <h2 class="title">战败...</h2>
                    <button id="retry-btn" class="btn">重新挑战</button>
                    <button id="to-menu-btn" class="btn secondary">返回主菜单</button>
                </div>
            </div>

            <div id="levelup-screen" class="screen hidden">
                <div class="scroll-container">
                    <h2 class="title">等级提升！</h2>
                    <p>当前等级: <span id="new-level">2</span></p>
                    <button id="levelup-ok-btn" class="btn">确定</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/gameData.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
