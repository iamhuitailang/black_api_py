<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - 刺猬跑酷</title>
    <link rel="stylesheet" href="/static/runner/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="leaderboard-body">
    <div class="leaderboard-container">
        <div class="header">
            <h1 class="page-title">🏆 排行榜 🏆</h1>
            <p class="page-subtitle">TOP RUNNERS</p>
        </div>

        <div class="leaderboard-table-container">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th class="col-rank">排名</th>
                        <th class="col-name">玩家</th>
                        <th class="col-distance">距离</th>
                        <th class="col-rings">金币</th>
                        <th class="col-date">日期</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr class="loading-row">
                        <td colspan="5">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="leaderboard-actions">
            <button id="backBtn" class="pixel-btn btn-primary">
                <span class="btn-icon">◀</span>
                <span class="btn-text">返回菜单</span>
            </button>
            <button id="refreshBtn" class="pixel-btn btn-secondary">
                <span class="btn-icon">🔄</span>
                <span class="btn-text">刷新</span>
            </button>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <p class="empty-text">暂无记录</p>
            <p class="empty-hint">成为第一个上榜的玩家吧！</p>
        </div>
    </div>

    <script src="/static/runner/js/leaderboard.js"></script>
</body>
</html>
