<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三段闯关 - 密林·矿洞·火山</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;overflow:hidden;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
#gameWrapper{position:relative;width:900px;height:600px}
canvas{display:block;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,.6)}
#hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.hud-item{background:rgba(0,0,0,.65);padding:6px 14px;border-radius:6px;color:#fff;font-size:14px;font-weight:600;backdrop-filter:blur(4px)}
.hp-bar-wrap{width:180px;height:18px;background:rgba(0,0,0,.5);border-radius:9px;overflow:hidden;position:relative}
.hp-bar-fill{height:100%;border-radius:9px;transition:width .3s,background .3s}
.hp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;border-radius:8px;transition:opacity .4s;background:rgba(10,10,10,.75);backdrop-filter:blur(6px)}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:42px;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#overlay h2{font-size:22px;margin-bottom:24px;font-weight:400;opacity:.85}
#overlay p{font-size:15px;margin-bottom:16px;opacity:.7;max-width:420px;text-align:center;line-height:1.6}
.btn{padding:12px 36px;border:none;border-radius:8px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;margin:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.btn:active{transform:translateY(0)}
.btn-start{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff}
.btn-retry{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
.btn-board{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff}
#leaderboard{position:absolute;inset:0;background:rgba(10,10,10,.95);z-index:30;display:none;flex-direction:column;align-items:center;padding:40px 20px;border-radius:8px;overflow-y:auto}
#leaderboard h2{color:#f1c40f;font-size:28px;margin-bottom:20px}
#leaderboard table{width:90%;border-collapse:collapse;color:#eee}
#leaderboard th{color:#f1c40f;padding:8px 12px;text-align:left;border-bottom:2px solid #333;font-size:14px}
#leaderboard td{padding:8px 12px;border-bottom:1px solid #222;font-size:13px}
#leaderboard tr:nth-child(even){background:rgba(255,255,255,.03)}
#leaderboard .rank-1{color:#f1c40f;font-weight:700}
#leaderboard .rank-2{color:#bdc3c7;font-weight:700}
#leaderboard .rank-3{color:#cd7f32;font-weight:700}
.close-btn{position:absolute;top:16px;right:20px;background:none;border:none;color:#aaa;font-size:28px;cursor:pointer}
.close-btn:hover{color:#fff}
#nameInput{padding:10px 16px;border:2px solid #555;border-radius:6px;font-size:16px;background:#1a1a1a;color:#fff;width:220px;margin-bottom:12px}
#nameInput:focus{outline:none;border-color:#2ecc71}
#stageLabel{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:700;color:rgba(255,255,255,.8);text-shadow:0 1px 8px rgba(0,0,0,.5);pointer-events:none;z-index:10;opacity:0;transition:opacity 1s}
#stageLabel.show{opacity:1}
#dmgFlash{position:absolute;inset:0;background:rgba(255,0,0,.3);pointer-events:none;z-index:15;border-radius:8px;opacity:0;transition:opacity .15s}
#controlsHint{position:absolute;bottom:40px;right:16px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:6px;color:rgba(255,255,255,.6);font-size:12px;pointer-events:none;z-index:10;transition:opacity .5s}
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas" width="900" height="600"></canvas>
  <div id="hud">
    <div class="hud-item">
      <span>HP</span>
      <div class="hp-bar-wrap">
        <div class="hp-bar-fill" id="hpBar"></div>
        <div class="hp-text" id="hpText">100</div>
      </div>
    </div>
    <div class="hud-item" id="scoreDisplay">得分: 0</div>
    <div class="hud-item" id="timeDisplay">用时: 0.0s</div>
  </div>
  <div id="stageLabel"></div>
  <div id="dmgFlash"></div>
  <div id="controlsHint"></div>
  <div id="overlay">
    <h1 id="overlayTitle">三段闯关</h1>
    <h2 id="overlaySubtitle">密林 · 矿洞 · 火山</h2>
    <p id="overlayDesc">第一章：WASD移动躲避毒蛇与落石<br>第二章：←→键切换轨道避开墙壁拾取矿石<br>第三章：空格跳跃跨越裂缝与岩浆<br>HP归零则从头开始，活到最后即为胜利！</p>
    <div id="overlayActions">
      <button class="btn btn-start" onclick="startGame()">开始冒险</button>
      <button class="btn btn-board" onclick="openLeaderboard()">排行榜</button>
    </div>
  </div>
  <div id="leaderboard">
    <button class="close-btn" onclick="closeLeaderboard()">&times;</button>
    <h2>🏆 排行榜</h2>
    <table>
      <thead><tr><th>#</th><th>玩家</th><th>得分</th><th>用时</th><th>剩余HP</th><th>日期</th></tr></thead>
      <tbody id="lbBody"></tbody>
    </table>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 600;

const GAME_STATES = {MENU:0,JUNGLE:1,MINE:2,VOLCANO:3,VICTORY:4,GAMEOVER:5};
let state = GAME_STATES.MENU;
let hp = 100, score = 0, startTime = 0, elapsed = 0;
let keys = {};
let animId = null;
let stageProgress = 0;
let stageComplete = false;
let popups = [];

const API_BASE = window.location.origin + '/api';

document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  keys[e.code] = true;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  keys[e.code] = false;
});

function updateHUD(){
  const bar = document.getElementById('hpBar');
  const txt = document.getElementById('hpText');
  const pct = Math.max(0, hp);
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? 'linear-gradient(90deg,#2ecc71,#27ae60)' : pct > 25 ? 'linear-gradient(90deg,#f39c12,#e67e22)' : 'linear-gradient(90deg,#e74c3c,#c0392b)';
  txt.textContent = Math.max(0, Math.ceil(hp));
  document.getElementById('scoreDisplay').textContent = '得分: ' + score;
  if(state >= GAME_STATES.JUNGLE && state <= GAME_STATES.VOLCANO){
    elapsed = (Date.now() - startTime) / 1000;
  }
  document.getElementById('timeDisplay').textContent = '用时: ' + elapsed.toFixed(1) + 's';
}

function damage(amount){
  hp -= amount;
  const flash = document.getElementById('dmgFlash');
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 150);
  if(hp <= 0){
    hp = 0;
    gameOver();
  }
}

function showOverlay(title, subtitle, desc, actions){
  const ov = document.getElementById('overlay');
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlaySubtitle').textContent = subtitle;
  document.getElementById('overlayDesc').textContent = desc;
  document.getElementById('overlayActions').innerHTML = actions;
  ov.classList.remove('hidden');
}

function hideOverlay(){
  document.getElementById('overlay').classList.add('hidden');
}

function showStageLabel(text){
  const lbl = document.getElementById('stageLabel');
  lbl.textContent = text;
  lbl.classList.add('show');
  setTimeout(() => lbl.classList.remove('show'), 2500);
}

function startGame(){
  hp = 100; score = 0; startTime = Date.now(); elapsed = 0;
  stageProgress = 0; stageComplete = false;
  keys = {}; popups = [];
  hideOverlay();
  startJungle();
}

function gameOver(){
  state = GAME_STATES.GAMEOVER;
  if(animId) cancelAnimationFrame(animId);
  showOverlay('游戏结束', '你的HP归零了', '不要放弃，再来一次！',
    '<button class="btn btn-retry" onclick="startGame()">重新开始</button>' +
    '<button class="btn btn-board" onclick="openLeaderboard()">排行榜</button>');
}

function victory(){
  state = GAME_STATES.VICTORY;
  if(animId) cancelAnimationFrame(animId);
  const timeFinal = elapsed.toFixed(1);
  showOverlay('🎉 通关成功！', '得分: ' + score + ' | 用时: ' + timeFinal + 's | 剩余HP: ' + Math.ceil(hp),
    '输入你的名字，登上排行榜！',
    '<input id="nameInput" placeholder="你的名字" maxlength="20" />' +
    '<br><button class="btn btn-start" onclick="submitScore()">提交成绩</button>' +
    '<button class="btn btn-board" onclick="openLeaderboard()">排行榜</button>');
}

async function submitScore(){
  const nameEl = document.getElementById('nameInput');
  const name = nameEl ? nameEl.value.trim() || 'Anonymous' : 'Anonymous';
  try{
    const res = await fetch(API_BASE + '/game/submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({player_name: name, score, time_spent: elapsed, hp_remaining: Math.ceil(hp)})
    });
    const data = await res.json();
    if(data.code === 0){
      openLeaderboard();
    }
  }catch(e){
    console.error('Submit failed:', e);
    openLeaderboard();
  }
}

async function openLeaderboard(){
  const lb = document.getElementById('leaderboard');
  lb.style.display = 'flex';
  const tbody = document.getElementById('lbBody');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888">加载中...</td></tr>';
  try{
    const res = await fetch(API_BASE + '/game/leaderboard/get?limit=20');
    const data = await res.json();
    if(data.code === 0 && data.data.items.length > 0){
      tbody.innerHTML = data.data.items.map((r, i) => {
        const rc = i < 3 ? ' class="rank-' + (i+1) + '"' : '';
        return '<tr' + rc + '><td>' + (i+1) + '</td><td>' + r.player_name + '</td><td>' + r.score + '</td><td>' + parseFloat(r.time_spent).toFixed(1) + 's</td><td>' + r.hp_remaining + '</td><td>' + (r.created_at || '-') + '</td></tr>';
      }).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888">暂无记录</td></tr>';
    }
  }catch(e){
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#e74c3c">加载失败</td></tr>';
  }
}

function closeLeaderboard(){
  document.getElementById('leaderboard').style.display = 'none';
}

// ==================== STAGE 1: JUNGLE ====================
let jungle = {};
const JUNGLE_DURATION = 20;

function startJungle(){
  state = GAME_STATES.JUNGLE;
  stageProgress = 0;
  jungle = {
    player: {x: W/2, y: H - 80, w: 30, h: 40, speed: 4},
    snakes: [],
    rocks: [],
    trees: [],
    spawnTimer: 0,
    rockTimer: 0,
    distance: 0
  };
  for(let i = 0; i < 12; i++){
    jungle.trees.push({x: Math.random() * W, y: Math.random() * H, s: 20 + Math.random()*30});
  }
  showStageLabel('第一章：密林');
  document.getElementById('controlsHint').textContent = 'WASD 移动';
  document.getElementById('controlsHint').style.opacity = '1';
  setTimeout(() => document.getElementById('controlsHint').style.opacity = '0', 4000);
  jungleLoop();
}

function jungleLoop(){
  if(state !== GAME_STATES.JUNGLE) return;
  const j = jungle;
  const p = j.player;

  if(keys['w']) p.y -= p.speed;
  if(keys['s']) p.y += p.speed;
  if(keys['a']) p.x -= p.speed;
  if(keys['d']) p.x += p.speed;
  p.x = Math.max(10, Math.min(W - p.w - 10, p.x));
  p.y = Math.max(60, Math.min(H - p.h - 10, p.y));

  j.distance += 1;
  j.spawnTimer++;
  j.rockTimer++;

  if(j.spawnTimer % 60 === 0){
    const sx = 40 + Math.random() * (W - 80);
    j.snakes.push({x: sx, y: -20, w: 40, h: 16, vx: (Math.random()-.5)*2, vy: 1.5 + Math.random()*1.5, wobble:0});
  }
  if(j.rockTimer % 90 === 0){
    const rx = 30 + Math.random() * (W - 80);
    j.rocks.push({x: rx, y: -30, w: 28, h: 28, vy: 3 + Math.random()*2});
  }

  j.snakes.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    s.wobble += 0.3;
    if(s.x < 10 || s.x > W - s.w) s.vx *= -1;
  });
  j.rocks.forEach(r => { r.y += r.vy; });

  j.snakes = j.snakes.filter(s => s.y < H + 30);
  j.rocks = j.rocks.filter(r => r.y < H + 40);

  j.snakes.forEach(s => {
    if(!s.hit && rectCollide(p, s)){
      s.hit = true;
      damage(15);
    }
  });
  j.rocks.forEach(r => {
    if(!r.hit && rectCollide(p, r)){
      r.hit = true;
      damage(30);
    }
  });

  stageProgress = j.distance / (JUNGLE_DURATION * 60);
  if(stageProgress >= 1){
    startMine();
    return;
  }

  drawJungle(j);
  updateHUD();
  animId = requestAnimationFrame(jungleLoop);
}

function drawJungle(j){
  ctx.fillStyle = '#0b2e13';
  ctx.fillRect(0, 0, W, H);

  for(let i = 0; i < 30; i++){
    const gx = (i * 73 + j.distance * 0.3) % W;
    const gy = (i * 97 + j.distance * 0.2) % H;
    ctx.fillStyle = 'rgba(20,80,30,0.3)';
    ctx.fillRect(gx, gy, 8, 12);
  }

  j.trees.forEach(t => {
    const ty = (t.y + j.distance * 0.5) % (H + 60) - 30;
    ctx.fillStyle = '#3e2723';
    ctx.fillRect(t.x + t.s/3, ty + t.s, t.s/3, t.s);
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath();
    ctx.arc(t.x + t.s/2, ty + t.s, t.s * 0.7, 0, Math.PI*2);
    ctx.fill();
  });

  j.snakes.forEach(s => {
    if(s.hit) return;
    ctx.save();
    ctx.translate(s.x + s.w/2, s.y + s.h/2);
    ctx.fillStyle = '#4caf50';
    ctx.beginPath();
    for(let i = -s.w/2; i <= s.w/2; i += 3){
      const wave = Math.sin(i * 0.3 + s.wobble) * 4;
      if(i === -s.w/2) ctx.moveTo(i, wave);
      else ctx.lineTo(i, wave);
    }
    for(let i = s.w/2; i >= -s.w/2; i -= 3){
      const wave = Math.sin(i * 0.3 + s.wobble) * 4 + 8;
      ctx.lineTo(i, wave);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c62828';
    ctx.beginPath();
    ctx.arc(-s.w/2 + 2, -2, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-s.w/2 + 4, -4, 1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  j.rocks.forEach(r => {
    if(r.hit) return;
    ctx.fillStyle = '#5d4037';
    ctx.beginPath();
    ctx.moveTo(r.x + 4, r.y + r.h);
    ctx.lineTo(r.x, r.y + r.h * 0.4);
    ctx.lineTo(r.x + r.w * 0.3, r.y);
    ctx.lineTo(r.x + r.w * 0.7, r.y + 2);
    ctx.lineTo(r.x + r.w, r.y + r.h * 0.35);
    ctx.lineTo(r.x + r.w - 3, r.y + r.h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath();
    ctx.arc(r.x + r.w*0.4, r.y + r.h*0.3, 4, 0, Math.PI*2);
    ctx.fill();
  });

  const p = j.player;
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(p.x + 8, p.y + 30, 6, 10);
  ctx.fillRect(p.x + 16, p.y + 30, 6, 10);
  ctx.fillStyle = '#ffcc80';
  ctx.fillRect(p.x + 5, p.y + 8, 20, 22);
  ctx.fillStyle = '#2e7d32';
  ctx.fillRect(p.x + 2, p.y, 26, 12);
  ctx.fillRect(p.x + 6, p.y - 4, 18, 6);
  ctx.fillStyle = '#333';
  ctx.fillRect(p.x + 10, p.y + 16, 4, 3);
  ctx.fillRect(p.x + 18, p.y + 16, 4, 3);

  drawProgress();
}

// ==================== STAGE 2: MINE ====================
let mine = {};
const MINE_DURATION = 25;
const TRACK_COUNT = 3;

function startMine(){
  state = GAME_STATES.MINE;
  stageProgress = 0;
  mine = {
    currentTrack: 1,
    cart: {x: 0, y: 0, w: 60, h: 40},
    obstacles: [],
    ores: [],
    spawnTimer: 0,
    distance: 0,
    tracks: [],
    switchAnim: 0,
    targetTrack: 1
  };
  const trackY = [200, 320, 440];
  mine.tracks = trackY;
  mine.cart.x = 120;
  mine.cart.y = trackY[1] - mine.cart.h/2;
  showStageLabel('第二章：矿洞');
  document.getElementById('controlsHint').textContent = '← → 切换轨道';
  document.getElementById('controlsHint').style.opacity = '1';
  setTimeout(() => document.getElementById('controlsHint').style.opacity = '0', 4000);
  mineLoop();
}

function mineLoop(){
  if(state !== GAME_STATES.MINE) return;
  const m = mine;

  if(keys['ArrowLeft']){
    if(m.targetTrack > 0 && m.switchAnim === 0){
      m.targetTrack--;
      m.switchAnim = 1;
      keys['ArrowLeft'] = false;
    }
  }
  if(keys['ArrowRight']){
    if(m.targetTrack < TRACK_COUNT-1 && m.switchAnim === 0){
      m.targetTrack++;
      m.switchAnim = 1;
      keys['ArrowRight'] = false;
    }
  }

  if(m.switchAnim > 0){
    const targetY = m.tracks[m.targetTrack] - m.cart.h/2;
    m.cart.y += (targetY - m.cart.y) * 0.15;
    if(Math.abs(m.cart.y - targetY) < 2){
      m.cart.y = targetY;
      m.currentTrack = m.targetTrack;
      m.switchAnim = 0;
    }
  }

  m.distance += 1;
  m.spawnTimer++;

  if(m.spawnTimer % 70 === 0){
    const trackIdx = Math.floor(Math.random() * TRACK_COUNT);
    const isOre = Math.random() < 0.45;
    if(isOre){
      m.ores.push({x: W + 20, y: m.tracks[trackIdx] - 18, w: 30, h: 30, track: trackIdx, collected: false});
    } else {
      const hasAltOre = Math.random() < 0.5;
      const altTrack = (trackIdx + (Math.random() < 0.5 ? 1 : 2)) % TRACK_COUNT;
      m.obstacles.push({x: W + 20, y: m.tracks[trackIdx] - 25, w: 50, h: 50, track: trackIdx, hit: false});
      if(hasAltOre){
        m.ores.push({x: W + 20, y: m.tracks[altTrack] - 18, w: 30, h: 30, track: altTrack, collected: false});
      }
    }
  }

  m.obstacles.forEach(o => o.x -= 3.5);
  m.ores.forEach(o => o.x -= 3.5);
  m.obstacles = m.obstacles.filter(o => o.x > -60);
  m.ores = m.ores.filter(o => o.x > -60);

  const cartRect = {x: m.cart.x, y: m.cart.y, w: m.cart.w, h: m.cart.h};

  m.obstacles.forEach(o => {
    if(!o.hit && rectCollide(cartRect, o)){
      o.hit = true;
      damage(20);
    }
  });
  m.ores.forEach(o => {
    if(!o.collected && rectCollide(cartRect, o)){
      o.collected = true;
      score += 50;
      popups.push({x: o.x, y: o.y, text: '+50', life: 40, color: '#ffd54f'});
    }
  });

  stageProgress = m.distance / (MINE_DURATION * 60);
  if(stageProgress >= 1){
    startVolcano();
    return;
  }

  drawMine(m);
  updateHUD();
  animId = requestAnimationFrame(mineLoop);
}

function drawMine(m){
  ctx.fillStyle = '#3e3524';
  ctx.fillRect(0, 0, W, H);

  for(let i = 0; i < 20; i++){
    const bx = (i * 131 + m.distance * 0.1) % (W + 40) - 20;
    const by = (i * 89) % H;
    ctx.fillStyle = 'rgba(80,70,50,0.3)';
    ctx.fillRect(bx, by, 20 + (i%5)*8, 15 + (i%3)*6);
  }

  m.tracks.forEach((ty, i) => {
    ctx.strokeStyle = '#6d5c3e';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, ty);
    ctx.lineTo(W, ty);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, ty + 12);
    ctx.lineTo(W, ty + 12);
    ctx.stroke();
    for(let sx = 0; sx < W; sx += 40){
      ctx.strokeStyle = '#5a4a30';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx - (m.distance % 40), ty - 2);
      ctx.lineTo(sx - (m.distance % 40), ty + 14);
      ctx.stroke();
    }
  });

  m.obstacles.forEach(o => {
    if(o.hit) return;
    ctx.fillStyle = '#795548';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#4e342e';
    for(let i = 0; i < 3; i++){
      ctx.fillRect(o.x + 5 + i*15, o.y + 8 + i*10, 12, 8);
    }
    ctx.fillStyle = '#d32f2f';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('⚠', o.x + 15, o.y + 35);
  });

  m.ores.forEach(o => {
    if(o.collected) return;
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    const cx = o.x + o.w/2, cy = o.y + o.h/2;
    for(let i = 0; i < 6; i++){
      const a = (Math.PI/3)*i - Math.PI/2;
      const r = 14;
      if(i===0) ctx.moveTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
      else ctx.lineTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffb300';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('💎', cx - 8, cy + 5);
  });

  const c = m.cart;
  ctx.fillStyle = '#455a64';
  ctx.fillRect(c.x + 8, c.y + 8, c.w - 16, c.h - 12);
  ctx.fillStyle = '#607d8b';
  ctx.fillRect(c.x + 4, c.y + 2, c.w - 8, c.h * 0.45);
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(c.x + 14, c.y + c.h, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(c.x + c.w - 14, c.y + c.h, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#777';
  ctx.beginPath();
  ctx.arc(c.x + 14, c.y + c.h, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(c.x + c.w - 14, c.y + c.h, 4, 0, Math.PI*2);
  ctx.fill();

  drawProgress();
}

// ==================== STAGE 3: VOLCANO ====================
let volcano = {};
const VOLCANO_DURATION = 25;

function startVolcano(){
  state = GAME_STATES.VOLCANO;
  stageProgress = 0;
  volcano = {
    player: {x: 150, y: 400, w: 30, h: 50, vy: 0, onGround: true, jumpPower: -12},
    groundY: 450,
    cracks: [],
    lavas: [],
    crackTimer: 0,
    lavaTimer: 0,
    distance: 0,
    particles: [],
    scrollSpeed: 4
  };
  showStageLabel('第三章：火山');
  document.getElementById('controlsHint').textContent = '空格 跳跃';
  document.getElementById('controlsHint').style.opacity = '1';
  setTimeout(() => document.getElementById('controlsHint').style.opacity = '0', 4000);
  volcanoLoop();
}

function volcanoLoop(){
  if(state !== GAME_STATES.VOLCANO) return;
  const v = volcano;
  const p = v.player;

  if((keys[' '] || keys['Space']) && p.onGround){
    p.vy = p.jumpPower;
    p.onGround = false;
  }

  p.vy += 0.6;
  p.y += p.vy;

  if(p.y >= v.groundY - p.h){
    p.y = v.groundY - p.h;
    p.vy = 0;
    p.onGround = true;
  }

  v.distance += 1;
  v.crackTimer++;
  v.lavaTimer++;

  if(v.crackTimer % 100 === 0){
    const cw = 40 + Math.random() * 80;
    v.cracks.push({x: W + 20, w: cw, hit: false});
  }

  if(v.lavaTimer % 180 === 0){
    const lx = 200 + Math.random() * (W - 300);
    v.lavas.push({x: lx, y: v.groundY, timer: 45, active: true, warned: true, warnTimer: 60});
  }

  v.cracks.forEach(c => c.x -= v.scrollSpeed);
  v.lavas = v.lavas.filter(l => l.timer > -20);
  v.lavas.forEach(l => {
    if(l.warnTimer > 0){ l.warnTimer--; return; }
    l.timer--;
  });

  v.cracks = v.cracks.filter(c => c.x > -150);

  const pRect = {x: p.x, y: p.y, w: p.w, h: p.h};
  v.cracks.forEach(c => {
    if(!c.hit && p.onGround && p.x + p.w > c.x && p.x < c.x + c.w && p.y + p.h >= v.groundY - 5){
      c.hit = true;
      damage(25);
    }
  });
  v.lavas.forEach(l => {
    if(l.active && l.warnTimer <= 0 && l.timer > 0){
      const lavaRect = {x: l.x - 25, y: l.y - 80, w: 50, h: 80};
      if(rectCollide(pRect, lavaRect)){
        l.active = false;
        damage(25);
      }
    }
  });

  if(Math.random() < 0.3){
    v.particles.push({x: Math.random()*W, y: -5, vx: (Math.random()-.5)*2, vy: 1+Math.random()*3, life: 60, maxLife: 60});
  }
  v.particles.forEach(pt => {
    pt.x += pt.vx; pt.y += pt.vy; pt.life--;
  });
  v.particles = v.particles.filter(pt => pt.life > 0);

  score += 0.2;

  stageProgress = v.distance / (VOLCANO_DURATION * 60);
  if(stageProgress >= 1){
    score += Math.ceil(hp) * 2;
    victory();
    return;
  }

  drawVolcano(v);
  updateHUD();
  animId = requestAnimationFrame(volcanoLoop);
}

function drawVolcano(v){
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#1a0000');
  grd.addColorStop(1, '#4a0000');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  v.particles.forEach(pt => {
    const alpha = pt.life / pt.maxLife;
    ctx.fillStyle = `rgba(255,${80 + Math.random()*80},0,${alpha * 0.6})`;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 2 + Math.random()*3, 0, Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle = '#2c1810';
  ctx.fillRect(0, v.groundY, W, H - v.groundY);

  ctx.fillStyle = '#4e342e';
  ctx.fillRect(0, v.groundY, W, 3);

  for(let i = 0; i < W; i += 60){
    const glow = Math.sin(Date.now() * 0.003 + i) * 0.3 + 0.3;
    ctx.fillStyle = `rgba(255,60,0,${glow})`;
    ctx.fillRect(i, v.groundY + 5, 40, 8);
  }

  v.cracks.forEach(c => {
    ctx.fillStyle = '#ff3d00';
    ctx.fillRect(c.x, v.groundY, c.w, 6);
    ctx.fillStyle = '#1a0000';
    ctx.fillRect(c.x + 3, v.groundY + 2, c.w - 6, 2);
    ctx.fillStyle = `rgba(255,100,0,${0.4 + Math.sin(Date.now()*0.01)*0.2})`;
    ctx.fillRect(c.x - 5, v.groundY - 15, c.w + 10, 15);
  });

  v.lavas.forEach(l => {
    if(l.warnTimer > 0){
      ctx.fillStyle = `rgba(255,200,0,${0.3 + Math.sin(Date.now()*0.02)*0.2})`;
      ctx.fillRect(l.x - 30, v.groundY - 90, 60, 90);
      ctx.font = 'bold 18px sans-serif';
      ctx.fillStyle = '#ffab00';
      ctx.fillText('⚠', l.x - 8, v.groundY - 95);
      return;
    }
    if(l.timer > 0){
      const progress = l.timer / 45;
      const h = 80 * progress;
      ctx.fillStyle = '#ff6d00';
      ctx.fillRect(l.x - 20, v.groundY - h, 40, h);
      ctx.fillStyle = '#ffab00';
      ctx.fillRect(l.x - 10, v.groundY - h + 10, 20, h - 20);
      ctx.fillStyle = '#fff176';
      ctx.fillRect(l.x - 5, v.groundY - h + 5, 10, 15);
      for(let i = 0; i < 5; i++){
        ctx.fillStyle = `rgba(255,100,0,${0.5 * progress})`;
        ctx.beginPath();
        ctx.arc(l.x + (Math.random()-.5)*40, v.groundY - h - Math.random()*30, 3 + Math.random()*5, 0, Math.PI*2);
        ctx.fill();
      }
    }
  });

  const p = v.player;
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(p.x + 4, p.y + 35, 8, 15);
  ctx.fillRect(p.x + 18, p.y + 35, 8, 15);
  ctx.fillStyle = '#ff8a65';
  ctx.fillRect(p.x + 2, p.y + 10, 26, 25);
  ctx.fillStyle = '#b71c1c';
  ctx.fillRect(p.x, p.y, 30, 14);
  ctx.fillStyle = '#ff5722';
  ctx.fillRect(p.x + 3, p.y + 2, 24, 4);
  ctx.fillStyle = '#333';
  ctx.fillRect(p.x + 8, p.y + 18, 4, 3);
  ctx.fillRect(p.x + 18, p.y + 18, 4, 3);

  if(!p.onGround){
    ctx.strokeStyle = '#ff5722';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x - 5, p.y + 45);
    ctx.lineTo(p.x - 5, p.y + 55);
    ctx.moveTo(p.x + 35, p.y + 45);
    ctx.lineTo(p.x + 35, p.y + 55);
    ctx.stroke();
  }

  drawProgress();
}

// ==================== UTILITIES ====================
function rectCollide(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function drawProgress(){
  const labels = ['密林','矿洞','火山'];
  const colors = ['#2e7d32','#f9a825','#d32f2f'];
  const stageIdx = state - 1;
  const barW = 200, barH = 8;
  const bx = W/2 - barW/2, by = H - 20;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);

  for(let i = 0; i < 3; i++){
    const segW = barW / 3;
    const sx = bx + i * segW;
    const pct = i < stageIdx ? 1 : i === stageIdx ? stageProgress : 0;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(sx, by, segW - 2, barH);
    ctx.fillStyle = colors[i];
    ctx.fillRect(sx, by, (segW - 2) * pct, barH);
  }

  ctx.fillStyle = '#fff';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(labels[stageIdx] + ' ' + Math.floor(stageProgress * 100) + '%', W/2, by - 4);
  ctx.textAlign = 'left';

  drawPopups();
}

function drawPopups(){
  popups.forEach(p => {
    const alpha = p.life / 40;
    ctx.fillStyle = p.color.replace(')', ',' + alpha + ')').replace('rgb', 'rgba');
    if(!p.color.startsWith('rgba')){
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
    }
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(p.text, p.x, p.y - (40 - p.life) * 1.2);
    ctx.globalAlpha = 1;
    p.life--;
  });
  popups = popups.filter(p => p.life > 0);
}

function drawMenuBg(){
  const t = Date.now() * 0.001;
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(0, 0, W, H);
  for(let i = 0; i < 50; i++){
    const x = (Math.sin(t + i * 1.3) * 0.5 + 0.5) * W;
    const y = (Math.cos(t * 0.7 + i * 0.9) * 0.5 + 0.5) * H;
    const colors = ['rgba(46,125,50,0.15)','rgba(249,168,37,0.12)','rgba(211,47,47,0.12)'];
    ctx.fillStyle = colors[i % 3];
    ctx.beginPath();
    ctx.arc(x, y, 15 + Math.sin(t + i) * 8, 0, Math.PI*2);
    ctx.fill();
  }
}

function menuLoop(){
  if(state !== GAME_STATES.MENU) return;
  drawMenuBg();
  requestAnimationFrame(menuLoop);
}

menuLoop();
</script>
