<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼音转换器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="title-icon">🔤</span>
                    拼音转换器
                </h1>
                <p class="app-subtitle">将中文汉字批量转换为拼音</p>
            </div>
        </header>

        <main class="app-main">
            <div class="converter-section">
                <div class="input-section">
                    <div class="section-header">
                        <h2 class="section-title">输入文本</h2>
                        <div class="word-count">
                            <span id="charCount">0</span> 字
                        </div>
                    </div>
                    <textarea 
                        id="inputText" 
                        class="input-textarea"
                        placeholder="请输入或粘贴中文文本..."
                        rows="8"
                    ></textarea>
                    <div class="input-actions">
                        <button id="clearBtn" class="btn btn-secondary">
                            <span class="btn-icon">🗑️</span>
                            清空
                        </button>
                        <button id="convertBtn" class="btn btn-primary">
                            <span class="btn-icon">⚡</span>
                            开始转换
                        </button>
                    </div>
                </div>

                <div class="settings-section">
                    <h3 class="settings-title">转换设置</h3>
                    <div class="settings-grid">
                        <div class="setting-item">
                            <label class="setting-label">声调显示</label>
                            <div class="setting-options">
                                <label class="option-label">
                                    <input type="radio" name="toneMode" value="with" checked>
                                    <span>带声调</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="toneMode" value="without">
                                    <span>无声调</span>
                                </label>
                            </div>
                        </div>
                        <div class="setting-item">
                            <label class="setting-label">分隔方式</label>
                            <div class="setting-options">
                                <label class="option-label">
                                    <input type="radio" name="separator" value="space" checked>
                                    <span>空格</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="separator" value="none">
                                    <span>无分隔</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="separator" value="custom">
                                    <span>自定义</span>
                                </label>
                            </div>
                            <div id="customSeparatorGroup">
                                <input 
                                    type="text" 
                                    id="customSeparator" 
                                    class="custom-separator"
                                    placeholder="-"
                                    maxlength="3"
                                >
                            </div>
                        </div>
                        <div class="setting-item">
                            <label class="setting-label">大小写</label>
                            <div class="setting-options">
                                <label class="option-label">
                                    <input type="radio" name="caseMode" value="lower" checked>
                                    <span>全小写</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="caseMode" value="upper">
                                    <span>全大写</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="caseMode" value="first">
                                    <span>首字母大写</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="output-section">
                    <div class="section-header">
                        <h2 class="section-title">转换结果</h2>
                        <div class="word-count">
                            <span id="resultCount">0</span> 字
                        </div>
                    </div>
                    <div id="outputArea" class="output-area">
                        <canvas id="outputCanvas"></canvas>
                        <div id="outputText" class="output-text"></div>
                    </div>
                    <div id="polyphoneTips" class="polyphone-tips"></div>
                    <div class="output-actions">
                        <button id="copyBtn" class="btn btn-secondary">
                            <span class="btn-icon">📋</span>
                            复制结果
                        </button>
                        <button id="exportBtn" class="btn btn-secondary">
                            <span class="btn-icon">💾</span>
                            导出 TXT
                        </button>
                    </div>
                </div>
            </div>

            <div class="history-section">
                <div class="section-header">
                    <h2 class="section-title">历史记录</h2>
                    <button id="clearHistoryBtn" class="btn btn-small btn-secondary">
                        清空历史
                    </button>
                </div>
                <div id="historyList" class="history-list"></div>
            </div>
        </main>

        <div id="toast" class="toast"></div>

        <div id="polyphoneModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>多音字修正</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <p class="modal-word" id="modalWord"></p>
                    <div class="polyphone-options" id="polyphoneOptions"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary modal-cancel">取消</button>
                    <button class="btn btn-primary modal-confirm">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/pinyinData.js"></script>
    <script src="js/converter.js"></script>
    <script src="js/polyphone.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
