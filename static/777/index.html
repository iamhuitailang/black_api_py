<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运777 - 老虎机游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <header class="game-header">
            <h1 class="neon-text">幸运 777</h1>
            <p class="subtitle">LUCKY SEVENS SLOT MACHINE</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">金币</span>
                <span class="stat-value neon-gold" id="coins">1000</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最高奖</span>
                <span class="stat-value neon-red" id="max-win">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">中奖次数</span>
                <span class="stat-value neon-green" id="win-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">总旋转</span>
                <span class="stat-value neon-blue" id="total-spins">0</span>
            </div>
        </div>

        <div class="machine-frame">
            <div class="machine-top">
                <div class="lamp-row">
                    <div class="lamp lamp-red"></div>
                    <div class="lamp lamp-yellow"></div>
                    <div class="lamp lamp-green"></div>
                    <div class="lamp lamp-blue"></div>
                    <div class="lamp lamp-red"></div>
                    <div class="lamp lamp-yellow"></div>
                    <div class="lamp lamp-green"></div>
                    <div class="lamp lamp-blue"></div>
                </div>
            </div>

            <div class="reels-container">
                <canvas id="reel1" class="reel-canvas" width="180" height="180"></canvas>
                <canvas id="reel2" class="reel-canvas" width="180" height="180"></canvas>
                <canvas id="reel3" class="reel-canvas" width="180" height="180"></canvas>
                <div class="payline-indicator"></div>
            </div>

            <div class="win-display" id="win-display">
                <span id="win-message"></span>
            </div>

            <div class="bet-section">
                <div class="bet-label">下注金额</div>
                <div class="bet-buttons">
                    <button class="bet-btn" data-bet="10">10</button>
                    <button class="bet-btn" data-bet="50">50</button>
                    <button class="bet-btn" data-bet="100">100</button>
                    <button class="bet-btn bet-max" data-bet="max">最大</button>
                </div>
                <div class="current-bet">
                    <span class="bet-label">当前下注: </span>
                    <span class="bet-amount neon-gold" id="current-bet">10</span>
                </div>
            </div>

            <div class="controls-section">
                <div class="lever-container">
                    <div class="lever" id="lever">
                        <div class="lever-knob"></div>
                        <div class="lever-handle"></div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="control-btn start-btn" id="start-btn">开始游戏</button>
                    <button class="control-btn spin-btn" id="spin-btn">旋转</button>
                    <button class="control-btn pause-btn" id="pause-btn">暂停</button>
                    <button class="control-btn restart-btn" id="restart-btn">重新开始</button>
                </div>
            </div>

            <div class="machine-bottom">
                <div class="lamp-row">
                    <div class="lamp lamp-blue"></div>
                    <div class="lamp lamp-green"></div>
                    <div class="lamp lamp-yellow"></div>
                    <div class="lamp lamp-red"></div>
                    <div class="lamp lamp-blue"></div>
                    <div class="lamp lamp-green"></div>
                    <div class="lamp lamp-yellow"></div>
                    <div class="lamp lamp-red"></div>
                </div>
            </div>
        </div>

        <div class="paytable-section">
            <h3 class="paytable-title neon-text">中奖规则</h3>
            <div class="paytable-grid">
                <div class="paytable-item jackpot">
                    <span class="paytable-symbols">💰 💰 💰</span>
                    <span class="paytable-multiplier">200倍</span>
                </div>
                <div class="paytable-item">
                    <span class="paytable-symbols">💎 💎 💎</span>
                    <span class="paytable-multiplier">100倍</span>
                </div>
                <div class="paytable-item">
                    <span class="paytable-symbols">🔔 🔔 🔔</span>
                    <span class="paytable-multiplier">80倍</span>
                </div>
                <div class="paytable-item">
                    <span class="paytable-symbols">⭐ ⭐ ⭐</span>
                    <span class="paytable-multiplier">50倍</span>
                </div>
                <div class="paytable-item">
                    <span class="paytable-symbols">🍎 🍎 🍎</span>
                    <span class="paytable-multiplier">20倍</span>
                </div>
                <div class="paytable-item">
                    <span class="paytable-symbols">🍋 🍋 🍋</span>
                    <span class="paytable-multiplier">15倍</span>
                </div>
                <div class="paytable-item">
                    <span class="paytable-symbols">🍊 🍊 🍊</span>
                    <span class="paytable-multiplier">10倍</span>
                </div>
                <div class="paytable-item">
                    <span class="paytable-symbols">🍒 🍒 🍒</span>
                    <span class="paytable-multiplier">5倍</span>
                </div>
                <div class="paytable-item special">
                    <span class="paytable-symbols">🍒 🍒 ✨</span>
                    <span class="paytable-multiplier">2倍</span>
                </div>
                <div class="paytable-item special">
                    <span class="paytable-symbols">🍒 ✨ ✨</span>
                    <span class="paytable-multiplier">1倍</span>
                </div>
                <div class="paytable-item special">
                    <span class="paytable-symbols">� 任意两相同</span>
                    <span class="paytable-multiplier">1倍</span>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="game-over-modal">
            <div class="modal-content">
                <h2 class="modal-title neon-red">游戏结束</h2>
                <p class="modal-message">金币不足！请补充金币继续游戏。</p>
                <div class="modal-buttons">
                    <button class="modal-btn" id="add-coins-btn">补充金币</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="start-modal">
            <div class="modal-content">
                <h2 class="modal-title neon-text">幸运 777</h2>
                <p class="modal-welcome">欢迎来到幸运老虎机！</p>
                <p class="modal-instruction">点击「开始游戏」按钮开始你的幸运之旅</p>
                <div class="modal-buttons">
                    <button class="modal-btn primary" id="modal-start-btn">开始游戏</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
