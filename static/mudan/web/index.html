<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="牡丹国风M站 - 传承千年花韵，探索牡丹文化">
    <meta name="theme-color" content="#C41E3A">
    <title>牡丹国风 - 传承千年花韵</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- 加载遮罩 -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="peony-spinner"></div>
            <span>加载中...</span>
        </div>
    </div>

    <!-- 主容器 -->
    <div id="app" class="app-container">
        <!-- 顶部导航栏 -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🌸</span>
                    <span class="logo-text">牡丹国风</span>
                </div>
                <button id="menu-btn" class="menu-btn" aria-label="打开菜单">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- 侧边菜单 (动态渲染) -->
        <nav id="side-menu" class="side-menu" aria-label="侧边导航">
            <div class="menu-header">
                <span class="menu-logo">🌸 牡丹国风</span>
                <button id="close-menu" class="close-menu" aria-label="关闭菜单">&times;</button>
            </div>
            <ul class="menu-list" id="side-menu-list">
            </ul>
            <div class="menu-footer">
                <p>© 2024 牡丹国风</p>
            </div>
        </nav>

        <div id="menu-overlay" class="menu-overlay"></div>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- Banner轮播区域 -->
            <section id="banner-section" class="banner-section">
                <div class="banner-container">
                    <div id="banner-slider" class="banner-slider" aria-live="polite">
                    </div>
                    <div class="banner-indicators" id="banner-indicators" role="tablist">
                    </div>
                    <div class="banner-nav">
                        <button class="banner-prev" id="banner-prev" aria-label="上一张">&#10094;</button>
                        <button class="banner-next" id="banner-next" aria-label="下一张">&#10095;</button>
                    </div>
                </div>
            </section>

            <!-- Tab导航栏 (动态渲染) -->
            <section class="tab-nav-section">
                <div class="tab-nav-container">
                    <div class="tab-nav-scroll">
                        <div class="tab-nav-list" id="tab-nav-list" role="tablist">
                        </div>
                    </div>
                </div>
            </section>

            <!-- 内容区域 (动态渲染) -->
            <section class="content-section" id="content-section">
            </section>
        </main>

        <!-- 底部导航栏 (动态渲染) -->
        <nav class="bottom-nav" id="bottom-nav" aria-label="底部导航">
        </nav>

        <!-- 返回顶部按钮 -->
        <button id="scroll-to-top" class="scroll-to-top" aria-label="返回顶部" style="display: none;">
            <span>↑</span>
        </button>
    </div>

    <!-- JavaScript文件 -->
    <script src="js/utils.js"></script>
    <script src="js/banner.js"></script>
    <script src="js/tab.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
