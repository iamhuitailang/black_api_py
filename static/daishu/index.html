<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袋鼠平台跳跃 · 闯关冒险 🦘</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="1200" height="700"></canvas>
        
        <div id="start-screen" class="screen">
            <h1 class="game-title">🦘 星空秘境 🦘</h1>
            <p class="game-subtitle">袋鼠平台跳跃 · 闯关冒险</p>
            <button id="start-btn" class="btn btn-primary">开始游戏</button>
            <div class="controls-info">
                <p>← → 移动 | ↑ / 空格 跳跃 | 支持二段跳</p>
                <p>P 暂停游戏</p>
            </div>
        </div>
        
        <div id="pause-screen" class="screen hidden">
            <h2 class="menu-title">游戏暂停</h2>
            <button id="resume-btn" class="btn btn-primary">继续游戏</button>
            <button id="restart-btn" class="btn btn-secondary">重新开始</button>
            <button id="exit-btn" class="btn btn-danger">退出游戏</button>
        </div>
        
        <div id="gameover-screen" class="screen hidden">
            <h2 class="menu-title">闯关失败</h2>
            <p id="gameover-reason" class="gameover-text"></p>
            <button id="retry-btn" class="btn btn-primary">再试一次</button>
            <button id="gameover-exit-btn" class="btn btn-secondary">返回主菜单</button>
        </div>
        
        <div id="levelup-screen" class="screen hidden">
            <h2 class="menu-title">🎉 关卡通过 🎉</h2>
            <p id="levelup-text" class="levelup-text"></p>
            <button id="next-level-btn" class="btn btn-primary">下一关</button>
        </div>
        
        <div id="victory-screen" class="screen hidden">
            <h1 class="victory-title">🏆 恭喜通关 🏆</h1>
            <p class="victory-text">你成功穿越了星空秘境！</p>
            <button id="victory-restart-btn" class="btn btn-primary">重新挑战</button>
            <button id="victory-exit-btn" class="btn btn-secondary">返回主菜单</button>
        </div>
        
        <div id="game-ui" class="hidden">
            <div class="hud">
                <div class="hud-item">
                    <span class="hud-label">关卡</span>
                    <span id="level-display" class="hud-value">1 / 3</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">生命</span>
                    <span id="lives-display" class="hud-value">❤️❤️❤️</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">时间</span>
                    <span id="time-display" class="hud-value">00:00</span>
                </div>
                <button id="pause-btn" class="btn-pause">⏸</button>
            </div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/input.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/player.js"></script>
    <script src="js/platform.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/trap.js"></script>
    <script src="js/level.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
