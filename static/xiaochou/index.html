<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小丑气球 · 疯狂堆叠 🎈</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-overlay">
            <div id="score-display" class="hidden">
                <div class="score-item">
                    <span class="label">分数</span>
                    <span id="current-score">0</span>
                </div>
                <div class="score-item">
                    <span class="label">高度</span>
                    <span id="current-height">0</span>m
                </div>
                <div class="score-item">
                    <span class="label">最高</span>
                    <span id="best-score">0</span>
                </div>
            </div>
            
            <button id="pause-btn" class="icon-btn hidden">⏸️</button>
        </div>
        
        <div id="start-screen" class="menu-screen">
            <div class="menu-content">
                <h1 class="game-title">🎈 小丑气球 🎈</h1>
                <h2 class="game-subtitle">疯狂堆叠</h2>
                <p class="game-desc">操控小丑发射彩色气球，搭建超高气球塔！</p>
                
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="endless">
                        <span class="mode-icon">♾️</span>
                        <span class="mode-name">无尽模式</span>
                        <span class="mode-desc">自由堆叠冲击纪录</span>
                    </button>
                    <button class="mode-btn" data-mode="timed">
                        <span class="mode-icon">⏱️</span>
                        <span class="mode-name">限时挑战</span>
                        <span class="mode-desc">60秒冲分</span>
                    </button>
                    <button class="mode-btn" data-mode="obstacle">
                        <span class="mode-icon">🚧</span>
                        <span class="mode-name">障碍闯关</span>
                        <span class="mode-desc">空中挡板挑战</span>
                    </button>
                </div>
                
                <button id="start-btn" class="primary-btn">开始游戏</button>
                
                <div class="instructions">
                    <p>👆 左右滑动调整方向</p>
                    <p>👆 点击发射 · 长按蓄力</p>
                </div>
            </div>
        </div>
        
        <div id="pause-screen" class="menu-screen hidden">
            <div class="menu-content">
                <h2 class="menu-title">游戏暂停</h2>
                <button id="resume-btn" class="primary-btn">继续游戏</button>
                <button id="restart-btn" class="secondary-btn">重新开始</button>
                <button id="quit-btn" class="secondary-btn">返回主页</button>
            </div>
        </div>
        
        <div id="gameover-screen" class="menu-screen hidden">
            <div class="menu-content">
                <h2 class="menu-title">🎊 游戏结束 🎊</h2>
                <div class="result-stats">
                    <div class="result-item">
                        <span class="result-label">最终得分</span>
                        <span id="final-score" class="result-value">0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">堆叠高度</span>
                        <span id="final-height" class="result-value">0m</span>
                    </div>
                    <div class="result-item highlight">
                        <span class="result-label">历史最高</span>
                        <span id="final-best" class="result-value">0</span>
                    </div>
                </div>
                <button id="retry-btn" class="primary-btn">再来一局</button>
                <button id="home-btn" class="secondary-btn">返回主页</button>
            </div>
        </div>
        
        <div id="power-indicator" class="hidden">
            <div class="power-bar">
                <div id="power-fill" class="power-fill"></div>
            </div>
            <span class="power-text">蓄力中...</span>
        </div>
        
        <div id="timer-display" class="hidden">
            <span id="timer-value">60</span>s
        </div>
    </div>
    
    <script src="js/constants.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/balloon.js"></script>
    <script src="js/clown.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/obstacle.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
