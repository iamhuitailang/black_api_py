<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫猫拆家大战 🐱</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1200" height="700"></canvas>
        
        <div id="start-screen" class="screen">
            <div class="menu-box">
                <h1>🐱 猫猫拆家大战</h1>
                <p class="subtitle">控制调皮布偶猫，在客厅里尽情拆家！</p>
                <div class="cat-info">
                    <div class="info-item">
                        <span>❤️ 生命值</span>
                        <span>3</span>
                    </div>
                    <div class="info-item">
                        <span>⚔️ 攻击力</span>
                        <span>12</span>
                    </div>
                    <div class="info-item">
                        <span>🏃 速度</span>
                        <span>中</span>
                    </div>
                    <div class="info-item">
                        <span>💥 必杀技</span>
                        <span>30分</span>
                    </div>
                </div>
                <div class="controls-info">
                    <p><strong>操作说明：</strong></p>
                    <p>← → 左右移动 | ↑ 跳跃 | ↓ 趴下躲藏</p>
                    <p>Z 抓挠 | X 推倒 | C 啃咬 | V 必杀技</p>
                    <p>ESC 暂停游戏</p>
                </div>
                <button id="startBtn" class="btn primary">开始游戏</button>
            </div>
        </div>

        <div id="pause-screen" class="screen hidden">
            <div class="menu-box">
                <h2>⏸️ 游戏暂停</h2>
                <button id="resumeBtn" class="btn primary">继续游戏</button>
                <button id="restartBtnPause" class="btn secondary">重新开始</button>
                <button id="quitBtn" class="btn danger">退出游戏</button>
            </div>
        </div>

        <div id="end-screen" class="screen hidden">
            <div class="menu-box">
                <h2 id="endTitle">游戏结束</h2>
                <p id="endMessage"></p>
                <div class="final-score">
                    <span>最终得分：</span>
                    <span id="finalScore">0</span>
                </div>
                <button id="restartBtnEnd" class="btn primary">再来一局</button>
                <button id="backToMenuBtn" class="btn secondary">返回主菜单</button>
            </div>
        </div>

        <div id="hud" class="hud hidden">
            <div class="hud-item">
                <span>⏱️ 时间</span>
                <span id="timer">02:00</span>
            </div>
            <div class="hud-item">
                <span>⭐ 积分</span>
                <span id="score">0</span>
            </div>
            <div class="hud-item">
                <span>❤️ 生命</span>
                <span id="lives">3</span>
            </div>
            <button id="pauseBtn" class="btn small">暂停</button>
        </div>

        <div id="action-hint" class="action-hint hidden"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/cat.js"></script>
    <script src="js/furniture.js"></script>
    <script src="js/owner.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
