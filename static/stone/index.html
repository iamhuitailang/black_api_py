<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落石躲避 - 山间峡谷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, 
                #87CEEB 0%, 
                #98FB98 40%, 
                #8B7355 70%, 
                #696969 100%);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(ellipse at 10% 90%, rgba(139, 115, 85, 0.8) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 90%, rgba(139, 115, 85, 0.8) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(105, 105, 105, 0.9) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        #game-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #game-canvas {
            border: 4px solid #5D4037;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: linear-gradient(180deg, 
                #87CEEB 0%, 
                #B0E0E6 30%, 
                #F5F5DC 60%, 
                #8B7355 85%, 
                #696969 100%);
        }

        #ui-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #2E7D32;
        }

        #controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        #start-btn {
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            color: white;
        }

        #pause-btn {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
            display: none;
        }

        #restart-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            display: none;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
        }

        #game-over-screen {
            display: none;
        }

        .screen-title {
            font-size: 36px;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .screen-info {
            font-size: 18px;
            color: #E0E0E0;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }

        .final-score {
            font-size: 28px;
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .game-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #FF5722, #E64A19);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        .game-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.4);
        }

        #warning-border {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 0px solid transparent;
            border-radius: 10px;
            pointer-events: none;
            z-index: 3;
            transition: border 0.1s ease;
        }

        #warning-border.warning {
            border: 6px solid rgba(255, 0, 0, 0.8);
            animation: warningFlash 0.3s infinite alternate;
        }

        @keyframes warningFlash {
            0% { border-color: rgba(255, 0, 0, 0.3); }
            100% { border-color: rgba(255, 0, 0, 0.8); }
        }

        #hit-effect {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            z-index: 4;
            border-radius: 10px;
            transition: background 0.1s ease;
        }

        #hit-effect.hit {
            background: rgba(255, 0, 0, 0.6);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 5;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-panel">
            <div class="stat-item">
                <span class="stat-label">当前得分</span>
                <span class="stat-value" id="current-score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">总得分</span>
                <span class="stat-value" id="total-score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最长生存时间</span>
                <span class="stat-value" id="longest-time">0秒</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">躲避石块数</span>
                <span class="stat-value" id="dodged-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">当前时间</span>
                <span class="stat-value" id="current-time">0秒</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">难度等级</span>
                <span class="stat-value" id="difficulty-level">0</span>
            </div>
        </div>

        <div style="position: relative;">
            <canvas id="game-canvas" width="600" height="500"></canvas>
            <div id="warning-border"></div>
            <div id="hit-effect"></div>
            
            <div id="start-screen">
                <h2 class="screen-title">🏔️ 落石躲避 🏔️</h2>
                <div class="screen-info">
                    使用 ← → 方向键控制角色移动<br>
                    躲避从上方落下的石块<br>
                    坚持越久，得分越高！
                </div>
                <button class="game-btn" id="start-game-btn">开始游戏</button>
            </div>

            <div id="game-over-screen">
                <h2 class="screen-title">💥 游戏结束 💥</h2>
                <div class="final-score" id="final-score-display">最终得分: 0</div>
                <div class="screen-info" id="game-over-stats">
                    生存时间: 0秒<br>
                    躲避石块: 0个
                </div>
                <button class="game-btn" id="restart-game-btn">重新开始</button>
            </div>
        </div>

        <div id="controls">
            <button class="btn" id="start-btn">开始</button>
            <button class="btn" id="pause-btn">暂停</button>
            <button class="btn" id="restart-btn">重新开始</button>
        </div>
    </div>

    <div id="instructions">使用 ← → 方向键移动角色</div>

    <script>
        class StoneDodgerGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvasWidth = this.canvas.width;
                this.canvasHeight = this.canvas.height;

                this.player = {
                    x: this.canvasWidth / 2 - 20,
                    y: this.canvasHeight - 60,
                    width: 40,
                    height: 50,
                    speed: 8,
                    color: '#4CAF50'
                };

                this.stones = [];
                this.stoneSize = 30;
                this.stoneSpeed = 2;
                this.stoneSpawnInterval = 1000;
                this.lastStoneSpawn = 0;

                this.gameState = 'start';
                this.score = 0;
                this.totalScore = 0;
                this.dodgedStones = 0;
                this.gameTime = 0;
                this.longestTime = 0;
                this.startTime = 0;
                this.difficultyLevel = 0;

                this.keys = {
                    left: false,
                    right: false
                };

                this.warningBorder = document.getElementById('warning-border');
                this.hitEffect = document.getElementById('hit-effect');
                this.gameContainer = document.getElementById('game-container');

                this.initializeElements();
                this.loadGameData();
                this.bindEvents();
                this.updateUI();
            }

            initializeElements() {
                this.currentScoreEl = document.getElementById('current-score');
                this.totalScoreEl = document.getElementById('total-score');
                this.longestTimeEl = document.getElementById('longest-time');
                this.dodgedCountEl = document.getElementById('dodged-count');
                this.currentTimeEl = document.getElementById('current-time');
                this.difficultyLevelEl = document.getElementById('difficulty-level');
                this.startScreen = document.getElementById('start-screen');
                this.gameOverScreen = document.getElementById('game-over-screen');
                this.finalScoreDisplay = document.getElementById('final-score-display');
                this.gameOverStats = document.getElementById('game-over-stats');
                this.startGameBtn = document.getElementById('start-game-btn');
                this.restartGameBtn = document.getElementById('restart-game-btn');
                this.startBtn = document.getElementById('start-btn');
                this.pauseBtn = document.getElementById('pause-btn');
                this.restartBtn = document.getElementById('restart-btn');
                this.instructions = document.getElementById('instructions');
            }

            loadGameData() {
                const savedData = localStorage.getItem('stoneDodgerGameData');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    this.totalScore = data.totalScore || 0;
                    this.longestTime = data.longestTime || 0;
                    
                    if (data.gameState && data.gameState !== 'start' && data.gameState !== 'gameover') {
                        this.gameState = data.gameState;
                        this.score = data.score || 0;
                        this.dodgedStones = data.dodgedStones || 0;
                        this.gameTime = data.gameTime || 0;
                        this.difficultyLevel = data.difficultyLevel || 0;
                        this.player.x = data.playerX || this.canvasWidth / 2 - 20;
                        
                        if (data.stones) {
                            this.stones = data.stones;
                        }
                        
                        if (data.startTime) {
                            const elapsed = (Date.now() - data.startTime) / 1000;
                            if (this.gameState === 'playing') {
                                this.gameTime += elapsed;
                                this.updateDifficulty();
                            }
                        }
                        
                        this.startTime = Date.now();
                        
                        if (this.gameState === 'playing') {
                            this.startScreen.style.display = 'none';
                            this.gameOverScreen.style.display = 'none';
                            this.startBtn.style.display = 'none';
                            this.pauseBtn.style.display = 'block';
                            this.restartBtn.style.display = 'block';
                            this.instructions.style.display = 'block';
                            requestAnimationFrame(() => this.gameLoop());
                        } else if (this.gameState === 'paused') {
                            this.startScreen.style.display = 'none';
                            this.gameOverScreen.style.display = 'none';
                            this.startBtn.style.display = 'none';
                            this.pauseBtn.style.display = 'block';
                            this.restartBtn.style.display = 'block';
                            this.pauseBtn.textContent = '继续';
                            this.instructions.style.display = 'block';
                            this.updateDifficulty();
                            this.render();
                            this.updateUI();
                        }
                    }
                }
                this.updateUI();
            }

            saveGameData() {
                const data = {
                    gameState: this.gameState,
                    score: this.score,
                    totalScore: this.totalScore,
                    dodgedStones: this.dodgedStones,
                    gameTime: this.gameTime,
                    longestTime: this.longestTime,
                    difficultyLevel: this.difficultyLevel,
                    playerX: this.player.x,
                    stones: this.stones,
                    startTime: this.gameState === 'playing' ? Date.now() : null
                };
                localStorage.setItem('stoneDodgerGameData', JSON.stringify(data));
            }

            bindEvents() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') this.keys.left = true;
                    if (e.key === 'ArrowRight') this.keys.right = true;
                    if (e.key === ' ' && this.gameState === 'playing') {
                        this.pauseGame();
                    }
                });

                document.addEventListener('keyup', (e) => {
                    if (e.key === 'ArrowLeft') this.keys.left = false;
                    if (e.key === 'ArrowRight') this.keys.right = false;
                });

                this.startGameBtn.addEventListener('click', () => this.startGame());
                this.restartGameBtn.addEventListener('click', () => this.restartGame());
                this.startBtn.addEventListener('click', () => this.startGame());
                this.pauseBtn.addEventListener('click', () => {
                    if (this.gameState === 'playing') {
                        this.pauseGame();
                    } else if (this.gameState === 'paused') {
                        this.resumeGame();
                    }
                });
                this.restartBtn.addEventListener('click', () => this.restartGame());

                window.addEventListener('beforeunload', () => {
                    this.saveGameData();
                });

                setInterval(() => {
                    if (this.gameState === 'playing') {
                        this.saveGameData();
                    }
                }, 5000);
            }

            startGame() {
                this.gameState = 'playing';
                this.score = 0;
                this.dodgedStones = 0;
                this.gameTime = 0;
                this.difficultyLevel = 0;
                this.stoneSpeed = 2;
                this.stoneSpawnInterval = 1000;
                this.stones = [];
                
                this.player.x = this.canvasWidth / 2 - this.player.width / 2;
                this.player.y = this.canvasHeight - 60;
                
                this.startTime = Date.now();
                this.lastStoneSpawn = Date.now();
                
                this.startScreen.style.display = 'none';
                this.gameOverScreen.style.display = 'none';
                this.startBtn.style.display = 'none';
                this.pauseBtn.style.display = 'block';
                this.pauseBtn.textContent = '暂停';
                this.restartBtn.style.display = 'block';
                this.instructions.style.display = 'block';
                
                this.updateUI();
                this.saveGameData();
                requestAnimationFrame(() => this.gameLoop());
            }

            pauseGame() {
                if (this.gameState === 'playing') {
                    this.gameState = 'paused';
                    this.pauseBtn.textContent = '继续';
                    this.saveGameData();
                }
            }

            resumeGame() {
                if (this.gameState === 'paused') {
                    this.gameState = 'playing';
                    this.pauseBtn.textContent = '暂停';
                    this.startTime = Date.now();
                    this.saveGameData();
                    requestAnimationFrame(() => this.gameLoop());
                }
            }

            restartGame() {
                this.startGame();
            }

            gameLoop() {
                if (this.gameState !== 'playing') return;

                const currentTime = Date.now();
                this.gameTime = (currentTime - this.startTime) / 1000;
                
                this.updateDifficulty();
                this.update();
                this.render();
                this.updateUI();
                
                requestAnimationFrame(() => this.gameLoop());
            }

            updateDifficulty() {
                const previousLevel = this.difficultyLevel;
                
                if (this.gameTime >= 30) {
                    this.difficultyLevel = 3;
                    this.stoneSpeed = 5;
                    this.stoneSpawnInterval = 600;
                } else if (this.gameTime >= 20) {
                    this.difficultyLevel = 2;
                    this.stoneSpeed = 4;
                    this.stoneSpawnInterval = 700;
                } else if (this.gameTime >= 10) {
                    this.difficultyLevel = 1;
                    this.stoneSpeed = 3;
                    this.stoneSpawnInterval = 800;
                } else {
                    this.difficultyLevel = 0;
                    this.stoneSpeed = 2;
                    this.stoneSpawnInterval = 1000;
                }

                if (this.difficultyLevel >= 2) {
                    this.warningBorder.classList.add('warning');
                } else {
                    this.warningBorder.classList.remove('warning');
                }
            }

            update() {
                if (this.keys.left) {
                    this.player.x -= this.player.speed;
                    if (this.player.x < 0) this.player.x = 0;
                }
                if (this.keys.right) {
                    this.player.x += this.player.speed;
                    if (this.player.x > this.canvasWidth - this.player.width) {
                        this.player.x = this.canvasWidth - this.player.width;
                    }
                }

                const currentTime = Date.now();
                if (currentTime - this.lastStoneSpawn > this.stoneSpawnInterval) {
                    this.spawnStone();
                    this.lastStoneSpawn = currentTime;
                }

                for (let i = this.stones.length - 1; i >= 0; i--) {
                    const stone = this.stones[i];
                    stone.y += this.stoneSpeed;

                    if (this.checkCollision(this.player, stone)) {
                        this.gameOver();
                        return;
                    }

                    if (stone.y > this.canvasHeight) {
                        this.stones.splice(i, 1);
                        this.dodgedStones++;
                        this.score += 10;
                    }
                }
            }

            spawnStone() {
                const x = Math.random() * (this.canvasWidth - this.stoneSize);
                this.stones.push({
                    x: x,
                    y: -this.stoneSize,
                    width: this.stoneSize,
                    height: this.stoneSize,
                    rotation: Math.random() * Math.PI * 2
                });
            }

            checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            gameOver() {
                this.gameState = 'gameover';
                
                this.hitEffect.classList.add('hit');
                this.gameContainer.classList.add('shake');
                
                setTimeout(() => {
                    this.hitEffect.classList.remove('hit');
                    this.gameContainer.classList.remove('shake');
                }, 500);

                if (this.gameTime > this.longestTime) {
                    this.longestTime = this.gameTime;
                }
                this.totalScore += this.score;

                this.finalScoreDisplay.textContent = `最终得分: ${this.score}`;
                this.gameOverStats.innerHTML = `
                    生存时间: ${Math.floor(this.gameTime)}秒<br>
                    躲避石块: ${this.dodgedStones}个
                `;
                
                this.gameOverScreen.style.display = 'flex';
                this.pauseBtn.style.display = 'none';
                this.instructions.style.display = 'none';
                this.warningBorder.classList.remove('warning');
                
                this.updateUI();
                this.saveGameData();
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
                
                this.drawBackground();
                this.drawPlayer();
                this.drawStones();
            }

            drawBackground() {
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvasHeight);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(0.4, '#B0E0E6');
                gradient.addColorStop(0.7, '#F5F5DC');
                gradient.addColorStop(0.9, '#8B7355');
                gradient.addColorStop(1, '#696969');
                
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvasWidth, this.canvasHeight);

                this.ctx.fillStyle = '#7CB342';
                this.ctx.beginPath();
                this.ctx.moveTo(0, this.canvasHeight - 100);
                this.ctx.lineTo(100, this.canvasHeight - 150);
                this.ctx.lineTo(200, this.canvasHeight - 120);
                this.ctx.lineTo(300, this.canvasHeight - 180);
                this.ctx.lineTo(400, this.canvasHeight - 130);
                this.ctx.lineTo(500, this.canvasHeight - 160);
                this.ctx.lineTo(600, this.canvasHeight - 140);
                this.ctx.lineTo(600, this.canvasHeight);
                this.ctx.lineTo(0, this.canvasHeight);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.fillStyle = '#8BC34A';
                this.ctx.beginPath();
                this.ctx.moveTo(0, this.canvasHeight - 60);
                this.ctx.lineTo(150, this.canvasHeight - 90);
                this.ctx.lineTo(300, this.canvasHeight - 70);
                this.ctx.lineTo(450, this.canvasHeight - 100);
                this.ctx.lineTo(600, this.canvasHeight - 80);
                this.ctx.lineTo(600, this.canvasHeight);
                this.ctx.lineTo(0, this.canvasHeight);
                this.ctx.closePath();
                this.ctx.fill();
            }

            drawPlayer() {
                this.ctx.save();
                
                this.ctx.fillStyle = '#4CAF50';
                this.ctx.beginPath();
                this.ctx.roundRect(
                    this.player.x, 
                    this.player.y, 
                    this.player.width, 
                    this.player.height,
                    10
                );
                this.ctx.fill();
                
                this.ctx.fillStyle = '#388E3C';
                this.ctx.beginPath();
                this.ctx.roundRect(
                    this.player.x + 5, 
                    this.player.y + 10, 
                    this.player.width - 10, 
                    10,
                    5
                );
                this.ctx.fill();
                
                this.ctx.fillStyle = 'white';
                this.ctx.beginPath();
                this.ctx.arc(this.player.x + 12, this.player.y + 15, 4, 0, Math.PI * 2);
                this.ctx.arc(this.player.x + 28, this.player.y + 15, 4, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.fillStyle = '#333';
                this.ctx.beginPath();
                this.ctx.arc(this.player.x + 12, this.player.y + 15, 2, 0, Math.PI * 2);
                this.ctx.arc(this.player.x + 28, this.player.y + 15, 2, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.restore();
            }

            drawStones() {
                this.stones.forEach(stone => {
                    this.ctx.save();
                    this.ctx.translate(
                        stone.x + stone.width / 2,
                        stone.y + stone.height / 2
                    );
                    this.ctx.rotate(stone.rotation);
                    
                    const stoneGradient = this.ctx.createRadialGradient(
                        -5, -5, 0,
                        0, 0, stone.width / 2
                    );
                    stoneGradient.addColorStop(0, '#9E9E9E');
                    stoneGradient.addColorStop(0.5, '#757575');
                    stoneGradient.addColorStop(1, '#616161');
                    
                    this.ctx.fillStyle = stoneGradient;
                    this.ctx.beginPath();
                    this.ctx.roundRect(
                        -stone.width / 2,
                        -stone.height / 2,
                        stone.width,
                        stone.height,
                        8
                    );
                    this.ctx.fill();
                    
                    this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                    this.ctx.lineWidth = 1;
                    this.ctx.beginPath();
                    this.ctx.moveTo(-8, -8);
                    this.ctx.lineTo(5, 5);
                    this.ctx.moveTo(-5, 8);
                    this.ctx.lineTo(8, -5);
                    this.ctx.stroke();
                    
                    this.ctx.restore();
                });
            }

            updateUI() {
                this.currentScoreEl.textContent = this.score;
                this.totalScoreEl.textContent = this.totalScore;
                this.longestTimeEl.textContent = `${Math.floor(this.longestTime)}秒`;
                this.dodgedCountEl.textContent = this.dodgedStones;
                this.currentTimeEl.textContent = `${Math.floor(this.gameTime)}秒`;
                this.difficultyLevelEl.textContent = this.difficultyLevel;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new StoneDodgerGame();
        });
    </script>
</body>
</html>
