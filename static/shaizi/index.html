<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运投手 - 骰子游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wood-table">
        <div class="game-container">
            <div class="game-header">
                <h1 class="game-title">🎲 幸运投手 🎲</h1>
                <p class="game-subtitle">与电脑一决高下！</p>
            </div>

            <div class="stats-board">
                <div class="stat-item">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-value" id="wins-count">0</div>
                    <div class="stat-label">胜利</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">😢</div>
                    <div class="stat-value" id="losses-count">0</div>
                    <div class="stat-label">失败</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">🤝</div>
                    <div class="stat-value" id="draws-count">0</div>
                    <div class="stat-label">平局</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="streak-count">0</div>
                    <div class="stat-label">连胜</div>
                </div>
            </div>

            <div class="game-info">
                <div class="info-item">
                    <span class="info-label">比赛时间:</span>
                    <span class="info-value" id="game-time">00:00</span>
                </div>
                <div class="info-item">
                    <span class="info-label">最高连胜:</span>
                    <span class="info-value" id="max-streak">0</span>
                </div>
            </div>

            <div class="dice-area">
                <div class="player-section">
                    <h3 class="player-name">你</h3>
                    <div class="dice-wrapper">
                        <canvas id="player-dice" width="120" height="120"></canvas>
                        <div class="dice-value" id="player-value">-</div>
                    </div>
                </div>

                <div class="vs-section">
                    <div class="vs-text">VS</div>
                </div>

                <div class="player-section">
                    <h3 class="player-name">电脑</h3>
                    <div class="dice-wrapper">
                        <canvas id="computer-dice" width="120" height="120"></canvas>
                        <div class="dice-value" id="computer-value">-</div>
                    </div>
                </div>
            </div>

            <div class="result-area">
                <div class="result-message" id="result-message">点击投掷开始游戏！</div>
            </div>

            <div class="controls">
                <button class="control-btn roll-btn" id="roll-btn">
                    <span class="btn-icon">🎲</span>
                    <span class="btn-text">投掷</span>
                </button>
                <button class="control-btn pause-btn" id="pause-btn">
                    <span class="btn-icon">⏸️</span>
                    <span class="btn-text">暂停</span>
                </button>
                <button class="control-btn restart-btn" id="restart-btn">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-text">重新开始</span>
                </button>
            </div>

            <div class="instructions">
                <h4>📖 游戏规则</h4>
                <p>点击"投掷"按钮开始，与电脑各掷一枚骰子，点数大者获胜！</p>
                <p>刷新页面会保持所有游戏数据和当前状态。</p>
            </div>
        </div>
    </div>

    <div class="ripple-container" id="ripple-container"></div>

    <script src="js/game.js"></script>
</body>
</html>
