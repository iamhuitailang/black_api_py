<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>团购详情 - 接龙</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="back-btn" onclick="window.location.href='index.html'">←</div>
        </div>
        <h1>团购详情</h1>
        <div class="header-right">
            <div class="admin-btn" onclick="window.location.href='admin.html'" title="团长管理">
                ⚙️
            </div>
        </div>
    </div>

    <div class="container">
        <div id="detailContent">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>我要接龙</h3>
                <span class="close" onclick="closeOrderModal()">&times;</span>
            </div>
            <form id="orderForm" class="order-form">
                <div class="form-item">
                    <label>楼栋号 <span class="required">*</span></label>
                    <input type="text" id="building" placeholder="例如：3栋" required>
                </div>
                <div class="form-item">
                    <label>房间号</label>
                    <input type="text" id="room" placeholder="例如：501">
                </div>
                <div class="form-item">
                    <label>手机号 <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" required>
                </div>
                <div class="form-item">
                    <label>数量 <span class="required">*</span></label>
                    <div class="quantity-selector">
                        <button type="button" class="qty-btn" onclick="changeQuantity(-1)">-</button>
                        <input type="number" id="quantity" value="1" min="1" readonly>
                        <button type="button" class="qty-btn" onclick="changeQuantity(1)">+</button>
                    </div>
                </div>
                <div class="form-item total-row">
                    <span>合计金额：</span>
                    <span class="total-price" id="totalPrice">¥0.00</span>
                </div>
                <button type="submit" class="submit-btn">确认接龙</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
