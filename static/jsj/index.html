<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>末日幸存者 - 僵尸射击</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="startScreen" class="menu-screen">
            <div class="menu-content">
                <h1 class="game-title">末日幸存者</h1>
                <p class="game-subtitle">ZOMBIE SURVIVOR</p>
                <button id="startBtn" class="btn rust-btn">开始游戏</button>
                <button id="continueBtn" class="btn rust-btn hidden">继续游戏</button>
                <div class="controls-info">
                    <p>WASD - 移动</p>
                    <p>鼠标 - 瞄准</p>
                    <p>点击 - 射击</p>
                </div>
            </div>
        </div>

        <div id="pauseScreen" class="menu-screen hidden">
            <div class="menu-content pause-menu">
                <h2>游戏暂停</h2>
                <button id="resumeBtn" class="btn rust-btn">继续游戏</button>
                <button id="restartBtn" class="btn rust-btn">重新开始</button>
                <button id="quitBtn" class="btn rust-btn">退出游戏</button>
            </div>
        </div>

        <div id="gameOverScreen" class="menu-screen hidden">
            <div class="menu-content">
                <h2>游戏结束</h2>
                <div class="final-score">
                    <p>最终得分: <span id="finalScore">0</span></p>
                    <p>最高记录: <span id="highScoreDisplay">0</span></p>
                </div>
                <button id="retryBtn" class="btn rust-btn">再来一局</button>
                <button id="mainMenuBtn" class="btn rust-btn">返回主页</button>
            </div>
        </div>

        <div id="hud" class="hud hidden">
            <div class="hud-top">
                <div class="score-box">
                    <span class="label">得分</span>
                    <span id="scoreDisplay" class="value">0</span>
                </div>
                <div class="wave-box">
                    <span class="label">波次</span>
                    <span id="waveDisplay" class="value">1</span>
                </div>
                <div class="high-score-box">
                    <span class="label">最高分</span>
                    <span id="highScore" class="value">0</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="health-bar-container">
                    <div class="health-bar">
                        <div id="healthFill" class="health-fill"></div>
                    </div>
                    <span id="healthText" class="health-text">100/100</span>
                </div>
                <div class="weapon-info">
                    <span id="weaponName" class="weapon-name">手枪</span>
                    <span id="ammoDisplay" class="ammo">12/12</span>
                </div>
                <button id="pauseBtn" class="pause-btn">⏸</button>
            </div>
        </div>

        <div id="comboDisplay" class="combo-display hidden"></div>
        <div id="damageFlash" class="damage-flash hidden"></div>
        <div id="levelUpFlash" class="level-up-flash hidden"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/item.js"></script>
    <script src="js/weapon.js"></script>
    <script src="js/zombie.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
