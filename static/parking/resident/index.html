<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车位月租申请 - 居民端</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="resident-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">P</span>
                    <h1>车位月租服务</h1>
                </div>
            </div>
        </header>

        <nav class="tab-nav">
            <div class="tab-nav-inner">
                <div class="tab-item active" data-tab="apply">
                    <span class="tab-icon">📝</span>
                    提交申请
                </div>
                <div class="tab-item" data-tab="myapps">
                    <span class="tab-icon">📋</span>
                    我的申请
                </div>
                <div class="tab-item" data-tab="mypayments">
                    <span class="tab-icon">💰</span>
                    缴费记录
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="tab-content active" id="tab-apply">
                <div class="page-header">
                    <h2>提交月租申请</h2>
                    <p>填写信息提交车位月租申请</p>
                </div>

                <div class="form-card">
                    <form id="application-form" onsubmit="submitApplication(event)">
                        <div class="form-group">
                            <label>车牌号 <span class="required">*</span></label>
                            <input type="text" class="form-control" id="car_plate" placeholder="例如：京A12345" required>
                        </div>
                        <div class="form-group">
                            <label>申请人姓名 <span class="required">*</span></label>
                            <input type="text" class="form-control" id="applicant_name" placeholder="请输入您的姓名" required>
                        </div>
                        <div class="form-group">
                            <label>联系电话 <span class="required">*</span></label>
                            <input type="tel" class="form-control" id="applicant_phone" placeholder="请输入您的手机号" required>
                        </div>
                        <div class="form-group">
                            <label>居住地址</label>
                            <input type="text" class="form-control" id="applicant_address" placeholder="请输入您的住址">
                        </div>
                        <div class="form-group">
                            <label>期望车位类型 <span class="required">*</span></label>
                            <select class="form-control" id="desired_spot_type" required>
                                <option value="standard">标准车位 (¥300/月)</option>
                                <option value="large">大型车位 (¥450/月)</option>
                                <option value="ev">新能源车位 (¥350/月)</option>
                            </select>
                        </div>
                        <div class="form-group form-submit">
                            <button type="submit" class="btn btn-primary btn-block">提交申请</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="tab-content" id="tab-myapps">
                <div class="page-header">
                    <h2>我的申请</h2>
                    <p>查看您的申请记录和分配结果</p>
                </div>

                <div class="query-card">
                    <div class="form-group">
                        <label>手机号查询</label>
                        <div class="query-input-group">
                            <input type="tel" class="form-control" id="query-phone" placeholder="请输入您申请时的手机号">
                            <button class="btn btn-primary" onclick="queryMyApplications()">查询</button>
                        </div>
                    </div>
                </div>

                <div id="my-applications-list">
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <p>请输入手机号查询您的申请记录</p>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-mypayments">
                <div class="page-header">
                    <h2>缴费记录</h2>
                    <p>查看您的缴费状态</p>
                </div>

                <div class="query-card">
                    <div class="form-group">
                        <label>查询方式</label>
                        <div class="query-input-group">
                            <select class="form-control" id="payment-query-type" onchange="changePaymentQueryType()">
                                <option value="phone">按手机号查询</option>
                                <option value="car_plate">按车牌号查询</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label id="payment-query-label">手机号</label>
                        <div class="query-input-group">
                            <input type="text" class="form-control" id="payment-query-value" placeholder="请输入手机号">
                            <button class="btn btn-primary" onclick="queryMyPayments()">查询</button>
                        </div>
                    </div>
                </div>

                <div id="my-payments-list">
                    <div class="empty-state">
                        <div class="icon">💰</div>
                        <p>请输入信息查询您的缴费记录</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">提示</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
            </div>
            <div class="modal-footer" id="modal-footer">
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
