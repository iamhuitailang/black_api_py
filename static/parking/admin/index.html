<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车位月租管理系统 - 管理后台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="admin-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">P</span>
                    <h1>车位月租管理系统</h1>
                </div>
                <div class="header-right">
                    <span class="admin-name">管理员</span>
                </div>
            </div>
        </header>

        <nav class="tab-nav">
            <div class="tab-nav-inner">
                <div class="tab-item active" data-tab="application">
                    <span class="tab-icon">📝</span>
                    月租申请
                </div>
                <div class="tab-item" data-tab="assign">
                    <span class="tab-icon">🅿️</span>
                    车位分配
                </div>
                <div class="tab-item" data-tab="payment">
                    <span class="tab-icon">💰</span>
                    缴费记录
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="tab-content active" id="tab-application">
                <div class="page-header">
                    <h2>月租申请管理</h2>
                    <p>审核居民提交的车位月租申请</p>
                </div>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-label">待审核</div>
                        <div class="stat-value" id="stat-pending">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">已通过</div>
                        <div class="stat-value" id="stat-approved">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">已拒绝</div>
                        <div class="stat-value" id="stat-rejected">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">已分配</div>
                        <div class="stat-value" id="stat-assigned">0</div>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="filter-group">
                    <select id="filter-status" class="form-control">
                        <option value="">全部状态</option>
                        <option value="pending">待审核</option>
                        <option value="approved">已通过</option>
                        <option value="rejected">已拒绝</option>
                        <option value="assigned">已分配</option>
                    </select>
                    <input type="text" id="search-keyword" class="form-control" placeholder="搜索车牌号/姓名/电话">
                    <button class="btn btn-primary" onclick="loadApplications()">搜索</button>
                </div>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>车牌号</th>
                                <th>申请人</th>
                                <th>联系电话</th>
                                <th>车位类型</th>
                                <th>状态</th>
                                <th>申请时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="application-list">
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="application-pagination">
                </div>
            </div>

            <div class="tab-content" id="tab-assign">
                <div class="page-header">
                    <h2>车位分配</h2>
                    <p>为已通过的申请分配可用车位</p>
                </div>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-label">总车位</div>
                        <div class="stat-value" id="spot-total">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">可用</div>
                        <div class="stat-value" id="spot-available">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">已占用</div>
                        <div class="stat-value" id="spot-occupied">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">维护中</div>
                        <div class="stat-value" id="spot-maintenance">0</div>
                    </div>
                </div>

                <div class="assign-layout">
                    <div class="assign-left">
                        <h3>待分配申请</h3>
                        <div class="approved-list" id="approved-list">
                        </div>
                    </div>
                    <div class="assign-right">
                        <h3>可用车位</h3>
                        <div class="spot-filter">
                            <select id="spot-type-filter" class="form-control" onchange="loadSpots()">
                                <option value="">全部类型</option>
                                <option value="standard">标准车位</option>
                                <option value="large">大型车位</option>
                                <option value="ev">新能源车位</option>
                            </select>
                        </div>
                        <div class="spot-grid" id="spot-grid">
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-payment">
                <div class="page-header">
                    <h2>缴费记录</h2>
                    <p>管理月租缴费记录，手动标记缴费状态</p>
                </div>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-label">总记录</div>
                        <div class="stat-value" id="payment-total">0</div>
                    </div>
                    <div class="stat-card stat-success">
                        <div class="stat-label">已缴费</div>
                        <div class="stat-value" id="payment-paid">0</div>
                    </div>
                    <div class="stat-card stat-warning">
                        <div class="stat-label">待缴费</div>
                        <div class="stat-value" id="payment-unpaid">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">已收金额</div>
                        <div class="stat-value" id="payment-amount">¥0</div>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="filter-group">
                    <select id="payment-status-filter" class="form-control" onchange="loadPayments()">
                        <option value="">全部状态</option>
                        <option value="unpaid">待缴费</option>
                        <option value="paid">已缴费</option>
                    </select>
                    <input type="text" id="payment-search" class="form-control" placeholder="搜索车牌号/姓名">
                    <button class="btn btn-primary" onclick="loadPayments()">搜索</button>
                </div>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>车牌号</th>
                                <th>申请人</th>
                                <th>月份</th>
                                <th>金额</th>
                                <th>状态</th>
                                <th>缴费时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="payment-list">
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="payment-pagination">
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">标题</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
            </div>
            <div class="modal-footer" id="modal-footer">
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
