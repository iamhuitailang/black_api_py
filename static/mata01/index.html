<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎪 马戏团海报生成器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🎪 马戏团海报生成器</h1>
            <p class="subtitle">快速创建独特的马戏团风格海报</p>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>🎨 选择风格</h3>
                    <div class="style-selector" id="styleSelector"></div>
                </div>

                <div class="sidebar-section">
                    <h3>📝 编辑文字</h3>
                    <div class="form-group">
                        <label>主标题</label>
                        <input type="text" id="title" placeholder="输入主标题">
                    </div>
                    <div class="form-group">
                        <label>副标题</label>
                        <input type="text" id="subtitle" placeholder="输入副标题">
                    </div>
                    <div class="form-group">
                        <label>时间</label>
                        <input type="text" id="date" placeholder="例如：2026年6月1日 19:00">
                    </div>
                    <div class="form-group">
                        <label>地点</label>
                        <input type="text" id="location" placeholder="输入地点">
                    </div>
                    <div class="form-group">
                        <label>价格</label>
                        <input type="text" id="price" placeholder="例如：¥99 起">
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>🎭 角色选择</h3>
                    <div class="character-selector" id="characterSelector"></div>
                </div>

                <div class="sidebar-section">
                    <h3>🌈 配色调整</h3>
                    <div class="color-controls">
                        <div class="form-group">
                            <label>主色</label>
                            <input type="color" id="primaryColor">
                        </div>
                        <div class="form-group">
                            <label>辅色</label>
                            <input type="color" id="secondaryColor">
                        </div>
                        <div class="form-group">
                            <label>文字色</label>
                            <input type="color" id="textColor">
                        </div>
                        <button class="btn btn-secondary" id="resetColors">重置配色</button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>🖼️ 背景装饰</h3>
                    <div class="decoration-controls">
                        <label class="checkbox-label">
                            <input type="checkbox" id="showFlags" checked> 彩旗
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="showStars" checked> 星星
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="showLights" checked> 聚光灯
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="showQR" checked> 二维码
                        </label>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>🖼️ 自定义背景</h3>
                    <div class="form-group">
                        <input type="file" id="bgImageInput" accept="image/*">
                        <button class="btn btn-secondary" id="clearBgImage">清除背景</button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>🔗 分享链接</h3>
                    <div class="form-group">
                        <input type="text" id="qrLink" placeholder="输入链接生成二维码">
                    </div>
                </div>

                <div class="sidebar-actions">
                    <button class="btn btn-primary" id="saveTemplate">💾 保存模板</button>
                    <button class="btn btn-secondary" id="loadTemplate">📂 加载模板</button>
                    <button class="btn btn-primary" id="downloadBtn">📸 下载海报</button>
                    <button class="btn btn-secondary" id="resetBtn">🔄 重置</button>
                </div>
            </aside>

            <main class="preview-area">
                <div class="canvas-wrapper">
                    <canvas id="posterCanvas" width="600" height="800"></canvas>
                </div>
                <div class="preview-info">
                    <span>实时预览</span>
                    <span class="resolution">600 x 800 px</span>
                </div>
            </main>
        </div>

        <div id="templateModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>选择已保存的模板</h3>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="template-list" id="templateList"></div>
            </div>
        </div>

        <div id="saveModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>保存模板</h3>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <input type="text" id="templateName" placeholder="输入模板名称">
                    <button class="btn btn-primary" id="confirmSave">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/templates.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/qrcode.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
