<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京剧变脸战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        
        <div id="ui-overlay">
            <div id="player-hud" class="hud left">
                <div class="character-name">武生</div>
                <div class="health-bar-container">
                    <div class="health-bar-bg"></div>
                    <div class="health-bar" id="player-health"></div>
                </div>
                <div class="energy-bar-container">
                    <div class="energy-bar-bg"></div>
                    <div class="energy-bar" id="player-energy"></div>
                </div>
                <div class="face-indicator" id="player-face">红脸</div>
            </div>
            
            <div id="enemy-hud" class="hud right">
                <div class="character-name">花脸</div>
                <div class="health-bar-container">
                    <div class="health-bar-bg"></div>
                    <div class="health-bar" id="enemy-health"></div>
                </div>
                <div class="energy-bar-container">
                    <div class="energy-bar-bg"></div>
                    <div class="energy-bar" id="enemy-energy"></div>
                </div>
                <div class="face-indicator" id="enemy-face">黑脸</div>
            </div>
            
            <div id="round-indicator">第 1 局</div>
            <div id="timer">99</div>
        </div>
        
        <div id="start-menu" class="menu">
            <h1 class="game-title">京剧变脸战</h1>
            <p class="subtitle">江湖戏台古 🌙</p>
            <div class="character-select">
                <div class="character-option selected" data-type="wusheng">
                    <div class="char-icon wusheng-icon"></div>
                    <div class="char-name">武生</div>
                    <div class="char-desc">均衡全能型</div>
                </div>
                <div class="character-option" data-type="hualian">
                    <div class="char-icon hualian-icon"></div>
                    <div class="char-name">花脸</div>
                    <div class="char-desc">强攻力量型</div>
                </div>
                <div class="character-option" data-type="danjiao">
                    <div class="char-icon danjiao-icon"></div>
                    <div class="char-name">旦角</div>
                    <div class="char-desc">敏捷速度型</div>
                </div>
            </div>
            <button id="start-btn" class="game-btn">开始游戏</button>
            <div class="controls-info">
                <p>← → 移动 | ↑ 跳跃 | ↓ 蹲身</p>
                <p>J 轻掌 | K 重掌 | U 轻踢 | I 重踢</p>
                <p>L 脸谱切换 | O 变脸必杀 | ESC 暂停</p>
            </div>
        </div>
        
        <div id="pause-menu" class="menu hidden">
            <h2>游戏暂停</h2>
            <button id="resume-btn" class="game-btn">继续游戏</button>
            <button id="restart-btn" class="game-btn">重新开始</button>
            <button id="quit-btn" class="game-btn">退出游戏</button>
        </div>
        
        <div id="game-over-menu" class="menu hidden">
            <h2 id="result-text">胜利！</h2>
            <p id="result-desc">你击败了对手！</p>
            <button id="play-again-btn" class="game-btn">再来一局</button>
            <button id="back-menu-btn" class="game-btn">返回菜单</button>
        </div>
        
        <button id="pause-btn" class="pause-btn hidden">⏸</button>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/input.js"></script>
    <script src="js/character.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
    
    <div id="debug-panel" style="position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.9); color: #fff; padding: 12px; font-family: monospace; font-size: 12px; border-radius: 8px; z-index: 10000; max-width: 350px; border: 1px solid #444;">
        <div style="margin-bottom: 5px; color: #4fc3f7;">🎮 调试面板</div>
        <div>状态: <span id="debug-state" style="color: #ffd54f;">初始化中...</span></div>
        <div>按下: <span id="debug-keys">-</span></div>
        <div>队列: <span id="debug-queue">-</span></div>
        <div>玩家: <span id="debug-player">-</span></div>
        <div style="margin-top: 8px; font-size: 10px; color: #888;">先点击游戏区域获取焦点，再按按键测试</div>
    </div>
</body>
</html>
