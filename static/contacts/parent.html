<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家长信息登记</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>📋 家长信息登记</h1>
            <p class="subtitle">请如实填写以下信息，方便老师联系您</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="submit">📝 首次登记</button>
            <button class="tab-btn" data-tab="edit">✏️ 修改信息</button>
        </div>

        <div id="tab-submit" class="tab-content active">
            <form id="submit-form" class="form">
                <div class="form-group">
                    <label>学生姓名 <span class="required">*</span></label>
                    <input type="text" name="student_name" placeholder="请输入学生姓名" required>
                </div>

                <div class="form-group">
                    <label>所在班级 <span class="required">*</span></label>
                    <input type="text" name="class_name" placeholder="例如：三年级(2)班" required>
                </div>

                <div class="form-group">
                    <label>家长姓名 <span class="required">*</span></label>
                    <input type="text" name="parent_name" placeholder="请输入您的姓名" required>
                </div>

                <div class="form-group">
                    <label>与学生关系 <span class="required">*</span></label>
                    <select name="relation" required>
                        <option value="">请选择关系</option>
                        <option value="父亲">父亲</option>
                        <option value="母亲">母亲</option>
                        <option value="爷爷">爷爷</option>
                        <option value="奶奶">奶奶</option>
                        <option value="外公">外公</option>
                        <option value="外婆">外婆</option>
                        <option value="其他">其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>手机号 <span class="required">*</span></label>
                    <input type="tel" name="phone" placeholder="11位手机号码" maxlength="11" pattern="1[3-9]\d{9}" required>
                    <small class="help-text">⚠️ 手机号用于以后修改信息，请务必填写正确</small>
                </div>

                <div class="form-group">
                    <label>家庭住址</label>
                    <textarea name="address" rows="2" placeholder="选填，方便家访或紧急情况联系"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block">✅ 提交登记</button>
            </form>
        </div>

        <div id="tab-edit" class="tab-content">
            <div class="phone-verify">
                <div class="form-group">
                    <label>请输入登记时的手机号 <span class="required">*</span></label>
                    <div class="input-group">
                        <input type="tel" id="verify-phone" placeholder="11位手机号码" maxlength="11" pattern="1[3-9]\d{9}">
                        <button type="button" id="btn-verify" class="btn btn-primary">查询</button>
                    </div>
                </div>
            </div>

            <div id="contact-selector" class="form hidden">
                <div class="form-group">
                    <label>该手机号绑定了多个孩子，请选择要修改的记录 <span class="required">*</span></label>
                    <div id="contact-list" class="contact-list-select"></div>
                </div>
            </div>

            <form id="edit-form" class="form hidden">
                <div class="form-group">
                    <label>学生姓名 <span class="required">*</span></label>
                    <input type="text" name="student_name" placeholder="请输入学生姓名" required>
                </div>

                <div class="form-group">
                    <label>所在班级 <span class="required">*</span></label>
                    <input type="text" name="class_name" placeholder="例如：三年级(2)班" required>
                </div>

                <div class="form-group">
                    <label>家长姓名 <span class="required">*</span></label>
                    <input type="text" name="parent_name" placeholder="请输入您的姓名" required>
                </div>

                <div class="form-group">
                    <label>与学生关系 <span class="required">*</span></label>
                    <select name="relation" required>
                        <option value="">请选择关系</option>
                        <option value="父亲">父亲</option>
                        <option value="母亲">母亲</option>
                        <option value="爷爷">爷爷</option>
                        <option value="奶奶">奶奶</option>
                        <option value="外公">外公</option>
                        <option value="外婆">外婆</option>
                        <option value="其他">其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>新手机号（如需修改）</label>
                    <input type="tel" name="new_phone" placeholder="不修改请留空" maxlength="11" pattern="1[3-9]\d{9}">
                </div>

                <div class="form-group">
                    <label>家庭住址</label>
                    <textarea name="address" rows="2" placeholder="选填"></textarea>
                </div>

                <input type="hidden" name="phone" id="edit-original-phone">
                <input type="hidden" name="contact_id" id="edit-contact-id">
                <button type="submit" class="btn btn-success btn-block">💾 保存修改</button>
            </form>
        </div>

        <div id="toast" class="toast"></div>
    </div>

    <script src="js/parent.js"></script>
</body>
</html>
