<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快乐跑酷</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="game-ui">
            <div class="score-display">
                <div class="score-item">
                    <span class="label">分数</span>
                    <span class="value" id="currentScore">0</span>
                </div>
                <div class="score-item">
                    <span class="label">最高分</span>
                    <span class="value" id="highScore">0</span>
                </div>
            </div>
            
            <button id="pauseBtn" class="game-btn pause-btn" style="display: none;">
                暂停
            </button>
        </div>
        
        <div class="overlay" id="startScreen">
            <div class="overlay-content">
                <h1 class="game-title">快乐跑酷</h1>
                <p class="game-instructions">
                    按 <strong>空格键</strong> 或 <strong>点击屏幕</strong> 跳跃<br>
                    长按可跳得更高<br>
                    空中可以再跳一次（二段跳）
                </p>
                <button id="startBtn" class="game-btn start-btn">
                    开始游戏
                </button>
            </div>
        </div>
        
        <div class="overlay" id="pauseScreen" style="display: none;">
            <div class="overlay-content">
                <h2 class="overlay-title">游戏暂停</h2>
                <div class="button-group">
                    <button id="resumeBtn" class="game-btn resume-btn">
                        继续游戏
                    </button>
                    <button id="restartFromPauseBtn" class="game-btn restart-btn">
                        重新开始
                    </button>
                </div>
            </div>
        </div>
        
        <div class="overlay" id="gameOverScreen" style="display: none;">
            <div class="overlay-content">
                <h2 class="overlay-title">游戏结束</h2>
                <div class="final-score">
                    <p class="score-text">最终得分</p>
                    <p class="score-value" id="finalScore">0</p>
                </div>
                <div class="new-record" id="newRecord" style="display: none;">
                    新纪录！
                </div>
                <button id="restartBtn" class="game-btn restart-btn">
                    再来一局
                </button>
            </div>
        </div>
    </div>
    
    <script src="js/game.js"></script>
</body>
</html>
