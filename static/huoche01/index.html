<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火车调度 · 铁轨迷踪</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- 游戏头部信息 -->
        <div class="game-header">
            <h1 class="game-title">🚂 火车调度 · 铁轨迷踪</h1>
            <div class="game-info">
                <span class="level-info">关卡: <span id="current-level">1</span></span>
                <span class="status-info">状态: <span id="game-status">准备开始</span></span>
            </div>
        </div>

        <!-- 游戏画布区域 -->
        <div class="game-canvas-container">
            <canvas id="game-canvas"></canvas>
        </div>

        <!-- 游戏控制按钮 -->
        <div class="game-controls">
            <button id="start-btn" class="control-btn">🎮 开始游戏</button>
            <button id="pause-btn" class="control-btn">⏸️ 暂停</button>
            <button id="restart-btn" class="control-btn">🔄 重新开始</button>
            <button id="next-level-btn" class="control-btn" style="display: none;">➡️ 下一关</button>
        </div>

        <!-- 游戏提示信息 -->
        <div class="game-hint" id="game-hint">
            <p>提示：点击道岔切换轨道方向，点击信号灯控制火车通行/等待</p>
        </div>

        <!-- 游戏结束/胜利弹窗 -->
        <div id="game-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 id="modal-title">游戏结束</h2>
                <p id="modal-message">很遗憾，火车相撞了！</p>
                <div class="modal-buttons">
                    <button id="modal-restart-btn" class="control-btn">🔄 重新开始</button>
                    <button id="modal-next-btn" class="control-btn" style="display: none;">➡️ 下一关</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入JavaScript模块 -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
