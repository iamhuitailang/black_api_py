<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国地图填空挑战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="top-bar">
            <div class="timer">
                <span class="label">时间</span>
                <span id="time" class="value">05:00</span>
            </div>
            <div class="score">
                <span class="label">分数</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="accuracy">
                <span class="label">正确率</span>
                <span id="accuracy" class="value">0%</span>
            </div>
            <div class="streak">
                <span class="label">连击</span>
                <span id="streak" class="value">0</span>
            </div>
        </div>

        <div class="map-container">
            <canvas id="mapCanvas"></canvas>
            <div id="inputModal" class="modal hidden">
                <div class="modal-content">
                    <h3 id="questionTitle">请输入省份名称</h3>
                    <div class="input-wrapper">
                        <input type="text" id="answerInput" placeholder="输入答案..." autocomplete="off">
                        <div id="pinyinSuggestions" class="suggestions hidden"></div>
                    </div>
                    <div class="modal-buttons">
                        <button id="confirmBtn" class="btn primary">确认</button>
                        <button id="hintBtn" class="btn secondary">提示 (<span id="hintCount">2</span>)</button>
                        <button id="cancelBtn" class="btn">取消</button>
                    </div>
                </div>
            </div>
            <div id="startScreen" class="overlay">
                <div class="overlay-content">
                    <h1>🗺️ 中国地图填空挑战</h1>
                    <div class="level-select">
                        <label>选择关卡：</label>
                        <select id="levelSelect">
                            <option value="huabei">华北地区</option>
                            <option value="huadong">华东地区</option>
                            <option value="huanan">华南地区</option>
                            <option value="xinan">西南地区</option>
                            <option value="xibei">西北地区</option>
                            <option value="dongbei">东北地区</option>
                            <option value="all">全国综合</option>
                        </select>
                    </div>
                    <div class="type-select">
                        <label>填空类型：</label>
                        <select id="typeSelect">
                            <option value="name">省份名称</option>
                            <option value="short">省份简称</option>
                            <option value="capital">省会/首府</option>
                        </select>
                    </div>
                    <button id="startBtn" class="btn primary large">开始游戏</button>
                    <button id="resumeBtn" class="btn secondary large hidden">继续游戏</button>
                </div>
            </div>
            <div id="pauseScreen" class="overlay hidden">
                <div class="overlay-content">
                    <h2>⏸️ 游戏暂停</h2>
                    <button id="resumeGameBtn" class="btn primary large">继续游戏</button>
                    <button id="restartBtn" class="btn secondary large">重新开始</button>
                </div>
            </div>
            <div id="resultScreen" class="overlay hidden">
                <div class="overlay-content">
                    <h2 id="resultTitle">🎉 通关成功！</h2>
                    <div class="result-stats">
                        <p>最终得分：<span id="finalScore">0</span></p>
                        <p>正确率：<span id="finalAccuracy">0%</span></p>
                        <p>用时：<span id="finalTime">00:00</span></p>
                    </div>
                    <button id="playAgainBtn" class="btn primary large">再来一局</button>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <button id="pauseBtn" class="btn">⏸️ 暂停</button>
            <button id="resetBtn" class="btn">🔄 重置</button>
            <button id="zoomInBtn" class="btn">➕ 放大</button>
            <button id="zoomOutBtn" class="btn">➖ 缩小</button>
            <button id="resetViewBtn" class="btn">📍 复位</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/chinaMapData.js"></script>
    <script src="js/data.js"></script>
    <script src="js/pinyin.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/map.js"></script>
    <script src="js/interaction.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
