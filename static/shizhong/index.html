<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 番茄时钟</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🍅 番茄时钟</h1>
        
        <div class="timer-container">
            <div class="progress-ring">
                <svg class="progress-ring-svg" width="300" height="300">
                    <circle class="progress-ring-bg" cx="150" cy="150" r="140"></circle>
                    <circle class="progress-ring-progress" cx="150" cy="150" r="140"></circle>
                </svg>
                <div class="timer-content">
                    <div class="timer-display" id="timerDisplay">25:00</div>
                    <div class="status-text" id="statusText">🛠️ 工作时间</div>
                </div>
            </div>
        </div>
        
        <div class="pomodoro-count" id="pomodoroCount">🏆 今日已完成: 0</div>
        
        <div class="button-group">
            <button class="btn btn-start" id="startBtn">开始</button>
            <button class="btn btn-pause" id="pauseBtn">暂停</button>
            <button class="btn btn-reset" id="resetBtn">重置</button>
        </div>
        
        <div class="mode-switch">
            <button class="mode-btn mode-work active" id="workModeBtn">🛠️ 工作</button>
            <button class="mode-btn mode-break" id="breakModeBtn">☕ 休息</button>
        </div>
        
        <div class="settings-section">
            <button class="settings-toggle" id="settingsToggle">⚙️ 设置</button>
        </div>
    </div>
    
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>自定义设置</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label for="workDuration">工作时长（分钟）:</label>
                    <input type="number" id="workDuration" min="1" max="60" value="25">
                </div>
                <div class="setting-item">
                    <label for="breakDuration">休息时长（分钟）:</label>
                    <input type="number" id="breakDuration" min="1" max="30" value="5">
                </div>
                <div class="setting-item">
                    <label for="longBreakDuration">长休息时长（分钟）:</label>
                    <input type="number" id="longBreakDuration" min="1" max="60" value="15">
                </div>
                <div class="setting-item">
                    <label for="pomodorosBeforeLongBreak">番茄数后长休息:</label>
                    <input type="number" id="pomodorosBeforeLongBreak" min="1" max="10" value="4">
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="enableLongBreak" checked>
                        启用长休息
                    </label>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="enableSound" checked>
                        启用提示音
                    </label>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="enableNotification" checked>
                        启用浏览器通知
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="saveSettings">保存设置</button>
                <button class="btn btn-secondary" id="cancelSettings">取消</button>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">
        <div class="notification-content">
            <div class="notification-icon" id="notificationIcon">⏰</div>
            <div class="notification-text" id="notificationText">工作时间结束！该休息了</div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
