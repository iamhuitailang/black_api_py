<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叠箱子高塔</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-overlay">
            <div id="score-panel">
                <div class="score-item">
                    <span class="label">分数</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">关卡</span>
                    <span id="level" class="value">1</span>
                </div>
                <div class="score-item">
                    <span class="label">层数</span>
                    <span id="stack-height" class="value">0</span>
                </div>
            </div>
            
            <button id="pause-btn" class="icon-btn">⏸️</button>
        </div>
        
        <div id="start-screen" class="modal active">
            <div class="modal-content">
                <h1>🏗️ 叠箱子高塔</h1>
                <p class="subtitle">精准堆叠，挑战极限高度！</p>
                <div class="instructions">
                    <p>🎮 操作方式：</p>
                    <p>按 空格键 或 点击屏幕 放置箱子</p>
                </div>
                <button id="start-btn" class="primary-btn">开始游戏</button>
            </div>
        </div>
        
        <div id="pause-screen" class="modal">
            <div class="modal-content">
                <h2>⏸️ 游戏暂停</h2>
                <div class="button-group">
                    <button id="resume-btn" class="primary-btn">继续游戏</button>
                    <button id="restart-btn" class="secondary-btn">重新开始</button>
                    <button id="quit-btn" class="danger-btn">退出游戏</button>
                </div>
            </div>
        </div>
        
        <div id="gameover-screen" class="modal">
            <div class="modal-content">
                <h2>💥 游戏结束</h2>
                <div class="final-stats">
                    <p>最终分数: <span id="final-score">0</span></p>
                    <p>最高层数: <span id="final-height">0</span></p>
                    <p>到达关卡: <span id="final-level">1</span></p>
                </div>
                <div class="button-group">
                    <button id="retry-btn" class="primary-btn">再来一次</button>
                    <button id="home-btn" class="secondary-btn">返回主页</button>
                </div>
            </div>
        </div>
        
        <div id="flash-effect" class="flash"></div>
    </div>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
