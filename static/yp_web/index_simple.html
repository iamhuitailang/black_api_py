<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐跑酷 - 简化测试版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        #app {
            max-width: 500px;
            margin: 0 auto;
            padding-top: 50px;
        }
        .test-card {
            background: rgba(30, 30, 60, 0.9);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }
        .test-card h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .test-card p {
            color: #a0a0c0;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #a0a0c0;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        .link {
            color: #6366f1;
            text-decoration: none;
            cursor: pointer;
        }
        .link:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 20px;
            color: #a0a0c0;
            font-size: 14px;
        }
        .log {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 12px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-item {
            margin-bottom: 5px;
        }
        .log-error { color: #ef4444; }
        .log-success { color: #10b981; }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app"></div>

    <script>
        const { createApp, ref, reactive, h } = Vue;

        console.log('Vue loaded:', Vue.version);

        const SimpleLogin = {
            data() {
                return {
                    username: '',
                    password: '',
                    loading: false,
                    logs: []
                };
            },
            methods: {
                log(msg, type = 'info') {
                    this.logs.unshift({ msg, type, time: new Date().toLocaleTimeString() });
                    console.log(msg);
                },
                async handleLogin() {
                    if (!this.username || !this.password) {
                        this.log('请输入用户名和密码', 'error');
                        return;
                    }

                    this.loading = true;
                    this.log(`尝试登录: ${this.username}`);

                    try {
                        const response = await fetch('/api/yp/user/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password
                            })
                        });
                        const data = await response.json();
                        this.log(`服务器响应: ${JSON.stringify(data)}`, data.code === 0 ? 'success' : 'error');
                        
                        if (data.code === 0) {
                            this.log('登录成功！', 'success');
                            localStorage.setItem('yp_token', data.data.token);
                            localStorage.setItem('yp_user', JSON.stringify(data.data.user));
                            alert('登录成功！点击确定跳转到完整版');
                            window.location.href = '/static/yp_web/index.html';
                        } else {
                            this.log('登录失败: ' + data.msg, 'error');
                        }
                    } catch (e) {
                        this.log('网络错误: ' + e.message, 'error');
                    }
                    
                    this.loading = false;
                },
                async handleRegister() {
                    if (!this.username || !this.password) {
                        this.log('请输入用户名和密码', 'error');
                        return;
                    }

                    this.loading = true;
                    this.log(`尝试注册: ${this.username}`);

                    try {
                        const response = await fetch('/api/yp/user/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                email: this.username + '@test.com',
                                nickname: this.username,
                                password: this.password
                            })
                        });
                        const data = await response.json();
                        this.log(`服务器响应: ${JSON.stringify(data)}`, data.code === 0 ? 'success' : 'error');
                        
                        if (data.code === 0) {
                            this.log('注册成功！', 'success');
                            localStorage.setItem('yp_token', data.data.token);
                            localStorage.setItem('yp_user', JSON.stringify(data.data.user));
                            alert('注册成功！点击确定跳转到完整版');
                            window.location.href = '/static/yp_web/index.html';
                        } else {
                            this.log('注册失败: ' + data.msg, 'error');
                        }
                    } catch (e) {
                        this.log('网络错误: ' + e.message, 'error');
                    }
                    
                    this.loading = false;
                }
            },
            mounted() {
                this.log('✅ 简化版页面加载成功！');
                this.log('Vue版本: ' + Vue.version, 'success');
            },
            template: `
                <div class="test-card">
                    <h1>🎵 音乐跑酷</h1>
                    <p>跟随节奏，突破极限</p>
                    
                    <form @submit.prevent="handleLogin">
                        <div class="form-group">
                            <label>用户名</label>
                            <input 
                                v-model="username" 
                                type="text" 
                                placeholder="请输入用户名"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input 
                                v-model="password" 
                                type="password" 
                                placeholder="请输入密码"
                                required
                            />
                        </div>
                        <button 
                            type="submit" 
                            class="btn"
                            :disabled="loading"
                            style="margin-bottom: 10px;"
                        >
                            {{ loading ? '登录中...' : '登 录' }}
                        </button>
                    </form>

                    <button 
                        type="button" 
                        class="btn"
                        :disabled="loading"
                        @click="handleRegister"
                        style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);"
                    >
                        {{ loading ? '注册中...' : '注 册' }}
                    </button>

                    <div class="footer">
                        完整版: <a href="/static/yp_web/index.html" class="link">点击这里</a>
                    </div>

                    <div class="log">
                        <div 
                            v-for="(log, idx) in logs" 
                            :key="idx"
                            class="log-item"
                            :class="'log-' + log.type"
                        >
                            [{{ log.time }}] {{ log.msg }}
                        </div>
                    </div>
                </div>
            `
        };

        try {
            const app = createApp(SimpleLogin);
            app.mount('#app');
            console.log('✅ Vue app mounted successfully');
        } catch (e) {
            console.error('❌ Vue app mount failed:', e);
            document.getElementById('app').innerHTML = 
                '<div style="color: red; padding: 20px;">错误: ' + e.message + '</div>';
        }
    </script>
</body>
</html>
