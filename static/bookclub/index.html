<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书会 · 读书打卡平台</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.30/dist/vue.global.js?v=20250611b"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: "STKaiti", "KaiTi", "楷体", "Songti SC", "SimSun", serif;
    background: #FAF3E0;
    color: #4A3728;
    min-height: 100vh;
    line-height: 1.7;
  }
  #app { min-height: 100vh; }
  .warm-bg { background: linear-gradient(135deg, #FAF3E0 0%, #F5E6C8 50%, #FAF3E0 100%); }
  .header {
    background: linear-gradient(90deg, #8B6914 0%, #A0782C 50%, #8B6914 100%);
    color: #FFF8E7;
    padding: 16px 24px;
    box-shadow: 0 4px 16px rgba(74, 55, 40, 0.2);
    position: sticky; top: 0; z-index: 100;
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .logo { font-size: 26px; font-weight: bold; letter-spacing: 4px; display: flex; align-items: center; gap: 10px; cursor:pointer; }
  .logo-icon {
    width: 38px; height: 38px; background: #FFF8E7; color: #8B6914;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  }
  .nav-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav-tab {
    padding: 8px 18px; border-radius: 20px; cursor: pointer;
    transition: all 0.3s; font-size: 15px; color: #FFF8E7;
  }
  .nav-tab:hover { background: rgba(255,248,231,0.2); }
  .nav-tab.active { background: #FFF8E7; color: #8B6914; font-weight: bold; }
  .user-area { display: flex; align-items: center; gap: 12px; cursor:pointer; }
  .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #FFF8E7; overflow: hidden; flex-shrink: 0; }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-nick { font-size: 15px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

  .welcome-subtitle { color: #8B7355; font-size: 15px; margin-bottom: 32px; }

  .btn-primary {

    font-family: inherit; cursor: pointer; transition: all 0.3s;

    box-shadow: 0 4px 12px rgba(139, 105, 20, 0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 105, 20, 0.4); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform:none; }
  .btn-secondary {
    background: #FFF8E7; color: #8B6914; border: 2px solid #8B6914;
    padding: 10px 24px; border-radius: 10px; font-size: 14px;

  .btn-secondary:hover { background: #8B6914; color: #FFF8E7; }

  .section-title {
    font-size: 22px; color: #8B6914; font-weight: bold; margin-bottom: 18px;

  }

    content: ''; width: 5px; height: 22px;
    background: linear-gradient(180deg, #8B6914, #D4B896); border-radius: 3px;
  }

  @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

    background: #FFF8E7; border-radius: 16px; padding: 22px;
    box-shadow: 0 4px 16px rgba(139, 105, 20, 0.1);
    border: 1px solid rgba(139, 105, 20, 0.1);
  }
  .calendar {
    background: #FFF8E7; border-radius: 16px; padding: 22px;
    box-shadow: 0 4px 16px rgba(139, 105, 20, 0.1);

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-title { font-size: 20px; color: #8B6914; font-weight: bold; letter-spacing: 2px; }
  .cal-nav-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: #F5E6C8; color: #8B6914; cursor: pointer;
    font-size: 18px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .cal-nav-btn:hover { background: #8B6914; color: #FFF8E7; }
  .cal-nav { display: flex; gap: 8px; }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: 13px; color: #8B7355; margin-bottom: 8px; font-weight: bold;
  }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; border-radius: 10px;
    font-size: 14px; color: #4A3728; position: relative; transition: all 0.2s; cursor: default;
  }
  .cal-day.other { color: #D4C4A8; }
  .cal-day.today { background: #F5E6C8; font-weight: bold; }
  .cal-day.checked .dot {
    width: 8px; height: 8px;
    background: linear-gradient(135deg, #8B6914, #DAA520);
    border-radius: 50%; margin-top: 3px;
    box-shadow: 0 0 6px rgba(218, 165, 32, 0.6);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .cal-day.checked { color: #8B6914; font-weight: bold; }
  .checkin-btn { margin-top: 18px; width: 100%; padding: 14px; font-size: 17px; }
  .checkin-btn.done { background: linear-gradient(135deg, #6B8E23 0%, #8FBC8F 100%); }

    background: linear-gradient(135deg, #FFF8E7 0%, #F5E6C8 100%);
    border-radius: 20px; padding: 28px;

    display: flex; align-items: center; gap: 22px;
    flex-wrap: wrap; margin-bottom: 28px;
  }
  .profile-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    border: 4px solid #8B6914; overflow: hidden;
    flex-shrink: 0; position: relative;
  }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .streak-badge {
    position: absolute; bottom: -6px; right: -6px;
    min-width: 44px; height: 28px; padding: 0 10px;
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: #fff;
    border: 2px solid #FFF8E7; letter-spacing: 0.5px;
  }
  .profile-info { flex: 1; min-width: 200px; }
  .profile-name { font-size: 26px; color: #8B6914; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; }
  .profile-stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .stat-item {
    text-align: center; padding: 10px 16px; background: #FFFCF2;
    border-radius: 12px; min-width: 90px;
  }
  .stat-val {
    font-size: 22px; font-weight: bold; color: #8B6914; display: block;
  }
  .stat-label { font-size: 12px; color: #8B7355; }
  .books-spine {
    display: flex; gap: 10px; overflow-x: auto;
    padding: 14px 6px 18px; flex-wrap: wrap;
  }
  .book-spine {
    width: 60px; min-height: 190px; border-radius: 4px 4px 2px 2px;
    color: #FFF8E7; padding: 14px 6px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 2px 4px 8px rgba(74, 55, 40, 0.3);
    position: relative; writing-mode: vertical-rl;
    text-orientation: upright; letter-spacing: 3px; flex-shrink: 0;
  }
  .book-spine:hover { transform: translateY(-6px); box-shadow: 2px 10px 16px rgba(74, 55, 40, 0.4); }
  .spine-title { font-size: 14px; font-weight: bold; max-height: 120px; overflow: hidden; }
  .spine-rating { margin-top: 8px; writing-mode: horizontal-tb; font-size: 11px; }
  .book-color-0 { background: linear-gradient(180deg, #8B4513 0%, #654321 100%); }
  .book-color-1 { background: linear-gradient(180deg, #556B2F 0%, #2F4F2F 100%); }
  .book-color-2 { background: linear-gradient(180deg, #8B0000 0%, #5C0000 100%); }
  .book-color-3 { background: linear-gradient(180deg, #191970 0%, #0D0D4A 100%); }
  .book-color-4 { background: linear-gradient(180deg, #483D8B 0%, #2E2664 100%); }
  .book-color-5 { background: linear-gradient(180deg, #8B6914 0%, #654F0E 100%); }
  .book-color-6 { background: linear-gradient(180deg, #2F4F4F 0%, #1C2F2F 100%); }
  .book-color-7 { background: linear-gradient(180deg, #800020 0%, #500014 100%); }
  .add-book-spine {
    width: 54px; min-height: 190px; border: 3px dashed #B8860B;
    border-radius: 4px; background: rgba(255, 248, 231, 0.5);
    color: #8B6914; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s;
    flex-shrink: 0; font-size: 32px; font-weight: bold;
  }
  .add-book-spine:hover {
    background: #FFF8E7; transform: translateY(-6px);
    box-shadow: 0 6px 16px rgba(139, 105, 20, 0.25);
  }
  .bookshelf-title {
    font-size: 16px; color: #8B7355; margin: 18px 0 4px;
    padding-left: 10px; border-left: 4px solid #B8860B; font-weight: bold;
  }
  .leaderboard-item {
    display: flex; align-items: center; gap: 14px; padding: 14px;
    background: #FFFCF2; border-radius: 12px; margin-bottom: 10px;
    cursor: pointer; transition: all 0.3s;
    border: 1px solid rgba(139, 105, 20, 0.08);
  }
  .leaderboard-item:hover { background: #FFF8E7; transform: translateX(4px); box-shadow: 0 2px 10px rgba(139, 105, 20, 0.12); }
  .rank-number {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: bold; font-family: "Georgia", serif; flex-shrink: 0;
  }
  .rank-1 {
    background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%);
    color: #5C3D00; box-shadow: 0 0 16px rgba(255, 215, 0, 0.6);
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
  }
  .rank-2 {
    background: linear-gradient(135deg, #E8E8E8 0%, #C0C0C0 50%, #A8A8A8 100%);
    color: #4A4A4A; box-shadow: 0 0 12px rgba(192, 192, 192, 0.5);
  }
  .rank-3 {
    background: linear-gradient(135deg, #CD7F32 0%, #A0522D 50%, #8B4513 100%);
    color: #FFF8E7; box-shadow: 0 0 12px rgba(205, 127, 50, 0.5);
  }
  .rank-other { background: #F5E6C8; color: #8B6914; font-size: 17px; }
  .lb-avatar {
    width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
    flex-shrink: 0; position: relative; border: 2px solid rgba(139, 105, 20, 0.2);
  }
  .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .lb-streak-mini {
    position: absolute; bottom: -4px; right: -6px;
    min-width: 28px; height: 18px; padding: 0 6px;
    border-radius: 9px; font-size: 10px; font-weight: bold; color: #fff;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid #FFFCF2;
  }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name { font-size: 16px; font-weight: bold; color: #4A3728; margin-bottom: 4px; }
  .lb-sub { font-size: 12px; color: #8B7355; }
  .lb-count { font-size: 22px; font-weight: bold; color: #8B6914; }
  .lb-count small { font-size: 12px; font-weight: normal; color: #8B7355; }
  .activity-item {
    display: flex; gap: 12px; padding: 14px;
    border-bottom: 1px dashed rgba(139, 105, 20, 0.15);
    cursor: pointer; transition: all 0.2s;
  }
  .activity-item:hover { background: rgba(255, 248, 231, 0.6); }
  .activity-item:last-child { border-bottom: none; }
  .act-avatar { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .act-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .act-content { flex: 1; min-width: 0; }
  .act-text { font-size: 14px; color: #4A3728; margin-bottom: 4px; }
  .act-text strong { color: #8B6914; }
  .act-time { font-size: 12px; color: #A0896C; }
  .act-book-tag {
    display: inline-block; padding: 2px 8px;
    background: #F5E6C8; color: #8B6914;
    border-radius: 6px; font-size: 12px; margin-left: 6px;
  }
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(74, 55, 40, 0.5); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px; animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: #FFF8E7; border-radius: 20px; padding: 28px;
    width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(74, 55, 40, 0.4);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-size: 22px; color: #8B6914; font-weight: bold;
    margin-bottom: 20px; text-align: center; letter-spacing: 2px;
  }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 14px; color: #6B4F2E; margin-bottom: 6px; font-weight: bold; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  textarea.input-field { resize: vertical; min-height: 80px; }
  .rating-stars { display: flex; gap: 6px; padding: 4px 0; }
  .star {
    font-size: 28px; cursor: pointer; color: #D4C4A8;
    transition: all 0.15s; user-select: none;
  }
  .star.active { color: #FFB800; }
  .star:hover { transform: scale(1.15); }
  .modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: center; }
  .btn-cancel {
    background: #F5E6C8; color: #6B4F2E; border: none;
    padding: 12px 28px; border-radius: 10px; font-size: 15px;
    font-family: inherit; cursor: pointer; font-weight: bold;
  }
  .btn-cancel:hover { background: #E8D4A8; }
  .book-detail { display: flex; gap: 20px; align-items: flex-start; }
  .bd-spine {
    width: 70px; min-height: 220px; border-radius: 4px; flex-shrink: 0;
    color: #FFF8E7; padding: 16px 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 3px;
  }
  .bd-info { flex: 1; min-width: 0; }
  .bd-title { font-size: 20px; font-weight: bold; color: #4A3728; margin-bottom: 6px; }
  .bd-author { font-size: 15px; color: #8B7355; margin-bottom: 12px; }
  .bd-meta {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    font-size: 13px; color: #6B4F2E; margin-bottom: 14px;
  }
  .bd-meta span b { color: #8B6914; }
  .bd-review {
    background: #FFFCF2; padding: 12px 14px; border-radius: 10px;
    font-size: 14px; color: #4A3728; line-height: 1.8;
    border-left: 3px solid #B8860B; white-space: pre-wrap;
  }
  .bd-review:empty { display: none; }
  .bd-actions { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
  .btn-danger {
    background: transparent; color: #A0522D; border: 1px solid #A0522D;
    padding: 10px 20px; border-radius: 10px;
    cursor: pointer; font-family: inherit; font-size: 14px;
  }
  .btn-danger:hover { background: #A0522D; color: #FFF8E7; }
  .empty-tip { text-align: center; padding: 40px 20px; color: #A0896C; font-size: 15px; }
  .empty-tip .emoji { font-size: 42px; display: block; margin-bottom: 10px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px;
    color: #8B6914; background: #FFF8E7; border-radius: 20px;
    cursor: pointer; font-size: 14px;
    border: 1px solid rgba(139, 105, 20, 0.2);
    margin-bottom: 18px; transition: all 0.2s;
  }
  .back-btn:hover { background: #F5E6C8; }

    position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
    background: #4A3728; color: #FFF8E7;
    padding: 12px 28px; border-radius: 24px; font-size: 14px;
    z-index: 2000; animation: toastIn 0.3s ease;
    box-shadow: 0 4px 20px rgba(74, 55, 40, 0.4);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .streak-gradient-1 { background: linear-gradient(135deg, #A0522D, #8B4513); }
  .streak-gradient-3 { background: linear-gradient(135deg, #CD853F, #A0522D); }
  .streak-gradient-7 { background: linear-gradient(135deg, #DAA520, #B8860B); }
  .streak-gradient-14 { background: linear-gradient(135deg, #FFD700, #CD950C); }
  .streak-gradient-30 { background: linear-gradient(135deg, #FF8C00, #FF6347); }
  .streak-gradient-60 { background: linear-gradient(135deg, #FF6B6B, #EE5A6F); }
  .streak-gradient-100 { background: linear-gradient(135deg, #EE5A6F, #9B59B6, #3498DB); }

<div id="app"></div>
