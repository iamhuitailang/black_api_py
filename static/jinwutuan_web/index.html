<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劲乐团 JinWuTuan - Rhythm Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="app-container">
            <header-component v-if="currentUser" :user="currentUser" :is-admin="isAdmin" @logout="handleLogout" @navigate="navigate"></header-component>
            <main class="main-content">
                <component :is="currentPage" :user="currentUser" :is-admin="isAdmin" @navigate="navigate" @login="handleLogin" @logout="handleLogout" @game-complete="handleGameComplete"></component>
            </main>
        </div>
        <div v-if="toast.show" class="toast" :class="'toast-' + toast.type">
            {{ toast.message }}
        </div>
    </div>

    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/utils/router.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/services/auth.js"></script>
    <script src="js/components/Header.js"></script>
    <script src="js/components/GameLane.js"></script>
    <script src="js/pages/Login.js"></script>
    <script src="js/pages/Register.js"></script>
    <script src="js/pages/Home.js"></script>
    <script src="js/pages/InstrumentSelect.js"></script>
    <script src="js/pages/DifficultySelect.js"></script>
    <script src="js/pages/Game.js"></script>
    <script src="js/pages/Results.js"></script>
    <script src="js/pages/Leaderboard.js"></script>
    <script src="js/pages/Achievements.js"></script>
    <script src="js/pages/Profile.js"></script>
    <script src="js/pages/Admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
