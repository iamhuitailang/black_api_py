<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻量级图片编辑器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="editor-layout">
        <header class="editor-header">
            <div class="header-left">
                <h1 class="editor-title">🖼️ 图片编辑器</h1>
            </div>
            <div class="header-right">
                <button id="btnCompare" class="btn btn-secondary btn-sm" title="长按查看原图">
                    原图对比
                </button>
                <button id="btnUndo" class="btn btn-secondary btn-sm" title="撤销 (Ctrl+Z)" disabled>
                    ↶ 撤销
                </button>
                <button id="btnRedo" class="btn btn-secondary btn-sm" title="重做 (Ctrl+Y)" disabled>
                    ↷ 重做
                </button>
                <button id="btnReset" class="btn btn-secondary btn-sm" title="重置图片">
                    🔄 重置
                </button>
                <button id="btnExport" class="btn btn-primary btn-sm" title="导出图片">
                    💾 导出
                </button>
            </div>
        </header>

        <div class="editor-main">
            <aside class="sidebar">
                <div class="sidebar-section active" id="sectionFile">
                    <div class="section-header" data-section="file">
                        <span class="section-icon">📁</span>
                        <span class="section-title">文件操作</span>
                        <span class="section-toggle">▼</span>
                    </div>
                    <div class="section-content">
                        <div class="upload-area" id="uploadArea">
                            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/bmp" hidden>
                            <div class="upload-icon">📤</div>
                            <p>拖拽或点击上传图片</p>
                            <p class="upload-hint">支持 JPG/PNG/WebP/BMP</p>
                        </div>
                        <div class="sample-images">
                            <p class="section-subtitle">示例图片：</p>
                            <div class="sample-list" id="sampleList">
                            </div>
                        </div>
                        <div class="image-info hidden" id="imageInfo">
                            <p class="info-label">图片信息</p>
                            <p id="imageSize">-</p>
                            <p id="imageDimensions">-</p>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section" id="sectionTransform">
                    <div class="section-header" data-section="transform">
                        <span class="section-icon">🔄</span>
                        <span class="section-title">基础调整</span>
                        <span class="section-toggle">▼</span>
                    </div>
                    <div class="section-content">
                        <div class="transform-group">
                            <p class="section-subtitle">旋转与翻转</p>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-transform" data-action="rotateLeft" title="左旋90°">
                                    ↺
                                </button>
                                <button class="btn btn-sm btn-transform" data-action="rotateRight" title="右旋90°">
                                    ↻
                                </button>
                                <button class="btn btn-sm btn-transform" data-action="flipH" title="水平翻转">
                                    ↔
                                </button>
                                <button class="btn btn-sm btn-transform" data-action="flipV" title="垂直翻转">
                                    ↕
                                </button>
                            </div>
                        </div>

                        <div class="transform-group">
                            <p class="section-subtitle">缩放</p>
                            <div class="slider-group">
                                <div class="slider-header">
                                    <span>缩放比例</span>
                                    <span id="scaleValue">100%</span>
                                </div>
                                <input type="range" id="scaleSlider" min="10" max="300" value="100" step="1">
                            </div>
                        </div>

                        <div class="transform-group">
                            <p class="section-subtitle">裁剪</p>
                            <div class="crop-ratios">
                                <button class="btn btn-sm btn-crop-ratio active" data-ratio="free">自由</button>
                                <button class="btn btn-sm btn-crop-ratio" data-ratio="1:1">1:1</button>
                                <button class="btn btn-sm btn-crop-ratio" data-ratio="4:3">4:3</button>
                                <button class="btn btn-sm btn-crop-ratio" data-ratio="16:9">16:9</button>
                            </div>
                            <div class="btn-group mt-2">
                                <button class="btn btn-sm btn-crop" id="btnStartCrop">开始裁剪</button>
                                <button class="btn btn-sm btn-crop hidden" id="btnApplyCrop">应用裁剪</button>
                                <button class="btn btn-sm btn-crop btn-secondary hidden" id="btnCancelCrop">取消</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section" id="sectionAdjust">
                    <div class="section-header" data-section="adjust">
                        <span class="section-icon">🎨</span>
                        <span class="section-title">图像调节</span>
                        <span class="section-toggle">▼</span>
                    </div>
                    <div class="section-content">
                        <div class="adjust-slider-group">
                            <div class="slider-group">
                                <div class="slider-header">
                                    <span>亮度</span>
                                    <span id="brightnessValue">0</span>
                                </div>
                                <input type="range" id="brightnessSlider" min="-100" max="100" value="0" step="1">
                            </div>
                            <div class="slider-group">
                                <div class="slider-header">
                                    <span>对比度</span>
                                    <span id="contrastValue">0</span>
                                </div>
                                <input type="range" id="contrastSlider" min="-100" max="100" value="0" step="1">
                            </div>
                            <div class="slider-group">
                                <div class="slider-header">
                                    <span>饱和度</span>
                                    <span id="saturationValue">0</span>
                                </div>
                                <input type="range" id="saturationSlider" min="-100" max="100" value="0" step="1">
                            </div>
                            <div class="slider-group">
                                <div class="slider-header">
                                    <span>清晰度</span>
                                    <span id="sharpnessValue">0</span>
                                </div>
                                <input type="range" id="sharpnessSlider" min="-50" max="50" value="0" step="1">
                            </div>
                        </div>
                        <button class="btn btn-secondary btn-sm mt-2" id="btnResetAdjust">重置调节</button>
                    </div>
                </div>

                <div class="sidebar-section" id="sectionFilters">
                    <div class="section-header" data-section="filters">
                        <span class="section-icon">✨</span>
                        <span class="section-title">滤镜效果</span>
                        <span class="section-toggle">▼</span>
                    </div>
                    <div class="section-content">
                        <div class="filter-grid">
                            <button class="filter-btn active" data-filter="none">
                                <div class="filter-preview" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
                                <span>原图</span>
                            </button>
                            <button class="filter-btn" data-filter="vintage">
                                <div class="filter-preview" style="background: linear-gradient(135deg, #d4a574 0%, #8b7355 100%);"></div>
                                <span>复古</span>
                            </button>
                            <button class="filter-btn" data-filter="grayscale">
                                <div class="filter-preview" style="background: linear-gradient(135deg, #888 0%, #333 100%);"></div>
                                <span>黑白</span>
                            </button>
                            <button class="filter-btn" data-filter="sepia">
                                <div class="filter-preview" style="background: linear-gradient(135deg, #c4a77d 0%, #704214 100%);"></div>
                                <span>怀旧</span>
                            </button>
                            <button class="filter-btn" data-filter="sharpen">
                                <div class="filter-preview" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);"></div>
                                <span>锐化</span>
                            </button>
                            <button class="filter-btn" data-filter="soft">
                                <div class="filter-preview" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);"></div>
                                <span>柔光</span>
                            </button>
                            <button class="filter-btn" data-filter="warm">
                                <div class="filter-preview" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);"></div>
                                <span>暖色</span>
                            </button>
                            <button class="filter-btn" data-filter="cool">
                                <div class="filter-preview" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);"></div>
                                <span>冷色</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section" id="sectionTools">
                    <div class="section-header" data-section="tools">
                        <span class="section-icon">🛠️</span>
                        <span class="section-title">标注工具</span>
                        <span class="section-toggle">▼</span>
                    </div>
                    <div class="section-content">
                        <div class="tool-selector">
                            <button class="tool-btn active" data-tool="none">
                                <span class="tool-icon">👆</span>
                                <span>选择</span>
                            </button>
                            <button class="tool-btn" data-tool="text">
                                <span class="tool-icon">📝</span>
                                <span>文字</span>
                            </button>
                            <button class="tool-btn" data-tool="rect">
                                <span class="tool-icon">⬜</span>
                                <span>矩形</span>
                            </button>
                            <button class="tool-btn" data-tool="circle">
                                <span class="tool-icon">⭕</span>
                                <span>圆形</span>
                            </button>
                            <button class="tool-btn" data-tool="arrow">
                                <span class="tool-icon">➡️</span>
                                <span>箭头</span>
                            </button>
                            <button class="tool-btn" data-tool="mosaic">
                                <span class="tool-icon">🧩</span>
                                <span>马赛克</span>
                            </button>
                        </div>

                        <div class="tool-settings" id="toolSettings">
                            <div class="text-settings hidden" id="textSettings">
                                <p class="section-subtitle">文字设置</p>
                                <div class="setting-row">
                                    <label>文字内容：</label>
                                    <input type="text" id="textContent" class="form-control" placeholder="输入文字" value="示例文字">
                                </div>
                                <div class="setting-row">
                                    <label>字号：</label>
                                    <div class="slider-group">
                                        <input type="range" id="fontSizeSlider" min="12" max="120" value="32" step="1">
                                        <span id="fontSizeValue">32px</span>
                                    </div>
                                </div>
                                <div class="setting-row">
                                    <label>颜色：</label>
                                    <input type="color" id="textColor" value="#ff0000">
                                </div>
                                <div class="setting-row">
                                    <label>背景：</label>
                                    <div class="color-options">
                                        <button class="color-btn active" data-bg="none">无</button>
                                        <button class="color-btn" data-bg="white" style="background: white; border: 1px solid #ccc;">白</button>
                                        <button class="color-btn" data-bg="black" style="background: black; color: white;">黑</button>
                                    </div>
                                </div>
                            </div>

                            <div class="shape-settings hidden" id="shapeSettings">
                                <p class="section-subtitle">形状设置</p>
                                <div class="setting-row">
                                    <label>边框颜色：</label>
                                    <input type="color" id="shapeBorderColor" value="#ff0000">
                                </div>
                                <div class="setting-row">
                                    <label>边框宽度：</label>
                                    <div class="slider-group">
                                        <input type="range" id="shapeBorderWidth" min="1" max="20" value="3" step="1">
                                        <span id="shapeBorderWidthValue">3px</span>
                                    </div>
                                </div>
                                <div class="setting-row">
                                    <label>填充：</label>
                                    <div class="color-options">
                                        <button class="color-btn active" data-fill="none">无</button>
                                        <button class="color-btn" data-fill="red" style="background: #ff000040;"></button>
                                        <button class="color-btn" data-fill="blue" style="background: #0000ff40;"></button>
                                        <button class="color-btn" data-fill="green" style="background: #00ff0040;"></button>
                                    </div>
                                </div>
                            </div>

                            <div class="mosaic-settings hidden" id="mosaicSettings">
                                <p class="section-subtitle">马赛克设置</p>
                                <div class="setting-row">
                                    <label>笔刷大小：</label>
                                    <div class="slider-group">
                                        <input type="range" id="mosaicSize" min="10" max="100" value="30" step="5">
                                        <span id="mosaicSizeValue">30px</span>
                                    </div>
                                </div>
                                <div class="setting-row">
                                    <label>块大小：</label>
                                    <div class="slider-group">
                                        <input type="range" id="mosaicBlock" min="5" max="50" value="15" step="1">
                                        <span id="mosaicBlockValue">15px</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-secondary btn-sm mt-2" id="btnClearAnnotations">清除所有标注</button>
                    </div>
                </div>
            </aside>

            <main class="canvas-area">
                <div class="loading-overlay hidden" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                    <p>加载中...</p>
                </div>

                <div class="canvas-container" id="canvasContainer">
                    <canvas id="mainCanvas"></canvas>
                    <canvas id="previewCanvas" class="hidden"></canvas>
                    <canvas id="originalCanvas" class="hidden"></canvas>
                    
                    <div class="crop-overlay hidden" id="cropOverlay">
                        <div class="crop-box" id="cropBox">
                            <div class="crop-handle nw" data-handle="nw"></div>
                            <div class="crop-handle n" data-handle="n"></div>
                            <div class="crop-handle ne" data-handle="ne"></div>
                            <div class="crop-handle e" data-handle="e"></div>
                            <div class="crop-handle se" data-handle="se"></div>
                            <div class="crop-handle s" data-handle="s"></div>
                            <div class="crop-handle sw" data-handle="sw"></div>
                            <div class="crop-handle w" data-handle="w"></div>
                        </div>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">🖼️</div>
                    <h2>开始编辑图片</h2>
                    <p>拖拽图片到此处或点击左侧上传区域</p>
                    <button class="btn btn-primary" id="btnChooseFile">选择图片</button>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-overlay hidden" id="exportModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">导出图片</h3>
                <button class="modal-close" id="closeExportModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">导出格式</label>
                    <div class="format-options">
                        <label class="format-option active">
                            <input type="radio" name="format" value="png" checked>
                            <span class="format-label">
                                <span class="format-icon">🖼️</span>
                                <span class="format-name">PNG</span>
                                <span class="format-desc">带透明背景</span>
                            </span>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="format" value="jpeg">
                            <span class="format-label">
                                <span class="format-icon">📷</span>
                                <span class="format-name">JPEG</span>
                                <span class="format-desc">白色背景</span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-group" id="qualityGroup">
                    <label class="form-label">图片质量</label>
                    <div class="slider-group">
                        <input type="range" id="qualitySlider" min="10" max="100" value="90" step="5">
                        <span id="qualityValue">90%</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">预览</label>
                    <div class="export-preview">
                        <img id="exportPreview" alt="预览">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnCancelExport">取消</button>
                <button class="btn btn-primary" id="btnConfirmExport">下载图片</button>
            </div>
        </div>
    </div>

    <script src="js/modules/storage.js"></script>
    <script src="js/modules/history.js"></script>
    <script src="js/modules/filters.js"></script>
    <script src="js/modules/adjust.js"></script>
    <script src="js/modules/transform.js"></script>
    <script src="js/modules/tools.js"></script>
    <script src="js/modules/export.js"></script>
    <script src="js/modules/canvas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
