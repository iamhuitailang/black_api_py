<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑洞模拟器 - Black Hole Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <canvas id="simulator"></canvas>
        
        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="panel-header">
                <h3>黑洞模拟器</h3>
                <button id="toggle-panel" class="toggle-btn">≡</button>
            </div>
            
            <div class="panel-content">
                <!-- 视图控制 -->
                <div class="control-group">
                    <h4>视图控制</h4>
                    <div class="control-item">
                        <label for="auto-rotate">自动旋转</label>
                        <input type="checkbox" id="auto-rotate" checked>
                    </div>
                    <div class="control-item">
                        <label for="rotate-speed">旋转速度</label>
                        <input type="range" id="rotate-speed" min="0" max="2" step="0.1" value="0.5">
                    </div>
                    <div class="control-item">
                        <label for="zoom-level">缩放级别</label>
                        <input type="range" id="zoom-level" min="0.5" max="3" step="0.1" value="1">
                    </div>
                </div>
                
                <!-- 效果控制 -->
                <div class="control-group">
                    <h4>效果控制</h4>
                    <div class="control-item">
                        <label for="show-jets">相对论喷流</label>
                        <input type="checkbox" id="show-jets" checked>
                    </div>
                    <div class="control-item">
                        <label for="show-particles">粒子效果</label>
                        <input type="checkbox" id="show-particles" checked>
                    </div>
                    <div class="control-item">
                        <label for="accretion-speed">吸积盘速度</label>
                        <input type="range" id="accretion-speed" min="0.1" max="3" step="0.1" value="1">
                    </div>
                </div>
                
                <!-- 标记控制 -->
                <div class="control-group">
                    <h4>标记控制</h4>
                    <button id="add-marker" class="btn">添加标记</button>
                    <button id="clear-markers" class="btn">清除标记</button>
                    <div id="markers-list" class="markers-list"></div>
                </div>
                
                <!-- 重置按钮 -->
                <div class="control-group">
                    <button id="reset-view" class="btn btn-primary">重置视图</button>
                </div>
            </div>
        </div>
        
        <!-- 提示信息 -->
        <div class="tips">
            <p>鼠标拖拽旋转视图 | 滚轮缩放 | 双击添加标记</p>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
