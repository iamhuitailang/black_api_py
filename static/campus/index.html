<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校活动管理平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">🎓 高校活动管理平台</h1>
            </div>
            <div class="header-right">
                <nav class="nav-tabs">
                    <button class="nav-tab active" data-view="calendar">活动日历</button>
                    <button class="nav-tab" data-view="apply">活动申报</button>
                    <button class="nav-tab" data-view="checkin">活动签到</button>
                    <button class="nav-tab" data-view="stats">数据统计</button>
                    <button class="nav-tab" data-view="manage">活动管理</button>
                </nav>
            </div>
        </header>

        <main class="app-main">
            <section id="view-calendar" class="view active">
                <div class="calendar-topbar">
                    <div class="date-nav">
                        <button class="date-btn" id="prevMonth">◀</button>
                        <h2 class="current-date" id="currentDate"></h2>
                        <button class="date-btn" id="nextMonth">▶</button>
                        <button class="view-toggle" id="viewToggle">周视图</button>
                        <button class="date-btn" id="todayBtn">今天</button>
                    </div>
                    <div class="filter-bar">
                        <select id="filterType">
                            <option value="">全部类型</option>
                            <option value="academic">学术讲座</option>
                            <option value="culture">文体比赛</option>
                            <option value="club">社团活动</option>
                            <option value="volunteer">志愿服务</option>
                        </select>
                        <select id="filterDept">
                            <option value="">全部院系</option>
                        </select>
                    </div>
                </div>
                <div class="type-legend">
                    <span class="legend-item type-academic">学术讲座</span>
                    <span class="legend-item type-culture">文体比赛</span>
                    <span class="legend-item type-club">社团活动</span>
                    <span class="legend-item type-volunteer">志愿服务</span>
                </div>
                <div class="calendar-wrapper">
                    <div class="calendar-weekdays" id="weekdays"></div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
            </section>

            <section id="view-apply" class="view">
                <div class="panel-header">
                    <h2>📋 活动申报</h2>
                    <span class="panel-tip">活动须提前5个工作日申报</span>
                </div>
                <form class="apply-form" id="applyForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>活动名称 *</label>
                            <input type="text" name="name" required maxlength="100" placeholder="请输入活动名称">
                        </div>
                        <div class="form-group">
                            <label>活动类型 *</label>
                            <select name="type" required>
                                <option value="">请选择类型</option>
                                <option value="academic">学术讲座（须院系学术委员会审批）</option>
                                <option value="culture">文体比赛（须团委文体部审批）</option>
                                <option value="club">社团活动（须社团联合会审批）</option>
                                <option value="volunteer">志愿服务（须青年志愿者协会审批）</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>开始时间 *</label>
                            <input type="datetime-local" name="start_time" required>
                        </div>
                        <div class="form-group">
                            <label>结束时间 *</label>
                            <input type="datetime-local" name="end_time" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>活动场地 *</label>
                            <select name="venue_id" id="venueSelect" required>
                                <option value="">请选择场地</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>预计人数 *</label>
                            <input type="number" name="expected_count" min="1" max="5000" value="50">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>活动简介</label>
                        <textarea name="description" rows="3" maxlength="500" placeholder="请简要介绍活动内容"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>主办方 *</label>
                            <select name="organizer_id" id="organizerSelect" required>
                                <option value="">请选择主办方</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>主办院系</label>
                            <input type="text" name="organizer_department" placeholder="如：计算机学院">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>负责人 *</label>
                            <input type="text" name="contact_person" required placeholder="负责人姓名">
                        </div>
                        <div class="form-group">
                            <label>联系电话 *</label>
                            <input type="text" name="contact_phone" required placeholder="手机号">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>策划书（可选）</label>
                        <input type="file" name="plan_file" accept=".pdf">
                    </div>
                    <div class="conflict-alert" id="conflictAlert"></div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="checkConflictBtn">检查场地冲突</button>
                        <button type="submit" class="btn-primary">提交申报</button>
                    </div>
                </form>
            </section>

            <section id="view-checkin" class="view">
                <div class="panel-header">
                    <h2>✅ 活动签到</h2>
                </div>
                <div class="checkin-container">
                    <div class="checkin-left">
                        <div class="form-group">
                            <label>选择活动</label>
                            <select id="checkinActivitySelect">
                                <option value="">请选择活动</option>
                            </select>
                        </div>
                        <div class="checkin-stats" id="checkinStats">
                            <div class="stat-card">
                                <div class="stat-num" id="statExpected">0</div>
                                <div class="stat-label">预计人数</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-num" id="statRegistered">0</div>
                                <div class="stat-label">已报名</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-num checked" id="statChecked">0</div>
                                <div class="stat-label">已签到</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-num rate" id="statRate">0%</div>
                                <div class="stat-label">到场率</div>
                            </div>
                        </div>
                        <div class="qrcode-area">
                            <div class="qrcode-placeholder" id="qrcodePlaceholder">
                                <div class="qr-icon">📱</div>
                                <p>请选择活动后生成签到二维码</p>
                            </div>
                        </div>
                    </div>
                    <div class="checkin-right">
                        <h3>手动签到</h3>
                        <div class="manual-checkin">
                            <input type="text" id="studentNoInput" placeholder="输入学号">
                            <button class="btn-primary" id="manualCheckinBtn">签到</button>
                        </div>
                        <div class="checkin-result" id="checkinResult"></div>
                        <h3>签到列表</h3>
                        <div class="checkin-list" id="checkinList">
                            <p class="empty-tip">暂无签到记录</p>
                        </div>
                        <div class="checkin-actions">
                            <button class="btn-secondary" id="markAbsentBtn">批量标记未签到为未出席</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-stats" class="view">
                <div class="panel-header">
                    <h2>📊 数据统计</h2>
                    <select id="statsSemester">
                        <option value="">全部学期</option>
                    </select>
                </div>
                <div class="stats-overview" id="statsOverview"></div>
                <div class="stats-charts">
                    <div class="stats-card">
                        <h3>按活动类型统计</h3>
                        <div class="stats-list" id="statsByType"></div>
                    </div>
                    <div class="stats-card">
                        <h3>按院系统计</h3>
                        <div class="stats-list" id="statsByDept"></div>
                    </div>
                    <div class="stats-card wide">
                        <h3>按学期统计</h3>
                        <div class="stats-table" id="statsBySemester"></div>
                    </div>
                </div>
            </section>

            <section id="view-manage" class="view">
                <div class="panel-header">
                    <h2>📝 活动管理</h2>
                    <div class="manage-filters">
                        <select id="manageStatus">
                            <option value="">全部状态</option>
                            <option value="0">待审批</option>
                            <option value="1">已审批</option>
                            <option value="2">已驳回</option>
                            <option value="3">已取消</option>
                            <option value="4">已完成</option>
                            <option value="5">已总结</option>
                        </select>
                        <input type="text" id="manageKeyword" placeholder="搜索活动名称">
                    </div>
                </div>
                <div class="manage-list" id="manageList"></div>
                <div class="pagination" id="pagination"></div>
            </section>
        </main>
    </div>

    <div class="modal-mask" id="modalMask">
        <div class="modal" id="activityModal">
            <div class="modal-header">
                <h3 id="modalTitle">活动详情</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
