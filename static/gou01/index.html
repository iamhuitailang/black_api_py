<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐕 狗狗乐园 - 遛狗时间规划</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-content">
                <h1>🐕 狗狗乐园</h1>
                <p class="subtitle">萌宠日程管理 · 健康遛狗规划</p>
            </div>
        </header>
        
        <nav class="nav-tabs">
            <button class="nav-tab active" data-page="profile">🐕 狗狗档案</button>
            <button class="nav-tab" data-page="schedule">⏰ 遛狗时间</button>
            <button class="nav-tab" data-page="checkin">✅ 打卡记录</button>
            <button class="nav-tab" data-page="calendar">📅 日历视图</button>
            <button class="nav-tab" data-page="stats">📊 统计报表</button>
        </nav>
        
        <main class="main-content">
            <canvas id="bgCanvas"></canvas>
            <div id="pageContainer"></div>
        </main>
        
        <div id="notification" class="notification"></div>
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>
    
    <script src="js/modules/storage.js"></script>
    <script src="js/modules/dogProfile.js"></script>
    <script src="js/modules/schedule.js"></script>
    <script src="js/modules/checkin.js"></script>
    <script src="js/modules/calendar.js"></script>
    <script src="js/modules/stats.js"></script>
    <script src="js/modules/notification.js"></script>
    <script src="js/modules/canvas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
