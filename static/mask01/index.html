<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面具生成器 - Mask Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>🎭 面具生成器</h1>
            <div class="header-actions">
                <button id="resetBtn" class="btn btn-secondary">重置</button>
                <button id="saveBtn" class="btn btn-primary">保存</button>
                <button id="shareBtn" class="btn btn-primary">分享</button>
                <button id="printBtn" class="btn btn-primary">打印</button>
            </div>
        </header>
        
        <main class="main-content">
            <aside class="sidebar-left">
                <div class="panel">
                    <h3>面具形状</h3>
                    <div class="mask-shapes" id="maskShapes"></div>
                </div>
                
                <div class="panel">
                    <h3>颜色设置</h3>
                    <div class="color-settings">
                        <div class="color-group">
                            <label>主色</label>
                            <div class="color-input-group">
                                <input type="color" id="primaryColor" value="#000000">
                                <input type="text" id="primaryColorText" value="#000000">
                            </div>
                            <div class="preset-colors" id="primaryPresetColors"></div>
                        </div>
                        <div class="color-group">
                            <label>副色</label>
                            <div class="color-input-group">
                                <input type="color" id="secondaryColor" value="#FFD700">
                                <input type="text" id="secondaryColorText" value="#FFD700">
                            </div>
                            <div class="preset-colors" id="secondaryPresetColors"></div>
                        </div>
                    </div>
                </div>
                
                <div class="panel">
                    <h3>材质纹理</h3>
                    <div class="textures" id="textures"></div>
                </div>
                
                <div class="panel">
                    <h3>眼部区域</h3>
                    <div class="eye-settings">
                        <div class="eye-group">
                            <label>眼孔形状</label>
                            <div class="eye-shapes" id="eyeShapes"></div>
                        </div>
                        <div class="eye-group">
                            <label>镜片颜色</label>
                            <div class="lens-colors" id="lensColors"></div>
                        </div>
                    </div>
                </div>
            </aside>
            
            <section class="canvas-area">
                <div class="canvas-container">
                    <canvas id="maskCanvas" width="500" height="600"></canvas>
                    <div class="decorations-layer" id="decorationsLayer"></div>
                </div>
                <div class="canvas-tools">
                    <button id="undoBtn" class="btn btn-tool" title="撤销">↩</button>
                    <button id="redoBtn" class="btn btn-tool" title="重做">↪</button>
                    <button id="clearDecorationsBtn" class="btn btn-tool" title="清除装饰">🗑</button>
                </div>
            </section>
            
            <aside class="sidebar-right">
                <div class="panel">
                    <h3>📜 历史记录</h3>
                    <div class="history-header">
                        <button id="historyUndoBtn" class="btn btn-tool" title="撤销">↩</button>
                        <button id="historyRedoBtn" class="btn btn-tool" title="重做">↪</button>
                        <button id="clearHistoryBtn" class="btn btn-tool" title="清除历史">🗑</button>
                    </div>
                    <div class="history-list" id="historyList"></div>
                </div>
                
                <div class="panel">
                    <h3>装饰元素</h3>
                    <div class="decoration-tabs" id="decorationTabs"></div>
                    <div class="decoration-items" id="decorationItems"></div>
                </div>
                
                <div class="panel" id="decorationControls" style="display:none;">
                    <h3>选中装饰</h3>
                    <div class="decoration-controls">
                        <div class="control-group">
                            <label>大小</label>
                            <input type="range" id="decorationSize" min="20" max="200" value="60">
                            <span id="decorationSizeValue">60</span>
                        </div>
                        <div class="control-group">
                            <label>旋转</label>
                            <input type="range" id="decorationRotation" min="0" max="360" value="0">
                            <span id="decorationRotationValue">0°</span>
                        </div>
                        <div class="control-group">
                            <label>透明度</label>
                            <input type="range" id="decorationOpacity" min="0.1" max="1" step="0.1" value="1">
                            <span id="decorationOpacityValue">100%</span>
                        </div>
                        <button id="deleteDecorationBtn" class="btn btn-danger">删除</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>
    
    <div id="printModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>打印模板</h2>
            <canvas id="printCanvas" width="800" height="1000"></canvas>
            <div class="modal-actions">
                <button id="closePrintModal" class="btn btn-secondary">取消</button>
                <button id="confirmPrint" class="btn btn-primary">打印</button>
            </div>
        </div>
    </div>
    
    <div id="shareModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>分享面具</h2>
            <div class="share-options">
                <button id="downloadPng" class="btn btn-secondary">下载 PNG</button>
                <button id="downloadJson" class="btn btn-secondary">下载配置</button>
                <button id="copyJson" class="btn btn-secondary">复制配置</button>
            </div>
            <textarea id="shareTextarea" readonly style="display:none;"></textarea>
            <div class="modal-actions">
                <button id="closeShareModal" class="btn btn-secondary">关闭</button>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast" style="display:none;"></div>
    
    <script src="js/utils/storage.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/services/data.js"></script>
    <script src="js/services/renderer.js"></script>
    <script src="js/services/decorations.js"></script>
    <script src="js/services/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
