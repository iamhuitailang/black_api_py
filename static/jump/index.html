<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跳一跳 · 一跃成名</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- 游戏主画布 -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- 蓄力条 -->
        <div class="charge-bar-container" id="chargeBarContainer">
            <div class="charge-bar">
                <div class="charge-progress" id="chargeProgress"></div>
            </div>
            <div class="charge-text">蓄力中...</div>
        </div>
        
        <!-- 分数显示 -->
        <div class="score-display" id="scoreDisplay">
            <div class="current-score">
                <span class="label">当前分数</span>
                <span class="value" id="currentScore">0</span>
            </div>
            <div class="high-score">
                <span class="label">最高分数</span>
                <span class="value" id="highScore">0</span>
            </div>
        </div>
        
        <!-- 时间显示 (定时模式) -->
        <div class="time-display" id="timeDisplay" style="display: none;">
            <span class="label">剩余时间</span>
            <span class="value" id="timeLeft">60</span>
        </div>
        
        <!-- 连击显示 -->
        <div class="combo-display" id="comboDisplay"></div>
        
        <!-- 开始菜单 -->
        <div class="menu" id="startMenu">
            <h1 class="game-title">跳一跳</h1>
            <p class="game-subtitle">一跃成名</p>
            <div class="mode-select">
                <button class="mode-btn" id="endlessBtn">无尽模式</button>
                <button class="mode-btn" id="timedBtn">定时模式 (60秒)</button>
            </div>
            <p class="instruction">按住蓄力，松开跳跃<br>跳到中心获得Perfect加分！</p>
        </div>
        
        <!-- 暂停菜单 -->
        <div class="menu" id="pauseMenu" style="display: none;">
            <h2 class="menu-title">游戏暂停</h2>
            <div class="menu-buttons">
                <button class="game-btn" id="resumeBtn">继续游戏</button>
                <button class="game-btn" id="restartFromPauseBtn">重新开始</button>
            </div>
        </div>
        
        <!-- 游戏结束菜单 -->
        <div class="menu" id="gameOverMenu" style="display: none;">
            <h2 class="menu-title game-over">游戏结束</h2>
            <div class="final-score">
                <p class="label">本局得分</p>
                <p class="value" id="finalScore">0</p>
            </div>
            <div class="best-score" id="newRecord" style="display: none;">
                <p class="new-record-text">🎉 新纪录！</p>
            </div>
            <div class="menu-buttons">
                <button class="game-btn" id="restartBtn">再来一局</button>
                <button class="game-btn" id="backToMenuBtn">返回菜单</button>
            </div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="control-buttons" id="controlButtons" style="display: none;">
            <button class="control-btn" id="pauseBtn">暂停</button>
        </div>
        
        <!-- 震动遮罩 -->
        <div class="overlay" id="overlay"></div>
        
        <!-- 失败遮罩 -->
        <div class="fail-overlay" id="failOverlay"></div>
    </div>
    
    <script src="js/game.js"></script>
</body>
</html>
