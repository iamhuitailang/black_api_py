<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摩托车空中飞人 - Motuo Stunt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div class="hud-item">
        <span class="hud-label">距离</span>
        <span id="hud-distance">0</span>
        <span class="hud-unit">m</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">分数</span>
        <span id="hud-score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">速度</span>
        <span id="hud-speed">0</span>
        <span class="hud-unit">km/h</span>
      </div>
    </div>
    <div class="hud-right">
      <div class="hud-item">
        <span class="hud-label">最远</span>
        <span id="hud-best-distance">0</span>
        <span class="hud-unit">m</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">最高</span>
        <span id="hud-best-score">0</span>
      </div>
      <div class="hud-item hud-debug">
        <span id="hud-level-info" style="font-size:11px;opacity:0.7;"></span>
      </div>
    </div>
  </div>

  <div id="trick-indicator" class="hidden"></div>

  <div id="start-screen" class="screen">
    <div class="screen-content">
      <h1>🏍️ 摩托车空中飞人</h1>
      <p class="subtitle">操控特技摩托车完成高空飞跃，挑战极限特技闯关！</p>
      <div class="bike-select">
        <h3>选择车型</h3>
        <div id="bike-options" class="bike-options"></div>
      </div>
      <div class="theme-select">
        <h3>选择赛道主题</h3>
        <div id="theme-options" class="theme-options"></div>
      </div>
      <div class="level-select">
        <h3>选择关卡</h3>
        <div id="level-options" class="level-options"></div>
      </div>
      <button id="start-btn" class="btn btn-primary">开始游戏</button>
      <button id="continue-btn" class="btn btn-secondary hidden">继续游戏</button>
    </div>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <div class="screen-content">
      <h2>💥 本局结束</h2>
      <div class="result-stats">
        <div class="stat-row">
          <span>飞行距离</span>
          <span id="result-distance">0 m</span>
        </div>
        <div class="stat-row">
          <span>获得分数</span>
          <span id="result-score">0</span>
        </div>
        <div class="stat-row highlight" id="new-record" style="display:none;">
          <span>🎉 新纪录！</span>
        </div>
      </div>
      <button id="retry-btn" class="btn btn-primary">再来一局</button>
      <button id="menu-btn" class="btn btn-secondary">返回菜单</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="screen-content">
      <h2>⏸ 游戏暂停</h2>
      <button id="resume-btn" class="btn btn-primary">继续游戏</button>
      <button id="quit-btn" class="btn btn-secondary">退出到菜单</button>
    </div>
  </div>

  <div id="controls-hint">
    <div class="control-row">
      <span class="key">→</span> 加速 &nbsp;
      <span class="key">←</span> 减速 &nbsp;
      <span class="key">↑</span> 翘头 &nbsp;
      <span class="key">↓</span> 俯冲 &nbsp;
      <span class="key">空格</span> 跳跃/特技 &nbsp;
      <span class="key">ESC</span> 暂停
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/input.js"></script>
<script src="js/physics.js"></script>
<script src="js/renderer.js"></script>
<script src="js/tricks.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
