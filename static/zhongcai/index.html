<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 快乐农场 - 种菜收菜</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="topBar" class="top-bar">
      <div class="stat-item">
        <span class="stat-icon">💰</span>
        <span id="coins">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">⭐</span>
        <span id="level">Lv.1</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">📦</span>
        <span id="backpack">0</span>
      </div>
      <div class="exp-container">
        <div class="exp-bar">
          <div id="expBar" class="exp-fill"></div>
        </div>
      </div>
      <button id="pauseBtn" class="icon-btn" title="暂停">⏸</button>
      <button id="shopBtn" class="icon-btn" title="商店">🛒</button>
    </div>

    <div id="toolBar" class="tool-bar"></div>
    <div id="seedBar" class="seed-bar"></div>

    <div id="message" class="message"></div>

    <div id="shopPanel" class="shop-panel">
      <div class="shop-header">
        <h2>🛒 农场商店</h2>
        <button id="closeShop" class="close-btn">✕</button>
      </div>
      <div class="shop-content"></div>
    </div>
  </div>

  <script src="js/modules/config.js"></script>
  <script src="js/modules/storage.js"></script>
  <script src="js/modules/gameState.js"></script>
  <script src="js/modules/farm.js"></script>
  <script src="js/modules/renderer.js"></script>
  <script src="js/modules/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
