<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钓鱼大师 - Fishing Master</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 开始界面 -->
    <div id="start-screen" class="screen active">
      <div class="start-box">
        <h1 class="game-title">🎣 钓鱼大师 🐟</h1>
        <p class="subtitle">清新像素风 · 解压垂钓之旅</p>

        <div class="scene-select">
          <h3>选择场景</h3>
          <div class="scene-list" id="scene-list"></div>
        </div>

        <div class="player-info">
          <label>玩家名字:</label>
          <input type="text" id="player-name" maxlength="32" placeholder="匿名玩家" />
        </div>

        <div class="start-stats">
          <div class="stat-item">
            <span class="stat-label">累计钓鱼</span>
            <span class="stat-value" id="total-fish">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">最高分数</span>
            <span class="stat-value" id="best-score">0</span>
          </div>
        </div>

        <button class="btn btn-primary btn-lg" id="btn-start">开始钓鱼</button>
        <button class="btn btn-secondary" id="btn-show-leaderboard">🏆 排行榜</button>
      </div>
    </div>

    <!-- 游戏界面 -->
    <div id="game-screen" class="screen">
      <div class="game-hud">
        <div class="hud-left">
          <div class="hud-item">
            <span class="hud-icon">⏱️</span>
            <span class="hud-label">时间</span>
            <span class="hud-value" id="timer">3:00</span>
          </div>
          <div class="hud-item">
            <span class="hud-icon">🎯</span>
            <span class="hud-label">得分</span>
            <span class="hud-value" id="score">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-icon">🐠</span>
            <span class="hud-label">鱼数</span>
            <span class="hud-value" id="fish-count">0</span>
          </div>
        </div>
        <div class="hud-right">
          <span class="scene-name" id="current-scene-name">池塘</span>
        </div>
      </div>

      <div class="game-stage" id="game-stage">
        <!-- 背景层 -->
        <div class="bg-layer" id="bg-layer">
          <div class="sky"></div>
          <div class="scene-bg" id="scene-bg"></div>
          <div class="ground" id="ground"></div>
          <div class="water-surface" id="water-surface"></div>
          <div class="water-layer" id="water-layer">
            <div class="water-shimmer"></div>
          </div>
        </div>

        <!-- 游戏元素层 -->
        <div class="game-layer" id="game-layer">
          <div class="fisherman" id="fisherman"></div>
          <div class="fishing-rod" id="fishing-rod"></div>
          <div class="fishing-line" id="fishing-line"></div>
          <div class="hook" id="hook"></div>
          <div class="float" id="float"></div>
          <div class="splashes" id="splashes"></div>
          <div class="fish-layer" id="fish-layer"></div>
          <div class="fish-display" id="fish-display"></div>
        </div>

        <!-- 张力条 -->
        <div class="tension-wrap" id="tension-wrap">
          <div class="tension-label">张力</div>
          <div class="tension-bar">
            <div class="tension-fill" id="tension-fill"></div>
            <div class="tension-danger-mark"></div>
          </div>
          <div class="tension-hint">快速交替按 ← → 收线！</div>
        </div>

        <!-- 状态提示 -->
        <div class="bubble-toast" id="bubble-toast"></div>
      </div>

      <!-- 控制按钮 -->
      <div class="game-controls">
        <button class="btn btn-cast" id="btn-cast">🎣 抛竿</button>
        <button class="btn btn-reel" id="btn-reel" disabled>🪝 收竿</button>
      </div>
    </div>

    <!-- 结算界面 -->
    <div id="result-screen" class="screen">
      <div class="result-box">
        <h2 class="result-title">🎉 钓鱼结束！</h2>

        <div class="result-summary">
          <div class="summary-item">
            <span class="s-label">总得分</span>
            <span class="s-value big" id="result-score">0</span>
          </div>
          <div class="summary-item">
            <span class="s-label">鱼获数量</span>
            <span class="s-value" id="result-fish-count">0</span>
          </div>
          <div class="summary-item">
            <span class="s-label">最大鱼</span>
            <span class="s-value" id="result-biggest">0 kg</span>
          </div>
        </div>

        <div class="fish-basket">
          <h3>🐟 鱼篓</h3>
          <div class="basket-list" id="basket-list"></div>
        </div>

        <div class="result-actions">
          <div class="name-row">
            <label>玩家:</label>
            <input type="text" id="result-player-name" maxlength="32" placeholder="匿名玩家" />
          </div>
          <button class="btn btn-primary" id="btn-submit-score">📤 提交成绩</button>
          <button class="btn btn-secondary" id="btn-show-leaderboard2">🏆 排行榜</button>
          <button class="btn btn-primary btn-outline" id="btn-back-home">🏠 返回首页</button>
        </div>
      </div>
    </div>

    <!-- 排行榜弹窗 -->
    <div id="leaderboard-modal" class="modal">
      <div class="modal-box">
        <h3 class="modal-title">🏆 钓鱼排行榜</h3>
        <div class="leaderboard-list" id="leaderboard-list">
          <div class="loading">加载中...</div>
        </div>
        <button class="btn btn-secondary" id="btn-close-leaderboard">关闭</button>
      </div>
    </div>

    <!-- 音效播放器 -->
    <audio id="audio-bite" preload="auto"></audio>
    <audio id="audio-splash" preload="auto"></audio>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
