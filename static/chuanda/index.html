<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>穿搭温度计 · 今天穿什么</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌡️ 穿搭温度计</h1>
            <p class="subtitle">今天穿什么？看我就知道啦～</p>
        </header>

        <main>
            <section class="input-section">
                <div class="input-group">
                    <h3>🌡️ 选择温度</h3>
                    <div class="temperature-control">
                        <input type="range" id="tempSlider" min="-10" max="40" value="20">
                        <div class="temp-display">
                            <input type="number" id="tempInput" min="-10" max="40" value="20">
                            <span class="unit">℃</span>
                        </div>
                    </div>
                    <div class="temp-range">
                        <span>-10℃</span>
                        <span>40℃</span>
                    </div>
                </div>

                <div class="input-group">
                    <h3>🌤️ 天气状况</h3>
                    <div class="weather-buttons" id="weatherButtons">
                        <button class="weather-btn active" data-weather="sunny">☀️</button>
                        <button class="weather-btn" data-weather="cloudy">☁️</button>
                        <button class="weather-btn" data-weather="rainy">🌧️</button>
                        <button class="weather-btn" data-weather="snowy">❄️</button>
                        <button class="weather-btn" data-weather="windy">🌬️</button>
                    </div>
                    <p class="weather-label" id="weatherLabel">晴天</p>
                </div>

                <div class="input-group">
                    <h3>👤 风格选择</h3>
                    <div class="style-buttons" id="styleButtons">
                        <button class="style-btn active" data-style="female">👩 女性</button>
                        <button class="style-btn" data-style="male">👨 男性</button>
                        <button class="style-btn" data-style="child">🧒 儿童</button>
                    </div>
                </div>
            </section>

            <section class="result-section">
                <div class="result-header">
                    <div class="temp-tag" id="tempTag">舒适</div>
                    <button class="random-btn" id="randomBtn">🎲 换一套</button>
                </div>

                <div class="message-box" id="messageBox">
                    今天天气舒适，适合轻装上阵～
                </div>

                <div class="outfit-preview">
                    <canvas id="outfitCanvas" width="200" height="300"></canvas>
                    <div class="character-emoji" id="characterEmoji">🧑‍🧒</div>
                </div>

                <div class="outfit-details" id="outfitDetails">
                    <div class="outfit-item">
                        <span class="item-icon">👕</span>
                        <div class="item-info">
                            <h4>上衣</h4>
                            <p class="item-desc" id="topDesc">T恤</p>
                        </div>
                    </div>
                    <div class="outfit-item">
                        <span class="item-icon">👖</span>
                        <div class="item-info">
                            <h4>下装</h4>
                            <p class="item-desc" id="bottomDesc">牛仔裤</p>
                        </div>
                    </div>
                    <div class="outfit-item">
                        <span class="item-icon">👟</span>
                        <div class="item-info">
                            <h4>鞋子</h4>
                            <p class="item-desc" id="shoesDesc">运动鞋</p>
                        </div>
                    </div>
                    <div class="outfit-item">
                        <span class="item-icon">🧣</span>
                        <div class="item-info">
                            <h4>配饰</h4>
                            <p class="item-desc" id="accessoriesDesc">无</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>💡 提示：所有设置会自动保存，下次打开直接显示上次的穿搭建议</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
