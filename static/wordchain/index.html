<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词语接龙 - 登录/注册</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="game-title">🎮 词语接龙</h1>
            <p class="game-subtitle">机器裁判，绝不耍赖！</p>
        </div>
        
        <div class="auth-tabs">
            <button class="tab-btn active" data-tab="login">登录</button>
            <button class="tab-btn" data-tab="register">注册</button>
        </div>
        
        <div class="auth-forms">
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
                <p class="form-tip">还没有账号？点击上方"注册"按钮</p>
            </form>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerUsername">用户名</label>
                    <input type="text" id="registerUsername" placeholder="2-20个字符" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">密码</label>
                    <input type="password" id="registerPassword" placeholder="至少6位" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
                <p class="form-tip">已有账号？点击上方"登录"按钮</p>
            </form>
        </div>
        
        <div class="game-rules">
            <h3>📖 游戏规则</h3>
            <ul>
                <li>⏱️ 每轮15秒内必须输入词语</li>
                <li>🔤 词语必须以上一个词的最后一个字开头</li>
                <li>🏆 两字词10分，三字词20分，四字及以上35分</li>
                <li>🔥 连续5轮成功触发连胜加成，得分翻倍</li>
            </ul>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script src="js/api.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
</body>
</html>
