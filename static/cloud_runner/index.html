<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>踩着云朵奔跑 - Cloud Runner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="600"></canvas>

        <div class="ui-overlay">
            <div class="score-panel">
                <div class="score-item">
                    <span class="label">距离</span>
                    <span id="distance" class="value">0 m</span>
                </div>
                <div class="score-item">
                    <span class="label">分数</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">风之精华</span>
                    <span id="essence" class="value">0</span>
                </div>
            </div>

            <div class="power-bar-container" id="powerBarContainer" style="display: none;">
                <div class="power-bar">
                    <div class="power-fill" id="powerFill"></div>
                </div>
                <span class="power-label">蓄力中...</span>
            </div>

            <div class="fly-indicator" id="flyIndicator" style="display: none;">
                <span class="fly-icon">✦</span>
                <span class="fly-text">飞行中</span>
                <div class="fly-bar">
                    <div class="fly-fill" id="flyFill"></div>
                </div>
            </div>

            <div class="stun-indicator" id="stunIndicator" style="display: none;">
                <span>⚡ 被击晕了！</span>
            </div>
        </div>

        <div class="start-screen" id="startScreen">
            <h1 class="game-title">踩着云朵奔跑</h1>
            <p class="game-subtitle">Cloud Runner</p>
            <div class="instructions">
                <p>🎮 <strong>长按空格</strong> 蓄力跳得更远</p>
                <p>✨ <strong>收集风之精华</strong> 获得短暂飞行</p>
                <p>⚡ <strong>躲避雷云</strong> 否则会被击晕</p>
                <p>☁️ 云朵会随时间消散，快速前进！</p>
            </div>
            <div class="name-input">
                <label for="playerName">你的名字：</label>
                <input type="text" id="playerName" maxlength="20" placeholder="输入名字">
            </div>
            <button class="start-btn" id="startBtn">开始游戏</button>
        </div>

        <div class="game-over-screen" id="gameOverScreen" style="display: none;">
            <h2>游戏结束</h2>
            <div class="final-stats">
                <div class="stat-item">
                    <span class="stat-label">最终距离</span>
                    <span class="stat-value" id="finalDistance">0 m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">最终分数</span>
                    <span class="stat-value" id="finalScore">0</span>
                </div>
                <div class="stat-item" id="rankItem" style="display: none;">
                    <span class="stat-label">当前排名</span>
                    <span class="stat-value" id="playerRank">#0</span>
                </div>
            </div>
            <div class="leaderboard">
                <h3>🏆 排行榜</h3>
                <ol id="leaderboardList"></ol>
            </div>
            <button class="restart-btn" id="restartBtn">再来一次</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
