<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA 螺旋生成器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- 头部标题 -->
        <header class="header">
            <h1>DNA 双螺旋生成器</h1>
            <div class="header-info">
                <span id="mode-badge">3D 模式</span>
                <span id="base-pair-count">碱基对: 0</span>
            </div>
        </header>

        <!-- 主内容区 -->
        <div class="main-container">
            <!-- 渲染区域 -->
            <div class="canvas-container">
                <canvas id="dna-canvas"></canvas>
                <div class="canvas-overlay">
                    <div id="info-panel" class="info-panel">
                        <h3>当前视图</h3>
                        <p id="info-text">拖拽旋转 | 滚轮缩放 | 空格暂停</p>
                    </div>
                </div>
            </div>

            <!-- 控制面板 -->
            <aside class="control-panel">
                <div class="panel-section">
                    <h3>可视化模式</h3>
                    <div class="mode-toggle">
                        <button id="mode-3d-btn" class="mode-btn active">3D 视图</button>
                        <button id="mode-2d-btn" class="mode-btn">2D 视图</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>参数控制</h3>
                    
                    <div class="control-group">
                        <label>
                            <span>螺旋半径</span>
                            <span class="value-display" id="radius-value">1.0</span>
                        </label>
                        <input type="range" id="radius" min="0.5" max="2.5" step="0.1" value="1.0">
                    </div>

                    <div class="control-group">
                        <label>
                            <span>螺旋高度</span>
                            <span class="value-display" id="height-value">8.0</span>
                        </label>
                        <input type="range" id="height" min="3" max="15" step="0.5" value="8.0">
                    </div>

                    <div class="control-group">
                        <label>
                            <span>旋转圈数</span>
                            <span class="value-display" id="turns-value">2.0</span>
                        </label>
                        <input type="range" id="turns" min="0.5" max="6" step="0.5" value="2.0">
                    </div>

                    <div class="control-group">
                        <label>
                            <span>碱基对数量</span>
                            <span class="value-display" id="base-pairs-value">20</span>
                        </label>
                        <input type="range" id="base-pairs" min="8" max="60" step="1" value="20">
                    </div>

                    <div class="control-group">
                        <label>
                            <span>螺旋速度</span>
                            <span class="value-display" id="speed-value">1.0</span>
                        </label>
                        <input type="range" id="speed" min="-3" max="3" step="0.1" value="1.0">
                    </div>

                    <div class="control-group">
                        <label>
                            <span>链粗细</span>
                            <span class="value-display" id="strand-thickness-value">0.1</span>
                        </label>
                        <input type="range" id="strand-thickness" min="0.05" max="0.3" step="0.01" value="0.1">
                    </div>
                </div>

                <div class="panel-section">
                    <h3>颜色设置</h3>
                    
                    <div class="color-group">
                        <label>链 A 颜色</label>
                        <div class="color-picker-row">
                            <input type="color" id="strand-a-color" value="#00ff88">
                            <span class="color-value" id="strand-a-color-value">#00ff88</span>
                        </div>
                    </div>

                    <div class="color-group">
                        <label>链 B 颜色</label>
                        <div class="color-picker-row">
                            <input type="color" id="strand-b-color" value="#00aaff">
                            <span class="color-value" id="strand-b-color-value">#00aaff</span>
                        </div>
                    </div>

                    <div class="color-group">
                        <label>A-T 碱基颜色</label>
                        <div class="color-picker-row">
                            <input type="color" id="at-base-color" value="#ff4444">
                            <span class="color-value" id="at-base-color-value">#ff4444</span>
                        </div>
                    </div>

                    <div class="color-group">
                        <label>C-G 碱基颜色</label>
                        <div class="color-picker-row">
                            <input type="color" id="cg-base-color" value="#4444ff">
                            <span class="color-value" id="cg-base-color-value">#4444ff</span>
                        </div>
                    </div>

                    <div class="color-group">
                        <label>背景颜色</label>
                        <div class="color-picker-row">
                            <input type="color" id="bg-color" value="#0a0a1a">
                            <span class="color-value" id="bg-color-value">#0a0a1a</span>
                        </div>
                    </div>

                    <div class="color-group">
                        <label>光照颜色</label>
                        <div class="color-picker-row">
                            <input type="color" id="light-color" value="#ffffff">
                            <span class="color-value" id="light-color-value">#ffffff</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>显示选项</h3>
                    
                    <div class="toggle-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="show-labels" checked>
                            <span>显示碱基标签</span>
                        </label>
                    </div>

                    <div class="toggle-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="auto-rotate" checked>
                            <span>自动旋转</span>
                        </label>
                    </div>

                    <div class="toggle-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="show-glow" checked>
                            <span>发光效果</span>
                        </label>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>操作</h3>
                    <button id="reset-btn" class="action-btn">重置为默认</button>
                    <button id="randomize-btn" class="action-btn">随机参数</button>
                </div>
            </aside>
        </div>
    </div>

    <!-- JavaScript 模块 - 按依赖顺序加载 -->
    <script src="js/modules/config.js"></script>
    <script src="js/modules/storage.js"></script>
    <script src="js/modules/utils.js"></script>
    <script src="js/modules/renderer3d.js"></script>
    <script src="js/modules/renderer2d.js"></script>
    <script src="js/modules/interaction.js"></script>
    <script src="js/modules/controls.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
