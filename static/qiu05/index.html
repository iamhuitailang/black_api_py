<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平衡球大冒险</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game-container {
    position: relative;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 20px;
}

.hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    border-radius: 15px;
    color: white;
}

.hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.hud-label {
    font-size: 12px;
    opacity: 0.9;
}

.hud-value {
    font-size: 20px;
    font-weight: bold;
}

.pause-btn {
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid white;
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.pause-btn:hover {
    background: white;
    color: #f5576c;
}

#gameCanvas {
    display: block;
    border-radius: 15px;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.1);
    position: relative;
    z-index: 1;
}

.menu {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    text-align: center;
    z-index: 10000;
    min-width: 350px;
    pointer-events: auto;
}

.menu.hidden {
    display: none !important;
}

.game-title {
    font-size: 32px;
    color: #667eea;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.game-subtitle {
    color: #666;
    margin-bottom: 20px;
    font-size: 16px;
}

.controls-info {
    background: #f8f9fa;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.controls-info p {
    color: #555;
    margin: 8px 0;
    font-size: 14px;
}

.menu-title {
    font-size: 28px;
    color: #667eea;
    margin-bottom: 25px;
}

.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.menu-btn {
    padding: 14px 28px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
}

.menu-btn.primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.menu-btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}

.menu-btn.secondary {
    background: #f0f0f0;
    color: #555;
}

.menu-btn.secondary:hover {
    background: #e0e0e0;
    transform: translateY(-2px);
}

.level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.level-btn {
    width: 70px;
    height: 70px;
    border: 3px solid #667eea;
    border-radius: 15px;
    background: white;
    color: #667eea;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.level-btn:hover {
    background: #667eea;
    color: white;
    transform: scale(1.1);
}

.level-btn.locked {
    border-color: #ccc;
    color: #ccc;
    cursor: not-allowed;
}

.level-btn.locked:hover {
    background: white;
    transform: none;
}

.level-btn .stars {
    font-size: 10px;
    margin-top: 4px;
}

.win-stats {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.win-stats p {
    font-size: 18px;
    color: #555;
    margin: 10px 0;
}

.win-stats span {
    font-weight: bold;
    color: #667eea;
}

.complete-text {
    color: #666;
    margin-bottom: 25px;
    font-size: 16px;
}
    </style>
</head>

function getLevel(levelId) {

class Physics {
    constructor() {
        this.ball = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            radius: 15,
        };
        this.tilt = { x: 0, y: 0 };
        this.walls = [];
        this.traps = [];
        this.stars = [];
        this.endPos = { x: 0, y: 0 };
        this.collectedStars = [];
    }

    initLevel(levelData) {
        this.ball.x = levelData.startPos.x;
        this.ball.y = levelData.startPos.y;
        this.ball.vx = 0;
        this.ball.vy = 0;
        this.walls = levelData.walls;
        this.traps = levelData.traps;
        this.stars = JSON.parse(JSON.stringify(levelData.stars));
        this.endPos = levelData.endPos;
        this.collectedStars = [];
        this.tilt = { x: 0, y: 0 };
    }

    setTilt(tiltX, tiltY) {
        this.tilt.x = tiltX;
        this.tilt.y = tiltY;
    }

    update() {
        this.ball.vx += this.tilt.x * 0.15;
        this.ball.vy += this.tilt.y * 0.15;

        this.ball.vx *= 0.98;
        this.ball.vy *= 0.98;

        this.ball.x += this.ball.vx;
        this.ball.y += this.ball.vy;

        this.handleWallCollisions();
        this.checkStarCollection();
        return this.checkGameEvents();
    }

    handleWallCollisions() {
        for (const wall of this.walls) {
            const closestX = Math.max(wall.x, Math.min(this.ball.x, wall.x + wall.w));
            const closestY = Math.max(wall.y, Math.min(this.ball.y, wall.y + wall.h));
            
            const distX = this.ball.x - closestX;
            const distY = this.ball.y - closestY;
            const distance = Math.sqrt(distX * distX + distY * distY);

            if (distance < this.ball.radius) {
                const overlap = this.ball.radius - distance;
                const normX = distance > 0 ? distX / distance : 0;
                const normY = distance > 0 ? distY / distance : 1;

                this.ball.x += normX * overlap;
                this.ball.y += normY * overlap;

                const dotProduct = this.ball.vx * normX + this.ball.vy * normY;
                this.ball.vx -= 2 * dotProduct * normX * 0.6;
                this.ball.vy -= 2 * dotProduct * normY * 0.6;
            }
        }
    }

    checkStarCollection() {
        for (let i = this.stars.length - 1; i >= 0; i--) {
            const star = this.stars[i];
            const dist = Math.sqrt(
                Math.pow(this.ball.x - star.x, 2) + 
                Math.pow(this.ball.y - star.y, 2)
            );
            if (dist < this.ball.radius + 15) {
                this.collectedStars.push(star);
                this.stars.splice(i, 1);
            }
        }
    }

    checkGameEvents() {
        for (const trap of this.traps) {
            if (this.ball.x > trap.x && this.ball.x < trap.x + trap.w &&
                this.ball.y > trap.y && this.ball.y < trap.y + trap.h) {
                return { type: 'trap' };
            }
        }

        const endDist = Math.sqrt(
            Math.pow(this.ball.x - this.endPos.x, 2) + 
            Math.pow(this.ball.y - this.endPos.y, 2)
        );
        if (endDist < this.ball.radius + 25) {
            return { type: 'win', stars: this.collectedStars.length };
        }

        return { type: 'continue', stars: this.collectedStars.length };
    }

    getBallState() {
        return { ...this.ball };
    }

    getState() {
        return {
            ball: { ...this.ball },
            tilt: { ...this.tilt },
            collectedStars: [...this.collectedStars],
            remainingStars: [...this.stars],
        };
    }

    restoreState(state) {
        console.log('Before restore - ball pos:', this.ball.x, this.ball.y);
        this.ball = { ...state.ball };
        this.tilt = { ...state.tilt };
        this.collectedStars = [...state.collectedStars];
        this.stars = [...state.remainingStars];
        console.log('After restore - ball pos:', this.ball.x, this.ball.y);
        console.log('Restored stars:', this.stars);
    }
}

class Renderer {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.time = 0;
    }

    render(physics, levelData) {
        this.time += 0.05;
        
        this.ctx.clearRect(0, 0, 600, 500);
        
        this.drawBackground();
        this.drawEnd(levelData.endPos);
        this.drawWalls(levelData.walls);
        this.drawTraps(levelData.traps);
        this.drawStars(physics.stars);
        this.drawBall(physics.getBallState());
    }

    drawBackground() {
        const gradient = this.ctx.createLinearGradient(0, 0, 600, 500);
        gradient.addColorStop(0, '#a8edea');
        gradient.addColorStop(1, '#fed6e3');
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(0, 0, 600, 500);
        
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        for (let i = 0; i < 20; i++) {
            const x = (i * 73 + this.time * 10) % 600;
            const y = (i * 53) % 500;
            this.ctx.beginPath();
            this.ctx.arc(x, y, 3 + Math.sin(this.time + i) * 2, 0, Math.PI * 2);
            this.ctx.fill();
        }
    }

    drawWalls(walls) {
        for (const wall of walls) {
            this.ctx.fillStyle = 'rgba(139, 92, 246, 0.3)';
            this.ctx.fillRect(wall.x + 3, wall.y + 3, wall.w, wall.h);
            
            const gradient = this.ctx.createLinearGradient(wall.x, wall.y, wall.x + wall.w, wall.y + wall.h);
            gradient.addColorStop(0, '#a78bfa');
            gradient.addColorStop(1, '#7c3aed');
            this.ctx.fillStyle = gradient;
            this.ctx.beginPath();
            this.ctx.roundRect(wall.x, wall.y, wall.w, wall.h, 5);
            this.ctx.fill();
            
            this.ctx.strokeStyle = '#6d28d9';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
        }
    }

    drawStars(stars) {
        for (const star of stars) {
            const glowSize = 25 + Math.sin(this.time * 3) * 5;
            const gradient = this.ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, glowSize);
            gradient.addColorStop(0, 'rgba(251, 191, 36, 0.6)');
            gradient.addColorStop(1, 'rgba(251, 191, 36, 0)');
            this.ctx.fillStyle = gradient;
            this.ctx.beginPath();
            this.ctx.arc(star.x, star.y, glowSize, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.fillStyle = '#fbbf24';
            this.drawStar(star.x, star.y, 5, 15, 7);
        }
    }

    drawStar(cx, cy, spikes, outerRadius, innerRadius) {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        const step = Math.PI / spikes;

        this.ctx.beginPath();
        this.ctx.moveTo(cx, cy - outerRadius);

        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            this.ctx.lineTo(x, y);
            rot += step;

            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            this.ctx.lineTo(x, y);
            rot += step;
        }

        this.ctx.lineTo(cx, cy - outerRadius);
        this.ctx.closePath();
        this.ctx.fill();
    }

    drawTraps(traps) {
        for (const trap of traps) {
            const centerX = trap.x + trap.w / 2;
            const centerY = trap.y + trap.h / 2;
            
            const gradient = this.ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, trap.w);
            gradient.addColorStop(0, 'rgba(239, 68, 68, 0.5)');
            gradient.addColorStop(1, 'rgba(239, 68, 68, 0)');
            this.ctx.fillStyle = gradient;
            this.ctx.fillRect(trap.x - 10, trap.y - 10, trap.w + 20, trap.h + 20);

            this.ctx.fillStyle = '#ef4444';
            this.ctx.beginPath();
            this.ctx.arc(centerX, centerY, trap.w / 2, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.fillStyle = '#fca5a5';
            this.ctx.beginPath();
            this.ctx.arc(centerX, centerY, trap.w / 4, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.fillStyle = '#fff';
            this.ctx.font = 'bold 16px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText('!', centerX, centerY);
        }
    }

    drawEnd(endPos) {
        const pulseSize = 30 + Math.sin(this.time * 2) * 5;
        const gradient = this.ctx.createRadialGradient(endPos.x, endPos.y, 0, endPos.x, endPos.y, pulseSize);
        gradient.addColorStop(0, 'rgba(16, 185, 129, 0.6)');
        gradient.addColorStop(1, 'rgba(16, 185, 129, 0)');
        this.ctx.fillStyle = gradient;
        this.ctx.beginPath();
        this.ctx.arc(endPos.x, endPos.y, pulseSize, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#10b981';
        this.ctx.beginPath();
        this.ctx.arc(endPos.x, endPos.y, 25, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#fff';
        this.ctx.font = 'bold 20px Arial';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText('★', endPos.x, endPos.y);
    }

    drawBall(ball) {
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        this.ctx.beginPath();
        this.ctx.ellipse(ball.x + 3, ball.y + 3, ball.radius, ball.radius * 0.6, 0, 0, Math.PI * 2);
        this.ctx.fill();

        const gradient = this.ctx.createRadialGradient(
            ball.x - ball.radius * 0.3, 
            ball.y - ball.radius * 0.3, 
            0, 
            ball.x, 
            ball.y, 
            ball.radius
        );
        gradient.addColorStop(0, '#a78bfa');
        gradient.addColorStop(0.5, '#7c3aed');
        gradient.addColorStop(1, '#5b21b6');
        this.ctx.fillStyle = gradient;
        this.ctx.beginPath();
        this.ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        this.ctx.beginPath();
        this.ctx.arc(ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.3, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.strokeStyle = '#4c1d95';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        this.ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        this.ctx.stroke();
    }
}

class InputManager {
    constructor() {
        this.keys = {};
        this.tilt = { x: 0, y: 0 };
        this.setupEventListeners();
    }

    setupEventListeners() {
        document.addEventListener('keydown', (e) => {
            this.keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            this.keys[e.key.toLowerCase()] = false;
        });
    }

    update() {
        let targetTiltX = 0;
        let targetTiltY = 0;

        if (this.keys['w'] || this.keys['arrowup']) {
            targetTiltY = -0.8;
        }
        if (this.keys['s'] || this.keys['arrowdown']) {
            targetTiltY = 0.8;
        }
        if (this.keys['a'] || this.keys['arrowleft']) {
            targetTiltX = -0.8;
        }
        if (this.keys['d'] || this.keys['arrowright']) {
            targetTiltX = 0.8;
        }

        this.tilt.x += (targetTiltX - this.tilt.x) * 0.1;
        this.tilt.y += (targetTiltY - this.tilt.y) * 0.1;

        return { ...this.tilt };
    }

    reset() {
        this.tilt = { x: 0, y: 0 };
        this.keys = {};
    }
}

class UIManager {
    constructor() {
        this.menus = {
            start: document.getElementById('startMenu'),
            pause: document.getElementById('pauseMenu'),
            levelSelect: document.getElementById('levelSelectMenu'),
            win: document.getElementById('winMenu'),
            complete: document.getElementById('completeMenu'),
        };
        
        this.hud = {
            level: document.getElementById('levelDisplay'),
            stars: document.getElementById('starsDisplay'),
            time: document.getElementById('timeDisplay'),
        };

        this.buttons = {
            start: document.getElementById('startBtn'),
            selectLevel: document.getElementById('selectLevelBtn'),
            resume: document.getElementById('resumeBtn'),
            restart: document.getElementById('restartBtn'),
            exit: document.getElementById('exitBtn'),
            back: document.getElementById('backBtn'),
            nextLevel: document.getElementById('nextLevelBtn'),
            replay: document.getElementById('replayBtn'),
            playAgain: document.getElementById('playAgainBtn'),
            pause: document.getElementById('pauseBtn'),
        };

        this.levelGrid = document.getElementById('levelGrid');
    }

    showMenu(menuName) {
        Object.values(this.menus).forEach(menu => {
            menu.classList.add('hidden');
        });
        if (menuName && this.menus[menuName]) {
            this.menus[menuName].classList.remove('hidden');
        }
    }

    updateHUD(level, starsCollected, totalStars, time) {
        this.hud.level.textContent = level;
        this.hud.stars.textContent = `${starsCollected}/${totalStars}`;
        this.hud.time.textContent = this.formatTime(time);
    }

    updateWinScreen(stars, time) {
        document.getElementById('winStars').textContent = stars;
        document.getElementById('winTime').textContent = this.formatTime(time);
    }

    formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    populateLevelSelect(progress, unlockedLevels) {
        this.levelGrid.innerHTML = '';
        
        LEVELS.forEach((level, index) => {
            const levelBtn = document.createElement('button');
            levelBtn.className = `level-btn ${index >= unlockedLevels ? 'locked' : ''}`;
            levelBtn.innerHTML = `
                <span>${level.id}</span>
                <span class="stars">${this.getStarsDisplay(progress[level.id])}</span>
            `;
            
            if (index < unlockedLevels) {
                levelBtn.addEventListener('click', () => {
                    this.onLevelSelect && this.onLevelSelect(level.id);
                });
            }
            
            this.levelGrid.appendChild(levelBtn);
        });
    }

    getStarsDisplay(progress) {
        if (!progress) return '☆☆☆☆☆';
        const stars = progress.stars || 0;
        return '★'.repeat(stars) + '☆'.repeat(5 - stars);
    }

    bindButtonEvents(callbacks) {
        this.buttons.start.addEventListener('click', callbacks.onStart);
        this.buttons.selectLevel.addEventListener('click', callbacks.onSelectLevel);
        this.buttons.resume.addEventListener('click', callbacks.onResume);
        this.buttons.restart.addEventListener('click', callbacks.onRestart);
        this.buttons.exit.addEventListener('click', callbacks.onExit);
        this.buttons.back.addEventListener('click', callbacks.onBack);
        this.buttons.nextLevel.addEventListener('click', callbacks.onNextLevel);
        this.buttons.replay.addEventListener('click', callbacks.onReplay);
        this.buttons.playAgain.addEventListener('click', callbacks.onPlayAgain);
        this.buttons.pause.addEventListener('click', callbacks.onPause);
        
        this.onLevelSelect = callbacks.onLevelSelect;
    }
}

class StorageManager {
    saveGame(gameState) {
        try {
            const data = JSON.stringify(gameState);
            localStorage.setItem('balance_ball_game_state', data);
            console.log('Game saved to localStorage:', gameState);
            return true;
        } catch (e) {
            console.error('Failed to save game:', e);
            return false;
        }
    }

    loadGame() {
        try {
            const data = localStorage.getItem('balance_ball_game_state');
            console.log('Raw data from localStorage:', data);
            if (data) {
                const parsed = JSON.parse(data);
                console.log('Parsed game state:', parsed);
                return parsed;
            }
        } catch (e) {
            console.error('Failed to load game:', e);
        }
        return null;
    }

    clearGame() {
        localStorage.removeItem('balance_ball_game_state');
    }

    saveProgress(levelId, stars, time) {
        const progress = this.loadProgress();
        if (!progress[levelId] || progress[levelId].stars < stars) {
            progress[levelId] = { stars, bestTime: time };
        }
        try {
            localStorage.setItem('balance_ball_progress', JSON.stringify(progress));
        } catch (e) {
            console.error('Failed to save progress:', e);
        }
    }

    loadProgress() {
        try {
            const data = localStorage.getItem('balance_ball_progress');
            if (data) {
                return JSON.parse(data);
            }
        } catch (e) {
            console.error('Failed to load progress:', e);
        }
        return {};
    }
}

class Game {
    constructor() {
        console.log('Initializing game...');
        this.canvas = document.getElementById('gameCanvas');
        this.physics = new Physics();
        this.renderer = new Renderer(this.canvas);
        this.input = new InputManager();
        this.ui = new UIManager();
        this.storage = new StorageManager();

        this.currentLevel = 1;
        this.gameState = GAME_STATE.MENU;
        this.elapsedTime = 0;
        this.lastTime = 0;
        this.lastSaveTime = 0;
        this.unlockedLevels = 1;

        this.init();
    }

    init() {
        const levelData = getLevel(this.currentLevel);
        this.physics.initLevel(levelData);

        this.ui.bindButtonEvents({
            onStart: () => this.startGame(),
            onSelectLevel: () => this.showLevelSelect(),
            onResume: () => this.resumeGame(),
            onRestart: () => this.restartLevel(),
            onExit: () => this.exitToMenu(),
            onBack: () => this.showStartMenu(),
            onNextLevel: () => this.nextLevel(),
            onReplay: () => this.restartLevel(),
            onPlayAgain: () => this.exitToMenu(),
            onPause: () => this.pauseGame(),
            onLevelSelect: (levelId) => this.selectLevel(levelId),
        });
        
        this.loadProgress();
        
        window.addEventListener('beforeunload', () => {
            console.log('Page closing, saving game...');
            this.saveGameState();
        });
        
        this.gameLoop(0);
        console.log('Game initialized successfully!');
    }

    loadProgress() {
        try {
            const progress = this.storage.loadProgress() || {};
            this.unlockedLevels = Math.max(1, Object.keys(progress).length + 1);
            this.ui.populateLevelSelect(progress, this.unlockedLevels);

            const savedGame = this.storage.loadGame();
            console.log('Loaded saved game:', savedGame);
            if (savedGame && savedGame.physicsState) {
                this.currentLevel = savedGame.currentLevel || 1;
                this.elapsedTime = savedGame.elapsedTime || 0;
                const levelData = getLevel(this.currentLevel);
                if (levelData) {
                    console.log('Restoring physics state:', savedGame.physicsState);
                    this.physics.initLevel(levelData);
                    this.physics.restoreState(savedGame.physicsState);
                    
                    if (savedGame.gameState === GAME_STATE.PAUSED) {
                        this.gameState = GAME_STATE.PAUSED;
                        this.ui.showMenu('pause');
                    } else {
                        this.gameState = GAME_STATE.PLAYING;
                        this.ui.showMenu(null);
                    }
                    console.log('Game state restored successfully!');
                }
            }
        } catch (e) {
            console.error('Error loading progress:', e);
            this.storage.clearGame();
        }
    }

    startGame() {
        console.log('Start game clicked!');
        this.storage.clearGame();
        this.currentLevel = 1;
        this.elapsedTime = 0;
        this.lastSaveTime = 0;
        this.initLevel();
        this.gameState = GAME_STATE.PLAYING;
        this.ui.showMenu(null);
    }

    showLevelSelect() {
        console.log('Select level clicked!');
        const progress = this.storage.loadProgress() || {};
        this.ui.populateLevelSelect(progress, this.unlockedLevels);
        this.ui.showMenu('levelSelect');
    }

    showStartMenu() {
        this.ui.showMenu('start');
    }

    selectLevel(levelId) {
        this.storage.clearGame();
        this.currentLevel = levelId;
        this.elapsedTime = 0;
        this.lastSaveTime = 0;
        this.initLevel();
        this.gameState = GAME_STATE.PLAYING;
        this.ui.showMenu(null);
    }

    initLevel() {
        const levelData = getLevel(this.currentLevel);
        this.physics.initLevel(levelData);
        this.input.reset();
    }

    pauseGame() {
        if (this.gameState === GAME_STATE.PLAYING) {
            this.gameState = GAME_STATE.PAUSED;
            this.ui.showMenu('pause');
            this.saveGameState();
        }
    }

    resumeGame() {
        this.gameState = GAME_STATE.PLAYING;
        this.ui.showMenu(null);
    }

    restartLevel() {
        this.elapsedTime = 0;
        this.initLevel();
        this.gameState = GAME_STATE.PLAYING;
        this.ui.showMenu(null);
    }

    exitToMenu() {
        this.gameState = GAME_STATE.MENU;
        this.storage.clearGame();
        this.ui.showMenu('start');
    }

    nextLevel() {
        if (this.currentLevel < LEVELS.length) {
            this.currentLevel++;
            this.elapsedTime = 0;
            this.initLevel();
            this.gameState = GAME_STATE.PLAYING;
            this.ui.showMenu(null);
        } else {
            this.gameState = GAME_STATE.COMPLETE;
            this.ui.showMenu('complete');
        }
    }

    handleWin(starsCollected) {
        this.gameState = GAME_STATE.WIN;
        this.storage.saveProgress(this.currentLevel, starsCollected, this.elapsedTime);
        
        if (this.currentLevel >= this.unlockedLevels && this.currentLevel < LEVELS.length) {
            this.unlockedLevels = this.currentLevel + 1;
        }

        this.ui.updateWinScreen(starsCollected, this.elapsedTime);
        this.ui.showMenu('win');
        this.storage.clearGame();
    }

    handleTrap() {
        this.initLevel();
    }

    saveGameState() {
        const gameState = {
            currentLevel: this.currentLevel,
            elapsedTime: this.elapsedTime,
            gameState: this.gameState,
            physicsState: this.physics.getState(),
        };
        console.log('Saving game state:', gameState);
        this.storage.saveGame(gameState);
    }

    update(deltaTime) {
        if (this.gameState !== GAME_STATE.PLAYING) return;

        this.elapsedTime += deltaTime / 1000;

        const tilt = this.input.update();
        this.physics.setTilt(tilt.x, tilt.y);
        
        const result = this.physics.update();

        const levelData = getLevel(this.currentLevel);
        this.ui.updateHUD(
            this.currentLevel,
            result.stars || 0,
            levelData.stars.length,
            this.elapsedTime
        );

        if (this.elapsedTime - this.lastSaveTime > 0.5) {
            this.saveGameState();
            this.lastSaveTime = this.elapsedTime;
        }

        if (result.type === 'win') {
            this.handleWin(result.stars);
        } else if (result.type === 'trap') {
            this.handleTrap();
        }
    }

    render() {
        const levelData = getLevel(this.currentLevel);
        this.renderer.render(this.physics, levelData);
    }

    gameLoop(timestamp) {
        const deltaTime = timestamp - this.lastTime;
        this.lastTime = timestamp;

        this.update(deltaTime);
        this.render();

        requestAnimationFrame((t) => this.gameLoop(t));
    }
}

window.addEventListener('load', () => {
    console.log('Page fully loaded, starting game...');
    try {
        new Game();
    } catch (e) {
        console.error('Error initializing game:', e);
    }
});
