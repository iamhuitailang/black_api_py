<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猴子爬树 - Monkey Climb</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-ui">
            <div class="top-bar">
                <div class="stat-item">
                    <span class="label">高度</span>
                    <span id="height-display" class="value">0m</span>
                </div>
                <div class="stat-item">
                    <span class="label">得分</span>
                    <span id="score-display" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">时间</span>
                    <span id="time-display" class="value">00:00</span>
                </div>
            </div>
            <button id="pause-btn" class="pause-btn">⏸️</button>
        </div>

        <canvas id="game-canvas"></canvas>

        <div id="start-screen" class="overlay active">
            <div class="menu-box">
                <h1 class="game-title">🐒 猴子爬树</h1>
                <p class="game-subtitle">攀爬、收集、躲避！</p>
                <div class="mode-select">
                    <button class="mode-btn active" data-mode="single">单点模式</button>
                    <button class="mode-btn" data-mode="charge">蓄力模式</button>
                    <button class="mode-btn" data-mode="rhythm">节奏模式</button>
                </div>
                <button id="start-btn" class="primary-btn">开始游戏</button>
                <div class="high-score">
                    <span>最高纪录：</span>
                    <span id="high-score">0</span>
                </div>
            </div>
        </div>

        <div id="pause-screen" class="overlay">
            <div class="menu-box">
                <h2>游戏暂停</h2>
                <button id="resume-btn" class="primary-btn">继续游戏</button>
                <button id="restart-btn" class="secondary-btn">重新开始</button>
                <button id="quit-btn" class="secondary-btn">退出游戏</button>
            </div>
        </div>

        <div id="gameover-screen" class="overlay">
            <div class="menu-box">
                <h2>游戏结束</h2>
                <div class="result-stats">
                    <div class="result-item">
                        <span class="label">最终高度</span>
                        <span id="final-height" class="value">0m</span>
                    </div>
                    <div class="result-item">
                        <span class="label">最终得分</span>
                        <span id="final-score" class="value">0</span>
                    </div>
                    <div id="new-record" class="new-record hidden">🎉 新纪录！</div>
                </div>
                <button id="retry-btn" class="primary-btn">再来一次</button>
                <button id="home-btn" class="secondary-btn">返回主页</button>
            </div>
        </div>

        <div id="charge-bar" class="charge-bar hidden">
            <div class="charge-fill"></div>
        </div>

        <div id="floating-texts" class="floating-texts"></div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/state.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/input.js"></script>
    <script src="js/obstacles.js"></script>
    <script src="js/items.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
