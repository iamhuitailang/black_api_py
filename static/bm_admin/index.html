<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 活动报名系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>活动管理后台</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">首页</a>
                <a href="activity_list.html" class="nav-item">活动管理</a>
                <a href="registration_list.html" class="nav-item">报名管理</a>
                <a href="checkin.html" class="nav-item">签到管理</a>
            </nav>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>欢迎回来</h1>
                <div class="user-info">
                    <span id="userName">管理员</span>
                    <button id="logoutBtn" class="logout-btn">退出登录</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>最新活动</h2>
                    <a href="activity_list.html" class="btn-primary" style="padding: 8px 16px; text-decoration: none; border-radius: 6px;">查看全部</a>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>活动名称</th>
                                <th>地点</th>
                                <th>开始时间</th>
                                <th>名额</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="activityList">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            DashboardPage.init();
        });
    </script>
</body>
</html>
