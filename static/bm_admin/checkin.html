<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到管理 - 活动报名系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>活动管理后台</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">首页</a>
                <a href="activity_list.html" class="nav-item">活动管理</a>
                <a href="registration_list.html" class="nav-item">报名管理</a>
                <a href="checkin.html" class="nav-item active">签到管理</a>
            </nav>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>签到管理</h1>
                <div class="user-info">
                    <span id="userName">管理员</span>
                    <button id="logoutBtn" class="logout-btn">退出登录</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>扫码签到</h2>
                </div>

                <div class="checkin-input">
                    <input type="text" id="qrcodeInput" placeholder="请输入签到码..." style="width: 100%;">
                    <button id="checkinBtn" class="btn-primary">签到</button>
                </div>

                <div id="checkinResult" class="hidden"></div>
            </div>
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/checkin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            CheckinPage.init();
        });
    </script>
</body>
</html>
