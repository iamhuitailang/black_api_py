<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动管理 - 活动报名系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>活动管理后台</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">首页</a>
                <a href="activity_list.html" class="nav-item active">活动管理</a>
                <a href="registration_list.html" class="nav-item">报名管理</a>
                <a href="checkin.html" class="nav-item">签到管理</a>
            </nav>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>活动管理</h1>
                <div class="user-info">
                    <span id="userName">管理员</span>
                    <button id="logoutBtn" class="logout-btn">退出登录</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>活动列表</h2>
                    <button id="addActivityBtn" class="btn-primary">+ 创建活动</button>
                </div>

                <div class="filter-bar">
                    <select id="statusFilter">
                        <option value="">全部状态</option>
                        <option value="1">报名中</option>
                        <option value="2">进行中</option>
                        <option value="3">已结束</option>
                        <option value="4">已取消</option>
                    </select>
                    <input type="text" id="keyword" placeholder="搜索活动名称...">
                    <button id="searchBtn">搜索</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>活动名称</th>
                                <th>地点</th>
                                <th>开始时间</th>
                                <th>名额</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="activityList">
                        </tbody>
                    </table>
                </div>

                <div id="pagination" class="pagination"></div>
            </div>
        </div>
    </div>

    <div id="activityModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h2 id="modalTitle">创建活动</h2>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <form id="activityForm">
                <input type="hidden" id="activityId">
                <div class="form-group">
                    <label>活动名称</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>活动描述</label>
                    <textarea id="description" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>活动地点</label>
                    <input type="text" id="location" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>开始时间</label>
                        <input type="datetime-local" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>结束时间</label>
                        <input type="datetime-local" id="endTime" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>报名开始时间</label>
                        <input type="datetime-local" id="registrationStart" required>
                    </div>
                    <div class="form-group">
                        <label>报名截止时间</label>
                        <input type="datetime-local" id="registrationEnd" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>总名额</label>
                        <input type="number" id="totalQuota" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>审核方式</label>
                        <select id="needApproval">
                            <option value="0">免审核</option>
                            <option value="1">需审核</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="document.getElementById('activityModal').classList.remove('active')">取消</button>
                    <button type="submit" class="btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/activity.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            ActivityPage.init();
        });
    </script>
</body>
</html>
