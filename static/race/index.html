<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛艇竞速 · 激流争锋</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="start-menu" class="menu-overlay">
            <div class="menu-content">
                <h1>🌊 赛艇竞速</h1>
                <h2>激流争锋</h2>
                <div class="menu-buttons">
                    <button id="btn-start" class="menu-btn primary">开始游戏</button>
                    <button id="btn-difficulty" class="menu-btn">难度: <span id="difficulty-text">中等</span></button>
                    <button id="btn-records" class="menu-btn">最佳记录</button>
                </div>
                <div class="controls-hint">
                    <p>← → 方向键控制左右移动</p>
                    <p>空格键 使用道具</p>
                </div>
            </div>
        </div>

        <div id="pause-menu" class="menu-overlay hidden">
            <div class="menu-content">
                <h2>游戏暂停</h2>
                <div class="menu-buttons">
                    <button id="btn-resume" class="menu-btn primary">继续游戏</button>
                    <button id="btn-restart" class="menu-btn">重新开始</button>
                    <button id="btn-quit" class="menu-btn">退出游戏</button>
                </div>
            </div>
        </div>

        <div id="finish-menu" class="menu-overlay hidden">
            <div class="menu-content">
                <h2 id="finish-title">比赛结束!</h2>
                <div class="result-stats">
                    <p>用时: <span id="finish-time">00:00.00</span></p>
                    <p>排名: <span id="finish-rank">1</span></p>
                    <p>得分: <span id="finish-score">0</span></p>
                </div>
                <div class="menu-buttons">
                    <button id="btn-again" class="menu-btn primary">再来一局</button>
                    <button id="btn-home" class="menu-btn">返回主页</button>
                </div>
            </div>
        </div>

        <div id="records-menu" class="menu-overlay hidden">
            <div class="menu-content">
                <h2>🏆 最佳记录</h2>
                <div id="records-list" class="records-list"></div>
                <div class="menu-buttons">
                    <button id="btn-back" class="menu-btn primary">返回</button>
                </div>
            </div>
        </div>

        <div id="game-hud" class="hidden">
            <div class="hud-top">
                <div class="hud-item">
                    <span class="hud-label">时间</span>
                    <span id="hud-time" class="hud-value">00:00.00</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">进度</span>
                    <span id="hud-progress" class="hud-value">0%</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">得分</span>
                    <span id="hud-score" class="hud-value">0</span>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="hud-item">
                    <span class="hud-label">速度</span>
                    <span id="hud-speed" class="hud-value">0</span>
                </div>
                <div id="powerup-slot" class="powerup-slot hidden">
                    <span id="powerup-icon"></span>
                    <span id="powerup-timer"></span>
                </div>
                <button id="btn-pause" class="pause-btn">⏸️</button>
            </div>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/track.js"></script>
    <script src="js/boat.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
