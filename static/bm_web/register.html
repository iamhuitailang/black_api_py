<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>🎪 活动报名</h1>
            <p class="auth-subtitle">创建新账号</p>

            <form id="registerForm" class="form">
                <div class="form-group">
                    <label>手机号 *</label>
                    <input type="tel" id="phone" required placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="nickname" placeholder="请输入昵称">
                </div>
                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" id="realName" placeholder="请输入真实姓名">
                </div>
                <div class="form-group">
                    <label>密码 *</label>
                    <input type="password" id="password" required placeholder="请输入密码（至少6位）">
                </div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>

            <div class="auth-switch">
                已有账号？<a href="login.html">立即登录</a>
            </div>

            <div class="auth-footer">
                <a href="index.html">← 返回首页</a>
            </div>
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/pages/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AuthPage.init();
        });
    </script>
</body>
</html>
