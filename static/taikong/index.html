<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>太空侵略者 - Space Invaders</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud">
            <div class="hud-item">
                <span class="label">分数</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="hud-item">
                <span class="label">关卡</span>
                <span id="level" class="value">1</span>
            </div>
            <div class="hud-item">
                <span class="label">生命</span>
                <span id="lives" class="value">❤️❤️❤️</span>
            </div>
            <div class="hud-item">
                <span class="label">最高分</span>
                <span id="highScore" class="value">0</span>
            </div>
        </div>

        <div id="startScreen" class="overlay active">
            <div class="menu">
                <h1>🚀 太空侵略者</h1>
                <p class="subtitle">SPACE INVADERS</p>
                <div class="controls-info">
                    <p>← / A - 左移</p>
                    <p>→ / D - 右移</p>
                    <p>空格 - 射击</p>
                    <p>ESC - 暂停</p>
                    <p>R - 重开</p>
                </div>
                <button id="startBtn" class="btn primary">开始游戏</button>
                <button id="resumeBtn" class="btn secondary" style="display: none;">继续游戏</button>
            </div>
        </div>

        <div id="pauseScreen" class="overlay">
            <div class="menu">
                <h2>⏸️ 游戏暂停</h2>
                <button id="continueBtn" class="btn primary">继续游戏</button>
                <button id="restartBtn" class="btn secondary">重新开始</button>
                <button id="quitBtn" class="btn danger">退出游戏</button>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay">
            <div class="menu">
                <h2>💥 游戏结束</h2>
                <p class="final-score">最终得分: <span id="finalScore">0</span></p>
                <p class="final-level">到达关卡: <span id="finalLevel">1</span></p>
                <button id="playAgainBtn" class="btn primary">再来一局</button>
                <button id="backToMenuBtn" class="btn secondary">返回主菜单</button>
            </div>
        </div>

        <div id="levelUpScreen" class="overlay">
            <div class="menu">
                <h2>🎉 关卡完成!</h2>
                <p class="level-info">当前分数: <span id="levelScore">0</span></p>
                <p class="level-info">关卡奖励: +<span id="levelBonus">100</span></p>
                <p class="level-info">进入第 <span id="nextLevel">2</span> 关</p>
                <button id="nextLevelBtn" class="btn primary">继续</button>
            </div>
        </div>

        <div id="scorePopup" class="score-popup"></div>
    </div>

    <script src="js/modules/config.js"></script>
    <script src="js/modules/storage.js"></script>
    <script src="js/modules/player.js"></script>
    <script src="js/modules/invaders.js"></script>
    <script src="js/modules/bullets.js"></script>
    <script src="js/modules/bunkers.js"></script>
    <script src="js/modules/ufo.js"></script>
    <script src="js/modules/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
