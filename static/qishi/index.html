<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空洞骑士 - 深渊回响</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="screen">
            <div class="title-container">
                <h1 class="game-title">空洞骑士</h1>
                <h2 class="game-subtitle">深渊回响</h2>
                <p class="game-desc">在虫巢深渊中探索你的命运</p>
            </div>
            <div class="menu-buttons">
                <button id="start-btn" class="menu-btn">开始游戏</button>
                <button id="continue-btn" class="menu-btn" style="display: none;">继续游戏</button>
            </div>
            <div class="controls-info">
                <h3>操作说明</h3>
                <p>← → 或 A D : 移动</p>
                <p>↑ 或 W 或 空格 : 跳跃</p>
                <p>J 或 Z : 攻击</p>
                <p>K 或 X : 法术</p>
                <p>Shift : 冲刺</p>
                <p>ESC 或 P : 暂停</p>
            </div>
        </div>

        <div id="game-screen" class="screen" style="display: none;">
            <canvas id="game-canvas"></canvas>
            <div id="hud">
                <div class="hud-left">
                    <div id="health-bar" class="stat-bar"></div>
                    <div id="soul-bar" class="stat-bar"></div>
                </div>
                <div class="hud-right">
                    <div id="dream-essence" class="essence-display">
                        <span class="essence-icon">✦</span>
                        <span id="essence-count">0</span>
                    </div>
                </div>
            </div>
            <div id="abilities-display" class="abilities-display"></div>
            <div id="pause-menu" class="pause-menu" style="display: none;">
                <div class="pause-content">
                    <h2>游戏暂停</h2>
                    <button id="resume-btn" class="menu-btn">继续游戏</button>
                    <button id="restart-btn" class="menu-btn">重新开始</button>
                    <button id="quit-btn" class="menu-btn">返回主菜单</button>
                </div>
            </div>
            <div id="boss-health-container" class="boss-health-container" style="display: none;">
                <div class="boss-name" id="boss-name">BOSS</div>
                <div class="boss-health-bar">
                    <div class="boss-health-fill" id="boss-health-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/input.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/entity.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/platform.js"></script>
    <script src="js/map.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
