<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背题神器 - 专注高效的科学记忆工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav-bar" id="nav-bar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">📚</span>
                <span class="logo-text">背题神器</span>
            </div>
            <ul class="nav-links" id="nav-links">
                <li class="nav-item" data-route="home" id="nav-home">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">首页</span>
                </li>
                <li class="nav-item" data-route="bank" id="nav-bank">
                    <span class="nav-icon">📁</span>
                    <span class="nav-text">题库</span>
                </li>
                <li class="nav-item" data-route="wrong" id="nav-wrong">
                    <span class="nav-icon">❌</span>
                    <span class="nav-text">错题本</span>
                    <span class="nav-badge" id="wrong-badge" style="display: none;">0</span>
                </li>
                <li class="nav-item" data-route="favorites" id="nav-favorites">
                    <span class="nav-icon">⭐</span>
                    <span class="nav-text">收藏夹</span>
                </li>
                <li class="nav-item" data-route="review" id="nav-review">
                    <span class="nav-icon">🔄</span>
                    <span class="nav-text">待复习</span>
                    <span class="nav-badge" id="review-badge" style="display: none;">0</span>
                </li>
                <li class="nav-item" data-route="stats" id="nav-stats">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">统计</span>
                </li>
                <li class="nav-item" data-route="settings" id="nav-settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">设置</span>
                </li>
            </ul>
        </div>
    </nav>

    <main class="main-content" id="main-content">
    </main>

    <div class="toast-container" id="toast-container"></div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content">
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/utils/router.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/utils/eventBus.js"></script>
    <script src="js/utils/canvas.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="js/utils/share.js"></script>
    <script src="js/models/bank.js"></script>
    <script src="js/models/question.js"></script>
    <script src="js/models/studyRecord.js"></script>
    <script src="js/models/dailyPlan.js"></script>
    <script src="js/algorithms/memory.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/bank.js"></script>
    <script src="js/pages/study.js"></script>
    <script src="js/pages/wrongBook.js"></script>
    <script src="js/pages/favorites.js"></script>
    <script src="js/pages/review.js"></script>
    <script src="js/pages/stats.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/pages/exam.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
