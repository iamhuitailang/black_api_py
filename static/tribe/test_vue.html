<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Vue Test</title></head>
<body style="background:#1a1a2e;color:white;padding:20px;">
<div id="app">
    <h1>{{ title }}</h1>
    <button @click="count++">Click me: {{ count }}</button>
    <div v-if="showSecret">Secret revealed!</div>
    <ul><li v-for="item in items" :key="item">{{ item }}</li></ul>
</div>
<script src="http://localhost:8000/static/tribe/vue.global.js"></script>
<script>
const { createApp, ref } = Vue;
createApp({
    setup() {
        return {
            title: ref('Vue In-DOM Test Works!'),
            count: ref(0),
            showSecret: ref(true),
            items: ref(['Apple', 'Banana', 'Cherry'])
        };
    }
}).mount('#app');
</script>
</body>
</html>
