<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人类一败涂地 - 马戏闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 32px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(240, 147, 251, 0.4);
        }

        .input {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .hidden {
            display: none !important;
        }

        /* 登录页面 */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .register-link {
            margin-top: 20px;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            margin-top: 16px;
            color: #f5576c;
            font-size: 14px;
        }

        .success {
            margin-top: 16px;
            color: #11998e;
            font-size: 14px;
        }

        /* 首页 */
        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: white;
        }

        .home-header h1 {
            font-size: 32px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .username {
            font-size: 18px;
            font-weight: 600;
        }

        .menu-card {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .menu-card h2 {
            color: #333;
            margin-bottom: 32px;
            font-size: 28px;
        }

        .menu-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .menu-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .play-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .levels-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .character-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .menu-btn .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .menu-btn .text {
            font-size: 18px;
        }

        .progress-section {
            text-align: left;
        }

        .progress-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .progress-item {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .level-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .level-status {
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .level-status.completed {
            background: #d4edda;
            color: #155724;
        }

        .level-status.attempted {
            background: #fff3cd;
            color: #856404;
        }

        .level-status.locked {
            background: #e2e3e5;
            color: #6c757d;
        }

        .controls-hint {
            max-width: 800px;
            margin: 30px auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
        }

        .controls-hint h3 {
            margin-bottom: 16px;
            text-align: center;
        }

        .hint-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .hint-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-family: monospace;
        }

        /* 角色选择 */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .character-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 3px solid transparent;
        }

        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .character-card.selected {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.3);
        }

        .character-preview {
            width: 120px;
            height: 160px;
            margin: 0 auto 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f0f0 0%, #e0e0e0 100%);
            position: relative;
            overflow: hidden;
        }

        .doll {
            position: relative;
            width: 60px;
            height: 120px;
        }

        .doll .head {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .doll .body {
            width: 35px;
            height: 50px;
            border-radius: 12px;
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .doll .arms {
            position: absolute;
            top: 42px;
            width: 100%;
        }

        .doll .arm {
            width: 12px;
            height: 40px;
            border-radius: 6px;
            position: absolute;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .doll .arm.left {
            left: 0;
            transform: rotate(20deg);
        }

        .doll .arm.right {
            right: 0;
            transform: rotate(-20deg);
        }

        .doll .legs {
            position: absolute;
            top: 85px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .doll .leg {
            width: 12px;
            height: 35px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .character-info h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .character-info p {
            color: #666;
            font-size: 12px;
            line-height: 1.4;
        }

        .selected-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        /* 关卡选择 */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .level-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            gap: 16px;
            border: 3px solid transparent;
        }

        .level-card:hover:not(.locked) {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .level-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .level-card.completed {
            border-color: #38ef7d;
        }

        .level-number {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .level-preview {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .theme-balloon {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }

        .theme-bridge {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .theme-trampoline {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .theme-tightrope {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .level-icon {
            font-size: 48px;
        }

        .level-info {
            flex: 1;
        }

        .level-info h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .level-info .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .level-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .difficulty {
            color: #f5a623;
            font-size: 14px;
        }

        .completed-badge {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 游戏页面 */
        .game-container {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .reset-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .level-name {
            font-size: 20px;
            font-weight: 600;
        }

        .timer {
            font-size: 24px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
        }

        .game-area {
            position: relative;
        }

        .game-canvas {
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 100%);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .game-controls {
            margin-top: 20px;
            display: flex;
            gap: 24px;
            background: rgba(255, 255, 255, 0.1);
            padding: 16px 32px;
            border-radius: 12px;
            color: white;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .control-keys {
            display: flex;
            gap: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            min-width: 400px;
        }

        .modal h2 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .modal p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .victory-modal h2 {
            color: #FFD700;
        }

        .gameover-modal h2 {
            color: #f5576c;
        }

        @media (max-width: 1200px) {
            .game-canvas {
                width: 100%;
                height: auto;
            }
            
            .game-controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        @media (max-width: 900px) {
            .character-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .menu-buttons {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .levels-grid {
                grid-template-columns: 1fr;
            }
            
            .progress-grid {
                grid-template-columns: 1fr;
            }
            
            .hint-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .character-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 登录页面 -->
        <div id="login-page" class="login-container">
            <div class="card login-card">
                <h1>🎪 人类一败涂地</h1>
                <p class="subtitle">马戏闯关大冒险</p>
                
                <div class="form">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="login-username" class="input" placeholder="请输入用户名" required />
                    </div>
                    
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="login-password" class="input" placeholder="请输入密码" required />
                    </div>
                    
                    <button onclick="handleLogin()" class="btn btn-primary" style="width: 100%;">登录</button>
                </div>
                
                <p class="register-link">
                    还没有账号？<a onclick="showPage('register-page')">立即注册</a>
                </p>
                
                <p id="login-error" class="error" style="display: none;"></p>
            </div>
        </div>

        <!-- 注册页面 -->
        <div id="register-page" class="login-container hidden">
            <div class="card login-card">
                <h1>🎪 创建账号</h1>
                <p class="subtitle">加入马戏闯关大冒险</p>
                
                <div class="form">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="register-username" class="input" placeholder="请输入用户名" required />
                    </div>
                    
                    <div class="form-group">
                        <label>昵称</label>
                        <input type="text" id="register-nickname" class="input" placeholder="请输入昵称" />
                    </div>
                    
                    <div class="form-group">
                        <label>邮箱（选填）</label>
                        <input type="email" id="register-email" class="input" placeholder="请输入邮箱" />
                    </div>
                    
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="register-password" class="input" placeholder="请输入密码" required />
                    </div>
                    
                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="register-confirm-password" class="input" placeholder="请再次输入密码" required />
                    </div>
                    
                    <button onclick="handleRegister()" class="btn btn-success" style="width: 100%;">注册</button>
                </div>
                
                <p class="register-link">
                    已有账号？<a onclick="showPage('login-page')">立即登录</a>
                </p>
                
                <p id="register-error" class="error" style="display: none;"></p>
                <p id="register-success" class="success" style="display: none;"></p>
            </div>
        </div>

        <!-- 首页 -->
        <div id="home-page" class="hidden">
            <div class="container">
                <div class="home-header">
                    <h1>🎪 人类一败涂地</h1>
                    <div class="user-info">
                        <span id="home-username" class="username"></span>
                        <button onclick="handleLogout()" class="btn btn-warning" style="padding: 8px 16px; font-size: 14px;">退出登录</button>
                    </div>
                </div>

                <div class="card menu-card">
                    <h2>选择你的冒险</h2>
                    
                    <div class="menu-buttons">
                        <button onclick="startGame()" class="menu-btn play-btn">
                            <span class="icon">🎮</span>
                            <span class="text">开始游戏</span>
                        </button>
                        
                        <button onclick="showPage('levels-page')" class="menu-btn levels-btn">
                            <span class="icon">🗺️</span>
                            <span class="text">选择关卡</span>
                        </button>
                        
                        <button onclick="showPage('character-page')" class="menu-btn character-btn">
                            <span class="icon">🎭</span>
                            <span class="text">选择角色</span>
                        </button>
                    </div>

                    <div class="progress-section">
                        <h3>游戏进度</h3>
                        <div id="progress-grid" class="progress-grid"></div>
                    </div>
                </div>

                <div class="controls-hint">
                    <h3>操作说明</h3>
                    <div class="hint-grid">
                        <div class="hint-item"><span class="key">←→</span> 左右移动</div>
                        <div class="hint-item"><span class="key">↑</span> 跳跃/起身</div>
                        <div class="hint-item"><span class="key">↓</span> 俯身/下蹲</div>
                        <div class="hint-item"><span class="key">Q</span> 左手抓取</div>
                        <div class="hint-item"><span class="key">E</span> 右手抓取</div>
                        <div class="hint-item"><span class="key">R</span> 重置关卡</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 角色选择页面 -->
        <div id="character-page" class="hidden">
            <div class="container">
                <div class="home-header">
                    <button onclick="showPage('home-page')" class="back-btn">← 返回首页</button>
                    <h1>🎭 选择角色</h1>
                    <div></div>
                </div>

                <div id="character-grid" class="character-grid"></div>
            </div>
        </div>

        <!-- 关卡选择页面 -->
        <div id="levels-page" class="hidden">
            <div class="container">
                <div class="home-header">
                    <button onclick="showPage('home-page')" class="back-btn">← 返回首页</button>
                    <h1>🗺️ 选择关卡</h1>
                    <div></div>
                </div>

                <div id="levels-grid" class="levels-grid"></div>
            </div>
        </div>

        <!-- 游戏页面 -->
        <div id="game-page" class="hidden">
            <div class="game-container">
                <div class="game-header">
                    <div class="header-left">
                        <button onclick="exitGame()" class="back-btn">← 退出</button>
                        <span id="game-level-name" class="level-name"></span>
                    </div>
                    <div class="header-center">
                        <span id="game-timer" class="timer">⏱️ 00:00</span>
                    </div>
                    <div class="header-right">
                        <button onclick="resetLevel()" class="reset-btn">🔄 重置 (R)</button>
                    </div>
                </div>

                <div class="game-area">
                    <canvas id="game-canvas" class="game-canvas" width="1200" height="600"></canvas>
                </div>

                <div class="game-controls">
                    <div class="control-group">
                        <span class="control-label">移动</span>
                        <div class="control-keys">
                            <span class="key">←</span>
                            <span class="key">→</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <span class="control-label">跳跃/起身</span>
                        <span class="key">↑</span>
                    </div>
                    <div class="control-group">
                        <span class="control-label">俯身</span>
                        <span class="key">↓</span>
                    </div>
                    <div class="control-group">
                        <span class="control-label">左手抓取</span>
                        <span class="key">Q</span>
                    </div>
                    <div class="control-group">
                        <span class="control-label">右手抓取</span>
                        <span class="key">E</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 胜利弹窗 -->
        <div id="victory-modal" class="modal-overlay hidden">
            <div class="modal victory-modal">
                <h2>🎉 恭喜通关！</h2>
                <p id="victory-time">用时: 00:00</p>
                <div class="modal-buttons">
                    <button onclick="nextLevel()" class="btn btn-primary" id="next-level-btn">下一关</button>
                    <button onclick="replayLevel()" class="btn btn-warning">重玩</button>
                    <button onclick="exitGame()" class="btn btn-success">返回主页</button>
                </div>
            </div>
        </div>

        <!-- 失败弹窗 -->
        <div id="gameover-modal" class="modal-overlay hidden">
            <div class="modal gameover-modal">
                <h2>💥 挑战失败</h2>
                <p>不要气馁，再试一次！</p>
                <div class="modal-buttons">
                    <button onclick="resetLevel()" class="btn btn-primary">重试</button>
                    <button onclick="exitGame()" class="btn btn-warning">返回主页</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        // 全局状态
        let currentUser = JSON.parse(localStorage.getItem('renlei_user') || 'null');
        let currentToken = localStorage.getItem('renlei_token') || '';
        let characters = [];
        let levels = [];
        let progress = [];
        let currentCharacter = null;
        let currentLevel = null;
        let selectedCharacterId = null;

        // 游戏状态
        let engine = null;
        let render = null;
        let runner = null;
        let player = null;
        let gameLoop = null;
        let elapsedTime = 0;
        let isPlaying = false;
        let keys = {};
        let obstacles = [];
        let sessionToken = null;

        // API基础URL
        const API_BASE = '/api';

        // 显示页面
        function showPage(pageId) {
            document.querySelectorAll('#app > div').forEach(div => {
                div.classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
            
            if (pageId === 'home-page') {
                loadHomeData();
            } else if (pageId === 'character-page') {
                loadCharacters();
            } else if (pageId === 'levels-page') {
                loadLevels();
            }
        }

        // API请求
        async function apiRequest(url, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                },
            };
            
            let requestUrl = API_BASE + url;
            
            if (method === 'GET' && data) {
                const params = new URLSearchParams(data);
                requestUrl += '?' + params.toString();
            } else if (data) {
                if (currentToken) {
                    data.token = currentToken;
                }
                options.body = JSON.stringify(data);
            } else if (currentToken && method !== 'GET') {
                options.body = JSON.stringify({ token: currentToken });
            }
            
            try {
                const response = await fetch(requestUrl, options);
                const result = await response.json();
                return result;
            } catch (error) {
                console.error('API请求错误:', error);
                return { code: -1, message: '网络错误', data: null };
            }
        }

        // 登录
        async function handleLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            
            errorEl.style.display = 'none';
            
            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                errorEl.style.display = 'block';
                return;
            }
            
            const result = await apiRequest('/renlei/login', 'POST', { username, password });
            
            if (result.code === 0) {
                currentUser = result.data.user;
                currentToken = result.data.token;
                localStorage.setItem('renlei_user', JSON.stringify(currentUser));
                localStorage.setItem('renlei_token', currentToken);
                showPage('home-page');
            } else {
                errorEl.textContent = result.message || '登录失败';
                errorEl.style.display = 'block';
            }
        }

        // 注册
        async function handleRegister() {
            const username = document.getElementById('register-username').value;
            const nickname = document.getElementById('register-nickname').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                errorEl.style.display = 'block';
                return;
            }
            
            if (password !== confirmPassword) {
                errorEl.textContent = '两次输入的密码不一致';
                errorEl.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorEl.textContent = '密码长度至少6位';
                errorEl.style.display = 'block';
                return;
            }
            
            const result = await apiRequest('/renlei/register', 'POST', { 
                username, password, email, nickname 
            });
            
            if (result.code === 0) {
                successEl.textContent = '注册成功！正在跳转登录页...';
                successEl.style.display = 'block';
                setTimeout(() => showPage('login-page'), 1500);
            } else {
                errorEl.textContent = result.message || '注册失败';
                errorEl.style.display = 'block';
            }
        }

        // 退出登录
        function handleLogout() {
            currentUser = null;
            currentToken = '';
            localStorage.removeItem('renlei_user');
            localStorage.removeItem('renlei_token');
            showPage('login-page');
        }

        // 加载首页数据
        async function loadHomeData() {
            if (!currentUser) return;
            
            document.getElementById('home-username').textContent = currentUser.nickname || currentUser.username;
            
            // 加载角色和关卡
            const [charResult, levelResult, progressResult] = await Promise.all([
                apiRequest('/renlei/getcharacters', 'GET', { token: currentToken }),
                apiRequest('/renlei/getlevels', 'GET', { token: currentToken }),
                apiRequest('/renlei/getmyprogress', 'GET', { token: currentToken })
            ]);
            
            if (charResult.code === 0) characters = charResult.data;
            if (levelResult.code === 0) levels = levelResult.data;
            if (progressResult.code === 0) progress = progressResult.data;
            
            renderProgress();
        }

        // 渲染进度
        function renderProgress() {
            const grid = document.getElementById('progress-grid');
            grid.innerHTML = '';
            
            levels.forEach(level => {
                const p = progress.find(p => p.level_id === level.id);
                let status = 'locked';
                let statusText = '未开始';
                
                if (p?.is_completed) {
                    status = 'completed';
                    statusText = '✓ 已通关';
                } else if (p?.attempts > 0) {
                    status = 'attempted';
                    statusText = `尝试 ${p.attempts} 次`;
                }
                
                const item = document.createElement('div');
                item.className = 'progress-item';
                item.innerHTML = `
                    <div class="level-name">${level.name}</div>
                    <div class="level-status ${status}">${statusText}</div>
                `;
                grid.appendChild(item);
            });
        }

        // 加载角色
        async function loadCharacters() {
            const result = await apiRequest('/renlei/getcharacters', 'GET', { token: currentToken });
            if (result.code !== 0) return;
            
            characters = result.data;
            selectedCharacterId = currentUser?.current_character_id || 1;
            
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';
            
            characters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'character-card' + (char.id === selectedCharacterId ? ' selected' : '');
                card.onclick = () => selectCharacter(char.id);
                card.innerHTML = `
                    <div class="character-preview" style="background-color: ${char.color}20;">
                        <div class="doll">
                            <div class="head" style="background-color: ${char.head_color};"></div>
                            <div class="body" style="background-color: ${char.body_color};"></div>
                            <div class="arms">
                                <div class="arm left" style="background-color: ${char.body_color};"></div>
                                <div class="arm right" style="background-color: ${char.body_color};"></div>
                            </div>
                            <div class="legs">
                                <div class="leg left" style="background-color: ${char.body_color};"></div>
                                <div class="leg right" style="background-color: ${char.body_color};"></div>
                            </div>
                        </div>
                    </div>
                    <div class="character-info">
                        <h3>${char.name}</h3>
                        <p>${char.description}</p>
                    </div>
                    ${char.id === selectedCharacterId ? '<div class="selected-badge">✓ 已选择</div>' : ''}
                `;
                grid.appendChild(card);
            });
        }

        // 选择角色
        async function selectCharacter(characterId) {
            const result = await apiRequest('/renlei/setcharacter', 'POST', { character_id: characterId });
            if (result.code === 0) {
                selectedCharacterId = characterId;
                currentUser.current_character_id = characterId;
                localStorage.setItem('renlei_user', JSON.stringify(currentUser));
                loadCharacters();
            }
        }

        // 加载关卡
        async function loadLevels() {
            const [levelResult, progressResult] = await Promise.all([
                apiRequest('/renlei/getlevels', 'GET', { token: currentToken }),
                apiRequest('/renlei/getmyprogress', 'GET', { token: currentToken })
            ]);
            
            if (levelResult.code !== 0) return;
            
            levels = levelResult.data;
            if (progressResult.code === 0) progress = progressResult.data;
            
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            
            const icons = {
                balloon: '🎈',
                bridge: '🌉',
                trampoline: '🤸',
                tightrope: '🎪'
            };
            
            levels.forEach((level, index) => {
                const p = progress.find(p => p.level_id === level.id);
                const isCompleted = p?.is_completed;
                const isLocked = index > 0 && !progress.find(p => p.level_id === levels[index - 1].id)?.is_completed;
                
                const card = document.createElement('div');
                card.className = 'level-card' + (isCompleted ? ' completed' : '') + (isLocked ? ' locked' : '');
                if (!isLocked) {
                    card.onclick = () => startGame(level.id);
                }
                
                card.innerHTML = `
                    <div class="level-number">${index + 1}</div>
                    <div class="level-preview theme-${level.level_type}">
                        <span class="level-icon">${icons[level.level_type] || '🎮'}</span>
                    </div>
                    <div class="level-info">
                        <h3>${level.name}</h3>
                        <p class="description">${level.description}</p>
                        <div class="level-meta">
                            <span class="difficulty">难度: ${'⭐'.repeat(level.difficulty)}</span>
                            ${isCompleted ? '<span class="completed-badge">✓</span>' : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 开始游戏
        async function startGame(levelId = null) {
            if (!currentUser) return;
            
            const targetLevelId = levelId || currentUser?.current_level_id || 1;
            currentLevel = levels.find(l => l.id === targetLevelId) || levels[0];
            currentCharacter = characters.find(c => c.id === currentUser?.current_character_id) || characters[0];
            
            if (!currentLevel || !currentCharacter) {
                await loadHomeData();
                currentLevel = levels.find(l => l.id === targetLevelId) || levels[0];
                currentCharacter = characters.find(c => c.id === currentUser?.current_character_id) || characters[0];
            }
            
            // 增加尝试次数
            await apiRequest('/renlei/incrementattempts', 'POST', { level_id: currentLevel.id });
            
            // 创建游戏会话
            const sessionResult = await apiRequest('/renlei/createsession', 'POST', { 
                level_id: currentLevel.id, 
                character_id: currentCharacter.id 
            });
            
            if (sessionResult.code === 0 && sessionResult.data) {
                sessionToken = sessionResult.data.session_token;
                localStorage.setItem('renlei_session_token', sessionToken);
            }
            
            elapsedTime = 0;
            const gameState = {
                level_id: currentLevel.id,
                character_id: currentCharacter.id,
                elapsed_time: 0,
                game_start_time: Date.now()
            };
            localStorage.setItem('renlei_game_state', JSON.stringify(gameState));
            
            showPage('game-page');
            initGame();
        }

        // 恢复游戏状态
        async function restoreGameState() {
            const savedState = localStorage.getItem('renlei_game_state');
            if (!savedState) return false;
            
            try {
                const gameState = JSON.parse(savedState);
                if (!gameState.level_id) return false;
                
                await loadHomeData();
                
                currentLevel = levels.find(l => l.id === gameState.level_id);
                currentCharacter = characters.find(c => c.id === (gameState.character_id || currentUser?.current_character_id));
                
                if (!currentLevel || !currentCharacter) return false;
                
                sessionToken = localStorage.getItem('renlei_session_token') || '';
                
                showPage('game-page');
                initGame();
                
                if (gameState.game_start_time) {
                    const timePassed = (Date.now() - gameState.game_start_time) / 1000;
                    elapsedTime = Math.max(gameState.elapsed_time || 0, timePassed);
                } else {
                    elapsedTime = gameState.elapsed_time || 0;
                }
                
                return true;
            } catch (e) {
                console.error('恢复游戏状态失败:', e);
                return false;
            }
        }

        // 保存游戏进度
        function saveGameProgress() {
            const savedState = localStorage.getItem('renlei_game_state');
            let game_start_time = Date.now();
            
            if (savedState) {
                try {
                    const oldState = JSON.parse(savedState);
                    if (oldState.game_start_time) {
                        game_start_time = oldState.game_start_time;
                    }
                } catch (e) {}
            }
            
            const gameState = {
                level_id: currentLevel?.id,
                character_id: currentCharacter?.id,
                elapsed_time: elapsedTime,
                game_start_time: game_start_time
            };
            localStorage.setItem('renlei_game_state', JSON.stringify(gameState));
        }

        // 清除游戏状态
        function clearGameState() {
            localStorage.removeItem('renlei_game_state');
            localStorage.removeItem('renlei_session_token');
            sessionToken = null;
        }

        // 初始化游戏
        function initGame() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            
            document.getElementById('game-level-name').textContent = currentLevel.name;
            document.getElementById('victory-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            
            // 清理旧的物理引擎
            if (engine) {
                Matter.Engine.clear(engine);
                if (render) Matter.Render.stop(render);
                if (runner) Matter.Runner.stop(runner);
            }
            
            // 创建物理引擎
            engine = Matter.Engine.create({
                gravity: { x: 0, y: 1 }
            });
            
            const Bodies = Matter.Bodies;
            const Composite = Matter.Composite;
            const Constraint = Matter.Constraint;
            const Events = Matter.Events;
            
            // 创建地面
            const ground = Bodies.rectangle(600, 580, 1200, 40, {
                isStatic: true,
                render: { fillStyle: '#8B4513' }
            });
            
            const leftWall = Bodies.rectangle(0, 300, 40, 600, {
                isStatic: true,
                render: { fillStyle: 'transparent' }
            });
            
            const rightWall = Bodies.rectangle(1200, 300, 40, 600, {
                isStatic: true,
                render: { fillStyle: 'transparent' }
            });
            
            // 创建玩家
            player = createPlayer(
                currentLevel?.start_position?.x || 100,
                currentLevel?.start_position?.y || 400
            );
            
            // 创建终点
            const goal = Bodies.rectangle(
                currentLevel?.end_position?.x || 1100,
                currentLevel?.end_position?.y || 400,
                60, 80,
                {
                    isStatic: true,
                    isSensor: true,
                    render: { fillStyle: '#FFD700' },
                    label: 'goal'
                }
            );
            
            // 添加到世界
            Composite.add(engine.world, [ground, leftWall, rightWall, goal, ...player.bodies]);
            player.constraints.forEach(c => Composite.add(engine.world, c));
            
            // 创建关卡障碍物
            createLevelObstacles(currentLevel, Composite, Bodies);
            
            // 碰撞检测
            Events.on(engine, 'collisionStart', (event) => {
                event.pairs.forEach((pair) => {
                    if (pair.bodyA.label === 'goal' || pair.bodyB.label === 'goal') {
                        const playerBody = pair.bodyA.label === 'goal' ? pair.bodyB : pair.bodyA;
                        if (playerBody.label && playerBody.label.startsWith('player_')) {
                            handleVictory();
                        }
                    }
                });
            });
            
            // 运行物理引擎
            runner = Matter.Runner.create();
            Matter.Runner.run(runner, engine);
            
            // 自定义渲染
            const customRender = () => {
                drawBackground(ctx, currentLevel?.level_type);
                drawObstacles(ctx);
                drawPlayer(ctx, player, currentCharacter);
                drawGoal(ctx, currentLevel?.end_position);
                if (isPlaying) {
                    requestAnimationFrame(customRender);
                }
            };
            
            isPlaying = true;
            customRender();
            startTimer();
            
            // 键盘事件
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
        }

        // 创建玩家
        function createPlayer(x, y) {
            const Bodies = Matter.Bodies;
            const Constraint = Matter.Constraint;
            
            const head = Bodies.circle(x, y - 50, 20, {
                label: 'player_head',
                restitution: 0.5,
                friction: 0.1,
                render: { fillStyle: 'transparent' }
            });
            
            const body = Bodies.rectangle(x, y, 30, 45, {
                label: 'player_body',
                restitution: 0.3,
                friction: 0.1,
                render: { fillStyle: 'transparent' }
            });
            
            const leftArm = Bodies.rectangle(x - 25, y - 5, 10, 35, {
                label: 'player_leftArm',
                restitution: 0.3,
                friction: 0.5,
                render: { fillStyle: 'transparent' }
            });
            
            const rightArm = Bodies.rectangle(x + 25, y - 5, 10, 35, {
                label: 'player_rightArm',
                restitution: 0.3,
                friction: 0.5,
                render: { fillStyle: 'transparent' }
            });
            
            const leftLeg = Bodies.rectangle(x - 10, y + 35, 10, 30, {
                label: 'player_leftLeg',
                restitution: 0.3,
                friction: 0.3,
                render: { fillStyle: 'transparent' }
            });
            
            const rightLeg = Bodies.rectangle(x + 10, y + 35, 10, 30, {
                label: 'player_rightLeg',
                restitution: 0.3,
                friction: 0.3,
                render: { fillStyle: 'transparent' }
            });
            
            const headBody = Constraint.create({
                bodyA: head,
                bodyB: body,
                pointA: { x: 0, y: 20 },
                pointB: { x: 0, y: -20 },
                stiffness: 0.4,
                length: 5
            });
            
            const leftArmBody = Constraint.create({
                bodyA: body,
                bodyB: leftArm,
                pointA: { x: -15, y: -15 },
                pointB: { x: 0, y: -15 },
                stiffness: 0.3,
                length: 5
            });
            
            const rightArmBody = Constraint.create({
                bodyA: body,
                bodyB: rightArm,
                pointA: { x: 15, y: -15 },
                pointB: { x: 0, y: -15 },
                stiffness: 0.3,
                length: 5
            });
            
            const leftLegBody = Constraint.create({
                bodyA: body,
                bodyB: leftLeg,
                pointA: { x: -10, y: 20 },
                pointB: { x: 0, y: -15 },
                stiffness: 0.3,
                length: 5
            });
            
            const rightLegBody = Constraint.create({
                bodyA: body,
                bodyB: rightLeg,
                pointA: { x: 10, y: 20 },
                pointB: { x: 0, y: -15 },
                stiffness: 0.3,
                length: 5
            });
            
            return {
                bodies: [head, body, leftArm, rightArm, leftLeg, rightLeg],
                constraints: [headBody, leftArmBody, rightArmBody, leftLegBody, rightLegBody],
                head, body, leftArm, rightArm, leftLeg, rightLeg
            };
        }

        // 创建关卡障碍物
        function createLevelObstacles(level, Composite, Bodies) {
            obstacles = [];
            if (!level?.obstacles) return;
            
            level.obstacles.forEach(obs => {
                let obstacle = null;
                
                switch (obs.type) {
                    case 'balloon':
                        obstacle = Bodies.circle(obs.x, obs.y, obs.radius, {
                            isStatic: true,
                            restitution: 1.5,
                            render: { fillStyle: '#FF6B6B' },
                            label: 'balloon',
                            obstacleData: obs
                        });
                        break;
                    case 'bridge':
                        obstacle = Bodies.rectangle(obs.x, obs.y, obs.width, obs.height, {
                            isStatic: false,
                            restitution: 0.2,
                            render: { fillStyle: '#8B4513' },
                            label: 'bridge',
                            obstacleData: obs
                        });
                        break;
                    case 'trampoline':
                        obstacle = Bodies.rectangle(obs.x, obs.y, obs.width, obs.height, {
                            isStatic: true,
                            restitution: 2,
                            render: { fillStyle: '#FF69B4' },
                            label: 'trampoline',
                            obstacleData: obs
                        });
                        break;
                    case 'rope':
                        obstacle = Bodies.rectangle(obs.x, obs.y, obs.width, obs.height, {
                            isStatic: true,
                            friction: 0.1,
                            render: { fillStyle: '#333' },
                            label: 'rope',
                            obstacleData: obs
                        });
                        break;
                }
                
                if (obstacle) {
                    Composite.add(engine.world, obstacle);
                    obstacles.push(obstacle);
                }
            });
        }

        // 绘制背景
        function drawBackground(ctx, levelType) {
            const gradients = {
                balloon: ['#ff9a9e', '#fecfef'],
                bridge: ['#a8edea', '#fed6e3'],
                trampoline: ['#ffecd2', '#fcb69f'],
                tightrope: ['#667eea', '#764ba2']
            };
            
            const colors = gradients[levelType] || ['#87CEEB', '#98D8C8'];
            const gradient = ctx.createLinearGradient(0, 0, 0, 600);
            gradient.addColorStop(0, colors[0]);
            gradient.addColorStop(1, colors[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1200, 600);
            
            // 绘制地面
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 560, 1200, 40);
        }

        // 绘制障碍物
        function drawObstacles(ctx) {
            obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.position.x, obs.position.y);
                ctx.rotate(obs.angle);
                
                if (obs.label === 'balloon') {
                    const radius = obs.circleRadius;
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FF4444';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#FFB6C1';
                    ctx.beginPath();
                    ctx.arc(-radius * 0.3, -radius * 0.3, radius * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-3, radius, 6, 15);
                } else if (obs.label === 'bridge') {
                    const width = Math.abs(obs.vertices[1].x - obs.vertices[0].x);
                    const height = Math.abs(obs.vertices[2].y - obs.vertices[1].y);
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(-width / 2, -height / 2, width, height);
                    ctx.strokeStyle = '#5D3A1A';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-width / 2, -height / 2, width, height);
                    for (let i = -width / 2 + 10; i < width / 2; i += 15) {
                        ctx.beginPath();
                        ctx.moveTo(i, -height / 2);
                        ctx.lineTo(i, height / 2);
                        ctx.stroke();
                    }
                } else if (obs.label === 'trampoline') {
                    const width = Math.abs(obs.vertices[1].x - obs.vertices[0].x);
                    const height = Math.abs(obs.vertices[2].y - obs.vertices[1].y);
                    ctx.fillStyle = '#FF69B4';
                    ctx.fillRect(-width / 2, -height / 2, width, height);
                    ctx.strokeStyle = '#FF1493';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-width / 2, -height / 2, width, height);
                    ctx.fillStyle = '#FFB6C1';
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('↑', 0, 5);
                } else if (obs.label === 'rope') {
                    const width = Math.abs(obs.vertices[1].x - obs.vertices[0].x);
                    const height = Math.abs(obs.vertices[2].y - obs.vertices[1].y);
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = Math.max(height, 3);
                    ctx.beginPath();
                    ctx.moveTo(-width / 2, 0);
                    ctx.lineTo(width / 2, 0);
                    ctx.stroke();
                }
                
                ctx.restore();
            });
        }

        // 绘制玩家
        function drawPlayer(ctx, player, character) {
            const color = character?.body_color || '#FFB6C1';
            const headColor = character?.head_color || '#FFE4E1';
            
            const drawPart = (body, fillColor, isCircle = false) => {
                ctx.save();
                ctx.translate(body.position.x, body.position.y);
                ctx.rotate(body.angle);
                ctx.fillStyle = fillColor;
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 2;
                
                if (isCircle) {
                    ctx.beginPath();
                    ctx.arc(0, 0, body.circleRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    const width = Math.abs(body.vertices[1].x - body.vertices[0].x);
                    const height = Math.abs(body.vertices[2].y - body.vertices[1].y);
                    ctx.fillRect(-width / 2, -height / 2, width, height);
                    ctx.strokeRect(-width / 2, -height / 2, width, height);
                }
                ctx.restore();
            };
            
            drawPart(player.leftLeg, color);
            drawPart(player.rightLeg, color);
            drawPart(player.body, color);
            drawPart(player.leftArm, color);
            drawPart(player.rightArm, color);
            drawPart(player.head, headColor, true);
            
            // 绘制眼睛
            ctx.save();
            ctx.translate(player.head.position.x, player.head.position.y);
            ctx.rotate(player.head.angle);
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-6, -3, 3, 0, Math.PI * 2);
            ctx.arc(6, -3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // 绘制终点
        function drawGoal(ctx, position) {
            if (!position) return;
            ctx.save();
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(position.x - 30, position.y - 40, 60, 80);
            ctx.fillStyle = '#FF4500';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🏁', position.x, position.y + 8);
            ctx.restore();
        }

        // 键盘按下
        function handleKeyDown(e) {
            keys[e.key] = true;
            
            if (!player) return;
            
            const Body = Matter.Body;
            
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                const force = e.key === 'ArrowLeft' ? -0.05 : 0.05;
                Body.applyForce(player.body, player.body.position, { x: force, y: 0 });
            }
            
            if (e.key === 'ArrowUp') {
                Body.applyForce(player.body, player.body.position, { x: 0, y: -0.15 });
            }
            
            if (e.key === 'ArrowDown') {
                Body.applyForce(player.body, player.body.position, { x: 0, y: 0.05 });
            }
            
            if (e.key === 'r' || e.key === 'R') {
                resetLevel();
            }
        }

        // 键盘抬起
        function handleKeyUp(e) {
            keys[e.key] = false;
        }

        // 开始计时
        function startTimer() {
            if (gameLoop) clearInterval(gameLoop);
            
            gameLoop = setInterval(() => {
                elapsedTime += 0.1;
                updateTimerDisplay();
                
                if (Math.floor(elapsedTime) % 5 === 0) {
                    saveGameProgress();
                }
                
                if (player && player.body.position.y > 650) {
                    handleGameOver();
                }
            }, 100);
        }

        // 更新计时器显示
        function updateTimerDisplay() {
            const mins = Math.floor(elapsedTime / 60);
            const secs = Math.floor(elapsedTime % 60);
            document.getElementById('game-timer').textContent = 
                `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 胜利
        async function handleVictory() {
            if (!isPlaying) return;
            
            isPlaying = false;
            clearInterval(gameLoop);
            clearGameState();
            
            document.getElementById('victory-time').textContent = 
                `用时: ${document.getElementById('game-timer').textContent.replace('⏱️ ', '')}`;
            
            const currentIndex = levels.findIndex(l => l.id === currentLevel.id);
            document.getElementById('next-level-btn').style.display = 
                currentIndex < levels.length - 1 ? 'inline-block' : 'none';
            
            document.getElementById('victory-modal').classList.remove('hidden');
            
            await apiRequest('/renlei/completelevel', 'POST', {
                level_id: currentLevel.id,
                completion_time: elapsedTime
            });
            
            if (sessionToken) {
                await apiRequest('/renlei/endsession', 'POST', {
                    session_token: sessionToken
                });
            }
        }

        // 失败
        function handleGameOver() {
            if (!isPlaying) return;
            
            isPlaying = false;
            clearInterval(gameLoop);
            clearGameState();
            document.getElementById('gameover-modal').classList.remove('hidden');
        }

        // 重置关卡
        function resetLevel() {
            document.getElementById('victory-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            elapsedTime = 0;
            const gameState = {
                level_id: currentLevel?.id,
                character_id: currentCharacter?.id,
                elapsed_time: 0,
                game_start_time: Date.now()
            };
            localStorage.setItem('renlei_game_state', JSON.stringify(gameState));
            initGame();
        }

        // 重玩
        function replayLevel() {
            document.getElementById('victory-modal').classList.add('hidden');
            elapsedTime = 0;
            const gameState = {
                level_id: currentLevel?.id,
                character_id: currentCharacter?.id,
                elapsed_time: 0,
                game_start_time: Date.now()
            };
            localStorage.setItem('renlei_game_state', JSON.stringify(gameState));
            initGame();
        }

        // 下一关
        function nextLevel() {
            const currentIndex = levels.findIndex(l => l.id === currentLevel.id);
            if (currentIndex < levels.length - 1) {
                document.getElementById('victory-modal').classList.add('hidden');
                startGame(levels[currentIndex + 1].id);
            }
        }

        // 退出游戏
        function exitGame() {
            isPlaying = false;
            if (gameLoop) clearInterval(gameLoop);
            
            if (engine) {
                Matter.Engine.clear(engine);
                if (render) Matter.Render.stop(render);
                if (runner) Matter.Runner.stop(runner);
            }
            
            window.removeEventListener('keydown', handleKeyDown);
            window.removeEventListener('keyup', handleKeyUp);
            
            document.getElementById('victory-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            
            clearGameState();
            showPage('home-page');
        }

        // 页面加载时检查登录状态
        window.onload = async function() {
            if (currentUser && currentToken) {
                const restored = await restoreGameState();
                if (restored) {
                    return;
                }
                showPage('home-page');
            } else {
                showPage('login-page');
            }
        };
    </script>
</body>
</html>
