<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影推荐 · 电影小站</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header v-if="isLoggedIn" class="app-header">
            <div class="header-content">
                <h1 class="logo" @click="goHome">🎬 光影推荐</h1>
                <nav class="nav-menu">
                    <router-link to="/" class="nav-link" exact-active-class="active">首页</router-link>
                    <router-link to="/favorites" class="nav-link" active-class="active">想看列表</router-link>
                    <router-link to="/recommend" class="nav-link" active-class="active">我的推荐</router-link>
                    <router-link v-if="isAdmin" to="/admin" class="nav-link" active-class="active">管理后台</router-link>
                </nav>
                <div class="user-info">
                    <span class="username">{{ currentUser?.username }}</span>
                    <button class="btn btn-outline" @click="showChangePassword = true">修改密码</button>
                    <button class="btn btn-danger" @click="logout">退出</button>
                </div>
            </div>
        </header>
        <main class="app-main">
            <router-view v-slot="{ Component }">
                <transition name="fade" mode="out-in">
                    <component :is="Component" />
                </transition>
            </router-view>
        </main>

        <div v-if="showChangePassword" class="modal-overlay" @click.self="showChangePassword = false">
            <div class="modal">
                <div class="modal-content">
                    <h3 style="margin-bottom: 20px;">修改密码</h3>
                    <form @submit.prevent="changePassword">
                        <div class="form-group">
                            <label>原密码</label>
                            <input type="password" v-model="passwordForm.old_password" required>
                        </div>
                        <div class="form-group">
                            <label>新密码</label>
                            <input type="password" v-model="passwordForm.new_password" required>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" @click="showChangePassword = false">取消</button>
                            <button type="submit" class="btn btn-primary">确认修改</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div v-if="toast.show" class="toast" :class="toast.type">
            {{ toast.message }}
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/utils/utils.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/services/auth.js"></script>
    <script src="js/pages/login.js"></script>
    <script src="js/pages/register.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/movieDetail.js"></script>
    <script src="js/pages/favorites.js"></script>
    <script src="js/pages/recommend.js"></script>
    <script src="js/pages/admin/dashboard.js"></script>
    <script src="js/pages/admin/movieManage.js"></script>
    <script src="js/utils/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
