<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自行车越野赛</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="hud" class="hud hidden">
            <div class="hud-left">
                <div class="hud-item">
                    <span class="hud-label">时间</span>
                    <span id="time-display" class="hud-value">00:00</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">分数</span>
                    <span id="score-display" class="hud-value">0</span>
                </div>
            </div>
            <div class="hud-right">
                <div class="hud-item">
                    <span class="hud-label">速度</span>
                    <span id="speed-display" class="hud-value">0 km/h</span>
                </div>
                <button id="pause-btn" class="pause-btn">⏸</button>
            </div>
            <div class="hud-bottom">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <div id="start-menu" class="menu">
            <div class="menu-content">
                <h1 class="game-title">🚲 城市越野赛</h1>
                <p class="game-subtitle">在城市街道中展现你的特技！</p>
                <div class="menu-buttons">
                    <button id="start-btn" class="menu-btn primary">开始游戏</button>
                    <button id="continue-btn" class="menu-btn secondary hidden">继续游戏</button>
                </div>
                <div class="controls-info">
                    <h3>操作说明</h3>
                    <div class="control-row">
                        <span class="control-key">↑ / W</span>
                        <span class="control-desc">加速</span>
                    </div>
                    <div class="control-row">
                        <span class="control-key">↓ / S</span>
                        <span class="control-desc">减速/刹车</span>
                    </div>
                    <div class="control-row">
                        <span class="control-key">← / A</span>
                        <span class="control-desc">抬起前轮</span>
                    </div>
                    <div class="control-row">
                        <span class="control-key">→ / D</span>
                        <span class="control-desc">压下前轮</span>
                    </div>
                    <div class="control-row">
                        <span class="control-key">空格 / J</span>
                        <span class="control-desc">特技</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="pause-menu" class="menu hidden">
            <div class="menu-content">
                <h2>游戏暂停</h2>
                <div class="menu-buttons">
                    <button id="resume-btn" class="menu-btn primary">继续游戏</button>
                    <button id="restart-btn" class="menu-btn secondary">重新开始</button>
                    <button id="quit-btn" class="menu-btn secondary">退出游戏</button>
                </div>
            </div>
        </div>

        <div id="game-over-menu" class="menu hidden">
            <div class="menu-content">
                <h2 id="game-over-title">游戏结束</h2>
                <div class="game-stats">
                    <div class="stat-row">
                        <span class="stat-label">最终得分</span>
                        <span id="final-score" class="stat-value">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">用时</span>
                        <span id="final-time" class="stat-value">00:00</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">完成特技</span>
                        <span id="tricks-count" class="stat-value">0</span>
                    </div>
                </div>
                <div class="menu-buttons">
                    <button id="retry-btn" class="menu-btn primary">再来一次</button>
                    <button id="menu-btn" class="menu-btn secondary">返回主菜单</button>
                </div>
            </div>
        </div>

        <div id="mobile-controls" class="mobile-controls hidden">
            <div class="control-left">
                <div class="touch-area" id="touch-balance"></div>
            </div>
            <div class="control-right">
                <button class="touch-btn" id="touch-accel">▲</button>
                <button class="touch-btn" id="touch-brake">▼</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
