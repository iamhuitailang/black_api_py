<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化仪表盘 - 科幻版</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="theme-dark">
    <div id="loader" class="loader">
        <div class="loader-content">
            <div class="loader-ring"></div>
            <div class="loader-text">初始化仪表盘...</div>
        </div>
    </div>

    <div id="app" class="app-container hidden">
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                        <path d="M20 8v12l8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span class="logo-text">DATA MATRIX</span>
                </div>
            </div>
            <div class="header-right">
                <div class="date-filter" id="dateFilter">
                    <button class="date-btn active" data-range="today">今日</button>
                    <button class="date-btn" data-range="week">本周</button>
                    <button class="date-btn" data-range="month">本月</button>
                    <button class="date-btn" data-range="custom">自定义</button>
                </div>
                <div class="header-actions">
                    <button class="action-btn" id="importBtn" title="导入数据">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="themeToggle" title="切换主题">
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="exportBtn" title="导出数据">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="saveLayoutBtn" title="保存布局">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="kpi-section" id="kpiSection">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon">📈</span>
                        KPI 关键指标
                    </h2>
                    <div class="data-source-selector">
                        <label>数据源:</label>
                        <select id="dataSourceSelect">
                            <option value="default">默认数据</option>
                            <option value="sales">销售数据</option>
                            <option value="user">用户数据</option>
                        </select>
                    </div>
                </div>
                <div class="kpi-grid" id="kpiGrid"></div>
            </section>

            <section class="charts-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon">📊</span>
                        图表分析
                    </h2>
                </div>
                <div class="charts-grid">
                    <div class="chart-card" id="lineChartCard">
                        <div class="chart-header">
                            <h3 class="chart-title">销售趋势</h3>
                            <div class="chart-actions">
                                <button class="chart-action-btn" data-action="drill" title="数据钻取">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="3"/>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                                    </svg>
                                </button>
                                <button class="chart-action-btn" data-action="export" title="导出图表">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="chart-body">
                            <canvas id="lineChart" class="chart-canvas"></canvas>
                            <div class="chart-tooltip" id="lineChartTooltip"></div>
                        </div>
                    </div>

                    <div class="chart-card" id="barChartCard">
                        <div class="chart-header">
                            <h3 class="chart-title">渠道对比</h3>
                            <div class="chart-actions">
                                <button class="chart-action-btn" data-action="drill" title="数据钻取">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="3"/>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                                    </svg>
                                </button>
                                <button class="chart-action-btn" data-action="export" title="导出图表">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="chart-body">
                            <canvas id="barChart" class="chart-canvas"></canvas>
                            <div class="chart-tooltip" id="barChartTooltip"></div>
                        </div>
                    </div>

                    <div class="chart-card" id="pieChartCard">
                        <div class="chart-header">
                            <h3 class="chart-title">分类占比</h3>
                            <div class="chart-actions">
                                <button class="chart-action-btn" data-action="drill" title="数据钻取">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="3"/>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                                    </svg>
                                </button>
                                <button class="chart-action-btn" data-action="export" title="导出图表">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="chart-body">
                            <canvas id="pieChart" class="chart-canvas"></canvas>
                            <div class="chart-legend" id="pieChartLegend"></div>
                            <div class="chart-tooltip" id="pieChartTooltip"></div>
                        </div>
                    </div>

                    <div class="chart-card" id="areaChartCard">
                        <div class="chart-header">
                            <h3 class="chart-title">用户增长趋势</h3>
                            <div class="chart-actions">
                                <button class="chart-action-btn" data-action="drill" title="数据钻取">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="3"/>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                                    </svg>
                                </button>
                                <button class="chart-action-btn" data-action="export" title="导出图表">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="chart-body">
                            <canvas id="areaChart" class="chart-canvas"></canvas>
                            <div class="chart-tooltip" id="areaChartTooltip"></div>
                        </div>
                    </div>

                    <div class="chart-card chart-card-wide" id="funnelChartCard">
                        <div class="chart-header">
                            <h3 class="chart-title">转化漏斗</h3>
                            <div class="chart-actions">
                                <button class="chart-action-btn" data-action="drill" title="数据钻取">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="3"/>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                                    </svg>
                                </button>
                                <button class="chart-action-btn" data-action="export" title="导出图表">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="chart-body">
                            <canvas id="funnelChart" class="chart-canvas"></canvas>
                            <div class="chart-tooltip" id="funnelChartTooltip"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div class="modal" id="customDateModal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">选择日期范围</h3>
                    <button class="modal-close" id="closeDateModal">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>开始日期</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-group">
                        <label>结束日期</label>
                        <input type="date" id="endDate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelDate">取消</button>
                    <button class="btn btn-primary" id="confirmDate">确认</button>
                </div>
            </div>
        </div>

        <div class="modal" id="drillModal">
            <div class="modal-overlay"></div>
            <div class="modal-content modal-wide">
                <div class="modal-header">
                    <h3 class="modal-title" id="drillModalTitle">数据详情</h3>
                    <button class="modal-close" id="closeDrillModal">×</button>
                </div>
                <div class="modal-body">
                    <div class="drill-content" id="drillContent"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="closeDrill">关闭</button>
                    <button class="btn btn-primary" id="exportDrillCSV">导出 CSV</button>
                </div>
            </div>
        </div>

        <div class="modal" id="exportModal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">导出数据</h3>
                    <button class="modal-close" id="closeExportModal">×</button>
                </div>
                <div class="modal-body">
                    <div class="export-options">
                        <label class="export-option">
                            <input type="radio" name="exportType" value="image" checked>
                            <span class="export-label">
                                <span class="export-icon">🖼️</span>
                                <span class="export-text">导出为图片 (PNG)</span>
                            </span>
                        </label>
                        <label class="export-option">
                            <input type="radio" name="exportType" value="csv">
                            <span class="export-label">
                                <span class="export-icon">📊</span>
                                <span class="export-text">导出为数据 (CSV)</span>
                            </span>
                        </label>
                    </div>
                    <div class="form-group" id="chartSelectGroup">
                        <label>选择图表</label>
                        <select id="exportChartSelect">
                            <option value="all">全部图表</option>
                            <option value="lineChart">销售趋势 (折线图)</option>
                            <option value="barChart">渠道对比 (柱状图)</option>
                            <option value="pieChart">分类占比 (饼图)</option>
                            <option value="areaChart">用户增长 (面积图)</option>
                            <option value="funnelChart">转化漏斗 (漏斗图)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelExport">取消</button>
                    <button class="btn btn-primary" id="confirmExport">导出</button>
                </div>
            </div>
        </div>

        <div class="modal" id="importModal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">导入数据</h3>
                    <button class="modal-close" id="closeImportModal">×</button>
                </div>
                <div class="modal-body">
                    <div class="import-options">
                        <label class="import-option">
                            <input type="radio" name="importType" value="config" checked>
                            <span class="import-label">
                                <span class="import-icon">⚙️</span>
                                <span class="import-text">导入配置布局 (.json)</span>
                            </span>
                        </label>
                        <label class="import-option">
                            <input type="radio" name="importType" value="data">
                            <span class="import-label">
                                <span class="import-icon">📊</span>
                                <span class="import-text">导入自定义数据 (.json)</span>
                            </span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label for="importFileInput">选择文件</label>
                        <input type="file" id="importFileInput" accept=".json">
                    </div>
                    <div class="form-group">
                        <label>或粘贴JSON数据</label>
                        <textarea id="importJsonText" placeholder='{"kpi": [...], "lineChart": {...}}'></textarea>
                    </div>
                    <div class="import-preview" id="importPreview">
                        <div class="preview-empty">选择文件或粘贴JSON数据后预览</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelImport">取消</button>
                    <button class="btn btn-primary" id="confirmImport">导入</button>
                    <button class="btn btn-secondary" id="downloadTemplate">下载模板</button>
                </div>
            </div>
        </div>

        <div class="modal" id="toast">
            <div class="toast-content">
                <span class="toast-icon" id="toastIcon">✓</span>
                <span class="toast-text" id="toastText">操作成功</span>
            </div>
        </div>
    </div>

    <script src="js/utils/storage.js"></script>
    <script src="js/utils/dateUtils.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/core/dataStore.js"></script>
    <script src="js/core/stateManager.js"></script>
    <script src="js/core/themeManager.js"></script>
    <script src="js/core/chartEngine.js"></script>
    <script src="js/components/kpiCard.js"></script>
    <script src="js/components/lineChart.js"></script>
    <script src="js/components/barChart.js"></script>
    <script src="js/components/pieChart.js"></script>
    <script src="js/components/areaChart.js"></script>
    <script src="js/components/funnelChart.js"></script>
    <script src="js/components/dateFilter.js"></script>
    <script src="js/services/exportService.js"></script>
    <script src="js/services/importService.js"></script>
    <script src="js/services/drillService.js"></script>
    <script src="js/services/layoutService.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
