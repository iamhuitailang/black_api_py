<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>街头热血篮球</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-layer">
            <div id="game-hud" class="hidden">
                <div class="hud-left">
                    <div class="score-display">
                        <span class="label">得分</span>
                        <span id="score" class="value">0</span>
                    </div>
                    <div class="combo-display">
                        <span class="label">连击</span>
                        <span id="combo" class="value">0</span>
                    </div>
                </div>
                <div class="hud-center">
                    <div class="time-display">
                        <span class="label">时间</span>
                        <span id="time" class="value">60</span>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="energy-bar">
                        <span class="label">技能能量</span>
                        <div class="energy-container">
                            <div id="energy-fill" class="energy-fill" style="width: 0%"></div>
                        </div>
                        <span class="hint">空格释放</span>
                    </div>
                </div>
            </div>
            
            <div id="game-controls" class="hidden">
                <button id="pause-btn" class="control-btn">暂停</button>
                <button id="restart-btn" class="control-btn">重新开始</button>
            </div>
            
            <div id="start-screen" class="screen">
                <div class="screen-content">
                    <h1 class="game-title">街头热血篮球</h1>
                    <p class="game-subtitle">60秒挑战模式</p>
                    <div class="instructions">
                        <p>• 鼠标拖动瞄准，向后拉蓄力，向前推投篮</p>
                        <p>• 连续命中获得额外加分</p>
                        <p>• 空心入网 +0.5秒，额外+10分</p>
                        <p>• 空格键释放必中技能（需攒满能量）</p>
                    </div>
                    <button id="start-btn" class="main-btn">开始游戏</button>
                </div>
            </div>
            
            <div id="pause-screen" class="screen hidden">
                <div class="screen-content">
                    <h2 class="screen-title">游戏暂停</h2>
                    <button id="resume-btn" class="main-btn">继续游戏</button>
                    <button id="quit-btn" class="secondary-btn">退出游戏</button>
                </div>
            </div>
            
            <div id="gameover-screen" class="screen hidden">
                <div class="screen-content">
                    <h2 class="screen-title">游戏结束</h2>
                    <div class="final-stats">
                        <p>最终得分: <span id="final-score">0</span></p>
                        <p>最高连击: <span id="final-combo">0</span></p>
                    </div>
                    <button id="playagain-btn" class="main-btn">再来一局</button>
                    <button id="back-btn" class="secondary-btn">返回主页</button>
                </div>
            </div>
            
            <div id="effects-layer">
                <div id="power-bar" class="hidden">
                    <span class="label">蓄力</span>
                    <div class="power-container">
                        <div id="power-fill" class="power-fill" style="width: 0%"></div>
                        <div class="power-zones">
                            <div class="zone green-zone"></div>
                        </div>
                    </div>
                </div>
                
                <div id="angle-indicator" class="hidden">
                    <span class="label">角度</span>
                    <span id="angle-value" class="value">45°</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/constants.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/gameObjects.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
