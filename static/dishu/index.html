<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈哈打地鼠</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">哈哈打地鼠</h1>
        
        <div class="game-info">
            <div class="info-item">
                <span class="info-label">分数:</span>
                <span id="score" class="info-value">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">时间:</span>
                <span id="time" class="info-value">30</span>
            </div>
            <div class="info-item">
                <span class="info-label">最高分:</span>
                <span id="highscore" class="info-value">0</span>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
        
        <div class="game-controls">
            <button id="startBtn" class="control-btn start-btn">开始游戏</button>
            <button id="pauseBtn" class="control-btn pause-btn" disabled>暂停</button>
            <button id="restartBtn" class="control-btn restart-btn" disabled>重新开始</button>
        </div>
        
        <div id="gameMessage" class="game-message"></div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
