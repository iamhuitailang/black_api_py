<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>食堂订餐系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="login-page" class="page active">
            <div class="login-container">
                <h1>🍽️ 食堂订餐系统</h1>
                <div class="tab-group">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>

                <form id="login-form" class="tab-content active">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="login-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary">登录</button>
                </form>

                <form id="register-form" class="tab-content">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="reg-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>真实姓名</label>
                        <input type="text" id="reg-realname" placeholder="请输入真实姓名">
                    </div>
                    <div class="form-group">
                        <label>手机号</label>
                        <input type="tel" id="reg-phone" placeholder="请输入手机号">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="reg-password" placeholder="请设置密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary">注册</button>
                </form>
            </div>
        </div>

        <div id="main-page" class="page">
            <header class="header">
                <h1>🍽️ 食堂订餐</h1>
                <button id="user-btn" class="icon-btn">👤</button>
            </header>

            <div class="content">
                <div id="page-menu" class="content-page active">
                    <div class="date-selector">
                        <button id="prev-day" class="day-btn">◀</button>
                        <div class="current-date">
                            <span id="selected-date"></span>
                            <select id="meal-type"></select>
                        </div>
                        <button id="next-day" class="day-btn">▶</button>
                    </div>

                    <div id="menu-list" class="dish-list"></div>

                    <div id="cart-bar" class="cart-bar" style="display: none;">
                        <div class="cart-info">
                            <span class="cart-count">0</span>
                            <span>已选菜品</span>
                        </div>
                        <div class="cart-amount">¥0.00</div>
                        <button id="checkout-btn" class="btn btn-primary">去结算</button>
                    </div>
                </div>

                <div id="page-orders" class="content-page">
                    <div class="order-tabs">
                        <button class="order-tab active" data-status="">全部</button>
                        <button class="order-tab" data-status="pending">待取餐</button>
                        <button class="order-tab" data-status="completed">已完成</button>
                    </div>
                    <div id="order-list" class="order-list"></div>
                </div>

                <div id="page-profile" class="content-page">
                    <div class="profile-card">
                        <div class="avatar">👤</div>
                        <h2 id="profile-name">用户</h2>
                        <p id="profile-username">@username</p>
                    </div>

                    <div class="menu-list">
                        <div class="menu-item" id="my-orders-btn">
                            <span>📋 我的订单</span>
                            <span class="arrow">›</span>
                        </div>
                        <div class="menu-item" id="logout-btn">
                            <span>🚪 退出登录</span>
                            <span class="arrow">›</span>
                        </div>
                    </div>
                </div>
            </div>

            <nav class="bottom-nav">
                <button class="nav-btn active" data-page="menu">
                    <span class="nav-icon">🍽️</span>
                    <span class="nav-label">点餐</span>
                </button>
                <button class="nav-btn" data-page="orders">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">订单</span>
                </button>
                <button class="nav-btn" data-page="profile">
                    <span class="nav-icon">👤</span>
                    <span class="nav-label">我的</span>
                </button>
            </nav>
        </div>

        <div id="checkout-modal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>确认订单</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="checkout-items" class="checkout-items"></div>
                    <div class="checkout-total">
                        <span>合计:</span>
                        <span id="checkout-amount">¥0.00</span>
                    </div>
                    <button id="submit-order-btn" class="btn btn-primary full-width">提交订单</button>
                </div>
            </div>
        </div>

        <div id="qrcode-modal" class="modal-overlay">
            <div class="modal qrcode-modal">
                <div class="modal-header">
                    <h3>取餐码</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="qrcode-display">
                        <div id="qrcode-canvas"></div>
                        <p class="qrcode-text" id="qrcode-text"></p>
                    </div>
                    <p class="qrcode-tip">请向工作人员出示此取餐码</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/menu.js"></script>
    <script src="js/pages/orders.js"></script>
    <script src="js/pages/profile.js"></script>
    <script src="js/qrcode.js"></script>
</body>
</html>
