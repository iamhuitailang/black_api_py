<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body {
            background: #333;
            color: #fff;
            padding: 20px;
        }
        canvas {
            border: 2px solid red;
            background: #5c94fc;
        }
        #log {
            background: #000;
            padding: 10px;
            margin-top: 20px;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Canvas 测试</h1>
    <canvas id="test-canvas" width="800" height="480"></canvas>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            logDiv.innerHTML += msg + '<br>';
            console.log(msg);
        }

        log('页面加载中...');

        try {
            const canvas = document.getElementById('test-canvas');
            log('Canvas 元素: ' + (canvas ? '找到' : '未找到'));
            
            const ctx = canvas.getContext('2d');
            log('Context 2D: ' + (ctx ? '获取成功' : '获取失败'));
            
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(50, 50, 100, 100);
            log('绘制红色方块完成');
            
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(200, 100, 30, 0, Math.PI * 2);
            ctx.fill();
            log('绘制绿色圆形完成');
            
            ctx.fillStyle = '#0000ff';
            ctx.fillRect(80, 350, 32, 32);
            log('绘制蓝色砖块完成');
            
            log('所有测试完成！');
        } catch (e) {
            log('错误: ' + e.message);
            log('堆栈: ' + e.stack);
        }
    </script>
</body>
</html>
