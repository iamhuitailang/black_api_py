<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑雪大冒险</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="800"></canvas>
        
        <div id="start-screen" class="screen">
            <h1>⛷️ 滑雪大冒险</h1>
            <p class="subtitle">从雪山上冲刺，躲避障碍，收集金币！</p>
            <div class="controls-info">
                <p>⬅️ ➡️ 左右移动</p>
                <p>⬆️ / 空格 跳跃</p>
            </div>
            <div class="high-score">
                <span>最高纪录: </span>
                <span id="high-score-display">0</span> 米
            </div>
            <button id="start-btn" class="btn">开始游戏</button>
        </div>
        
        <div id="game-over-screen" class="screen hidden">
            <h1>游戏结束</h1>
            <div class="result">
                <p>本次距离: <span id="final-distance">0</span> 米</p>
                <p>本次得分: <span id="final-score">0</span> 分</p>
                <p>最高纪录: <span id="final-high-score">0</span> 米</p>
            </div>
            <button id="restart-btn" class="btn">再来一次</button>
        </div>
        
        <div id="pause-screen" class="screen hidden">
            <h1>游戏暂停</h1>
            <button id="resume-btn" class="btn">继续游戏</button>
            <button id="quit-btn" class="btn btn-secondary">返回主菜单</button>
        </div>
        
        <div id="hud">
            <div class="hud-item">
                <span class="hud-label">距离</span>
                <span id="distance" class="hud-value">0</span>
                <span class="hud-unit">米</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">得分</span>
                <span id="score" class="hud-value">0</span>
            </div>
            <div class="hud-item health-container">
                <span class="hud-label">生命</span>
                <div id="health-bar">
                    <div id="health-fill"></div>
                </div>
            </div>
            <div id="active-buffs"></div>
            <button id="pause-btn" class="pause-btn">⏸️</button>
        </div>
    </div>
    
    <script src="js/storage.js"></script>
    <script src="js/config.js"></script>
    <script src="js/player.js"></script>
    <script src="js/obstacle.js"></script>
    <script src="js/item.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
