<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="灯光音响工作室 - 调配舞台灯光、调试音响音效，打造完美演艺舞台现场">
  <title>🎛️ 灯光音响工作室</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-dark, #0a0a0f);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-content {
      text-align: center;
    }
    
    .loading-logo {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: float 2s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .loading-title {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00bfff, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a2a3a;
      border-top-color: #00bfff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 0.9rem;
      color: #666680;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="loading-content">
      <div class="loading-logo">🎛️</div>
      <h1 class="loading-title">灯光音响工作室</h1>
      <div class="loading-spinner"></div>
      <p class="loading-text">正在加载...</p>
    </div>
  </div>

  <div id="app"></div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  
  <script src="js/data.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/score.js"></script>
  <script src="js/utils/audio.js"></script>
  <script src="js/utils/light.js"></script>
  
  <script src="js/components/SceneSelector.js"></script>
  <script src="js/components/EquipmentPanel.js"></script>
  <script src="js/components/StageView.js"></script>
  <script src="js/components/ControlPanel.js"></script>
  <script src="js/components/RehearsalPanel.js"></script>
  
  <script src="js/app.js"></script>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.classList.add('hidden');
          setTimeout(() => loading.remove(), 500);
        }
      }, 500);
    });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('gesturestart', (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
