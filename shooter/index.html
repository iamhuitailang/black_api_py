<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际射击 - 竖版射击游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-wrapper">
            <canvas id="gameCanvas" width="480" height="720"></canvas>
            
            <div id="hud">
                <div class="hud-left">
                    <div class="hud-item">
                        <span class="label">分数</span>
                        <span id="score">0</span>
                    </div>
                    <div class="hud-item">
                        <span class="label">波数</span>
                        <span id="wave">1</span>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="hud-item">
                        <span class="label">HP</span>
                        <div class="hp-bar">
                            <div id="hpFill"></div>
                        </div>
                    </div>
                    <div class="hud-item weapon-info">
                        <span class="label">武器</span>
                        <span id="weapon">散射</span>
                        <span class="hint">(Q切换)</span>
                    </div>
                </div>
                <div id="buffs"></div>
            </div>

            <div id="weapon-skins">
                <div class="skin-item" data-weapon="scatter">
                    <span class="skin-name">散射</span>
                    <span class="skin-status" id="skin-scatter">默认</span>
                </div>
                <div class="skin-item" data-weapon="laser">
                    <span class="skin-name">激光</span>
                    <span class="skin-status" id="skin-laser">默认</span>
                </div>
                <div class="skin-item" data-weapon="missile">
                    <span class="skin-name">导弹</span>
                    <span class="skin-status" id="skin-missile">默认</span>
                </div>
            </div>

            <div id="startScreen" class="overlay">
                <h1>星际射击</h1>
                <p class="subtitle">消灭敌人，收集道具，挑战Boss！</p>
                <div class="controls-info">
                    <p>← → 移动飞船</p>
                    <p>Q 切换武器</p>
                    <p>空格 暂停游戏</p>
                </div>
                <div class="unlock-info">
                    <h3>武器皮肤解锁</h3>
                    <p>1000分 - 散射 · 红焰</p>
                    <p>3000分 - 激光 · 紫电</p>
                    <p>5000分 - 导弹 · 金光</p>
                </div>
                <button id="startBtn">开始游戏</button>
                <button id="continueBtn" style="display:none;">继续游戏</button>
            </div>

            <div id="gameOverScreen" class="overlay" style="display:none;">
                <h1>游戏结束</h1>
                <p class="final-score">最终分数: <span id="finalScore">0</span></p>
                <p class="final-wave">到达波数: <span id="finalWave">1</span></p>
                <button id="restartBtn">重新开始</button>
            </div>

            <div id="pauseScreen" class="overlay" style="display:none;">
                <h1>游戏暂停</h1>
                <p>按空格键继续</p>
            </div>

            <div id="bossWarning" class="boss-warning" style="display:none;">
                <h2>⚠️ 警告 ⚠️</h2>
                <p>旗舰Boss来袭！</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
