<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>气球大作战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 50%, #B2EBF2 100%);
    font-family: 'Arial', sans-serif;
    cursor: none;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  #ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .score-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    font-size: 24px;
    font-weight: bold;
  }
  .score-panel .label { font-size: 14px; opacity: 0.8; }
  .score-panel .value { font-size: 32px; }
  .score-panel .highscore {
    font-size: 14px;
    color: #FFD700;
    margin-top: 4px;
  }
  .lives-panel {
    position: absolute;
    top: 20px;
    left: 200px;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    font-size: 24px;
    font-weight: bold;
  }
  .lives-panel .hearts { font-size: 28px; color: #ff4444; letter-spacing: 4px; }
  .wind-panel {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    font-size: 18px;
    font-weight: bold;
    background: rgba(255,255,255,0.2);
    padding: 10px 20px;
    border-radius: 30px;
    backdrop-filter: blur(10px);
  }
  .wind-arrow {
    width: 30px;
    height: 30px;
    transition: transform 0.5s ease-out;
  }
  .combo-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    text-align: right;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    font-weight: bold;
    pointer-events: none;
    min-width: 150px;
  }
  .combo-count {
    font-size: 48px;
    background: linear-gradient(180deg, #FFD700, #FF6B00, #FF0000);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: transform 0.1s ease-out;
    filter: drop-shadow(0 0 10px rgba(255,107,0,0.5));
    display: inline-block;
  }
  .combo-label {
    font-size: 16px;
    color: #FFD700;
  }
  .combo-multiplier {
    font-size: 20px;
    color: #FF6B00;
  }
  .crosshair-selector {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
    z-index: 20;
  }
  .crosshair-btn {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(255,255,255,0.5);
    border-radius: 10px;
    background: rgba(0,0,0,0.3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.2s;
    pointer-events: auto;
  }
  .crosshair-btn:hover {
    border-color: #fff;
    transform: scale(1.1);
  }
  .crosshair-btn.active {
    border-color: #FFD700;
    box-shadow: 0 0 15px rgba(255,215,0,0.5);
  }
  .crosshair-btn.locked {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .crosshair-btn.locked::after {
    content: '🔒';
    position: absolute;
    font-size: 16px;
    bottom: -5px;
    right: -5px;
  }
  .crosshair-btn .unlock-req {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #fff;
    white-space: nowrap;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }
  .game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 40px 60px;
    border-radius: 20px;
    text-align: center;
    pointer-events: auto;
    display: none;
    z-index: 100;
  }
  .game-over h1 {
    font-size: 48px;
    margin-bottom: 20px;
    color: #FF4444;
  }
  .game-over p {
    font-size: 24px;
    margin-bottom: 10px;
  }
  .game-over .final-score {
    font-size: 36px;
    color: #FFD700;
    margin: 20px 0;
  }
  .game-over button {
    padding: 15px 40px;
    font-size: 20px;
    background: linear-gradient(135deg, #FF6B00, #FFD700);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    transition: transform 0.2s;
  }
  .game-over button:hover {
    transform: scale(1.05);
  }
  .notification {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,215,0,0.9);
    color: #000;
    padding: 15px 30px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 18px;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .notification.show {
    opacity: 1;
    transform: translateX(-50%) translateY(10px);
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div class="score-panel">
    <div class="label">分数</div>
    <div class="value" id="score">0</div>
    <div class="highscore" id="highscore">最高分: 0</div>
  </div>
  <div class="lives-panel">
    <div class="label">生命</div>
    <div class="hearts" id="hearts">❤❤❤</div>
  </div>
  <div class="wind-panel">
    <svg class="wind-arrow" id="windArrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
    <span id="windValue">风力: 0</span>
  </div>
  <div class="combo-panel">
    <div class="combo-label">连击</div>
    <div class="combo-count" id="comboCount">0</div>
    <div class="combo-multiplier" id="comboMultiplier">x1.0</div>
  </div>
  <div class="crosshair-selector" id="crosshairSelector"></div>
  <div class="notification" id="notification"></div>
  <div class="game-over" id="gameOver">
    <h1>游戏结束</h1>
    <p>最终得分</p>
    <div class="final-score" id="finalScore">0</div>
    <p id="newRecord" style="color:#FFD700; display:none;">🎉 新纪录！</p>
    <button onclick="restartGame()">重新开始</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
});

const SAVE_KEY = 'balloon_game_save_v1';

let gameState = {
  score: 0,
  lives: 3,
  highScore: 0,
  combo: 0,
  comboTimer: 0,
  maxCombo: 0,
  wind: 0,
  windTimer: 0,
  currentCrosshair: 'cross',
  unlockedCrosshairs: ['cross'],
  gameOver: false
};

const CROSSHAIR_UNLOCKS = [
  { id: 'cross', name: '十字准星', score: 0 },
  { id: 'circle', name: '圆环准星', score: 500 },
  { id: 'eagle', name: '鹰眼准星', score: 1500 },
  { id: 'laser', name: '激光准星', score: 3000 }
];

function loadGame() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      gameState.highScore = typeof data.highScore === 'number' ? data.highScore : 0;
      gameState.unlockedCrosshairs = Array.isArray(data.unlockedCrosshairs) && data.unlockedCrosshairs.length > 0
        ? data.unlockedCrosshairs : ['cross'];
      gameState.currentCrosshair = typeof data.currentCrosshair === 'string'
        && gameState.unlockedCrosshairs.includes(data.currentCrosshair)
        ? data.currentCrosshair : 'cross';

      const isGameOver = data.gameOver === true;
      gameState.gameOver = isGameOver;

      if (!isGameOver) {
        gameState.score = typeof data.score === 'number' ? data.score : 0;
        gameState.lives = typeof data.lives === 'number' && data.lives >= 0 ? data.lives : 3;
        if (gameState.lives === 0) gameState.lives = 3;
        gameState.wind = typeof data.wind === 'number' ? data.wind : 0;
      } else {
        gameState.score = typeof data.score === 'number' ? data.score : 0;
      }
    }
  } catch(e) { console.error('读取存档失败', e); }
}

function saveGame() {
  try {
    const payload = {
      highScore: gameState.highScore,
      unlockedCrosshairs: gameState.unlockedCrosshairs,
      currentCrosshair: gameState.currentCrosshair,
      score: gameState.score,
      lives: gameState.lives,
      wind: gameState.wind,
      gameOver: !!gameState.gameOver,
      savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
  } catch(e) { console.error('保存存档失败', e); }
}

loadGame();

const BALLOON_TYPES = {
  red:    { radius: 25, speed: 1.5, score: 10,  prob: 0.45, color: '#FF4444', darkColor: '#CC0000' },
  blue:   { radius: 20, speed: 2.5, score: 20,  prob: 0.30, color: '#4488FF', darkColor: '#0044CC' },
  gold:   { radius: 15, speed: 3.5, score: 50,  prob: 0.15, color: '#FFD700', darkColor: '#CC9900' },
  bomb:   { radius: 22, speed: 2.0, score: -1,  prob: 0.10, color: '#222222', darkColor: '#000000', isBomb: true }
};

let balloons = [];
let particles = [];
let shockwaves = [];
let fireParticles = [];
let mouseX = W / 2;
let mouseY = H / 2;

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { console.error('音频不可用', e); }
  }
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', volume = 0.2, freqEnd = null) {
  const ac = ensureAudio();
  if (!ac) return;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ac.currentTime);
  if (freqEnd !== null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), ac.currentTime + duration);
  }
  gain.gain.setValueAtTime(volume, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
  osc.connect(gain).connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime + duration);
}

function playWhiteNoise(duration, volume = 0.1, filterFreq = null) {
  const ac = ensureAudio();
  if (!ac) return;
  const bufferSize = ac.sampleRate * duration;
  const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const noise = ac.createBufferSource();
  noise.buffer = buffer;
  const gain = ac.createGain();
  gain.gain.setValueAtTime(volume, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
  let node = gain;
  if (filterFreq) {
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq;
    filter.Q.value = 0.5;
    noise.connect(filter);
    filter.connect(node).connect(ac.destination);
  } else {
    noise.connect(node).connect(ac.destination);
  }
  noise.start();
  noise.stop(ac.currentTime + duration);
}

function playRedPop() {
  playTone(440, 0.1, 'square', 0.15, 200);
  playWhiteNoise(0.1, 0.08);
}
function playBluePop() {
  playTone(880, 0.08, 'square', 0.12, 400);
  playWhiteNoise(0.08, 0.06);
}
function playGoldPop() {
  playTone(880, 0.2, 'sine', 0.15, 1320);
  setTimeout(() => playTone(1320, 0.15, 'sine', 0.12), 50);
}
function playBombExplode() {
  playTone(100, 0.4, 'sawtooth', 0.2, 40);
  playWhiteNoise(0.4, 0.15);
}
function playComboSound(comboNum) {
  const freq = 440 + comboNum * 50;
  playTone(freq, 0.1, 'triangle', 0.1);
}
function playWindSound() {
  playWhiteNoise(0.3, 0.08, 400);
}

class Balloon {
  constructor(type, x) {
    const t = BALLOON_TYPES[type];
    this.type = type;
    this.x = x;
    this.y = H + t.radius;
    this.radius = t.radius;
    this.speed = t.speed;
    this.color = t.color;
    this.darkColor = t.darkColor;
    this.score = t.score;
    this.isBomb = !!t.isBomb;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.03 + Math.random() * 0.02;
    this.glowPhase = 0;
    this.bombBlink = 0;
  }

  update() {
    this.y -= this.speed;
    this.x += gameState.wind;
    this.wobble += this.wobbleSpeed;
    this.x += Math.sin(this.wobble) * 0.3;
    this.glowPhase += 0.1;
    this.bombBlink += 0.15;
  }

  draw(ctx) {
    const x = this.x;
    const y = this.y;
    const r = this.radius;

    if (this.type === 'gold') {
      const glowSize = r + 8 + Math.sin(this.glowPhase) * 4;
      const grad = ctx.createRadialGradient(x, y, r * 0.5, x, y, glowSize);
      grad.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
      grad.addColorStop(1, 'rgba(255, 215, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, glowSize, 0, Math.PI * 2);
      ctx.fill();
    }

    if (this.isBomb) {
      const blink = Math.sin(this.bombBlink) > 0;
      ctx.strokeStyle = blink ? '#FF0000' : '#FF6600';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, r + 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    grad.addColorStop(0, this.lightenColor(this.color));
    grad.addColorStop(1, this.color);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.9, r, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = this.darkColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, y + r);
    ctx.lineTo(x - 3, y + r + 6);
    ctx.lineTo(x + 3, y + r + 6);
    ctx.closePath();
    ctx.fillStyle = this.darkColor;
    ctx.fill();

    ctx.strokeStyle = 'rgba(100, 100, 100, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y + r + 6);
    let lineY = y + r + 6;
    for (let i = 0; i < 5; i++) {
      const offX = Math.sin(this.wobble + i * 0.5) * 3;
      lineY += 10;
      ctx.lineTo(x + offX, lineY);
    }
    ctx.stroke();

    if (this.isBomb) {
      ctx.fillStyle = '#FF4444';
      ctx.font = `bold ${r}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💣', x, y);
    }
  }

  lightenColor(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgb(${Math.min(255, r+80)}, ${Math.min(255, g+80)}, ${Math.min(255, b+80)})`;
  }

  contains(px, py) {
    const dx = px - this.x;
    const dy = py - this.y;
    return dx * dx + dy * dy <= this.radius * this.radius;
  }

  isOffScreen() {
    return this.y < -this.radius * 2;
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.gravity = 0.15;
    this.color = color;
    this.size = 4 + Math.random() * 4;
    this.life = 1;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = (Math.random() - 0.5) * 0.3;
  }

  update() {
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
    this.rotation += this.rotationSpeed;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
    ctx.restore();
  }

  isDead() { return this.life <= 0; }
}

class Shockwave {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 5;
    this.maxRadius = 60;
    this.life = 1;
  }

  update() {
    this.radius += 3;
    this.life -= 0.04;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.strokeStyle = `rgba(255, 255, 255, ${this.life})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  isDead() { return this.life <= 0 || this.radius >= this.maxRadius; }
}

class FireParticle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = -1 - Math.random() * 2;
    this.life = 1;
    this.size = 3 + Math.random() * 4;
    const hue = 20 + Math.random() * 30;
    this.color = `hsl(${hue}, 100%, 60%)`;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy *= 0.95;
    this.life -= 0.03;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.life * 0.8;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, '#FFFF00');
    grad.addColorStop(0.5, this.color);
    grad.addColorStop(1, 'rgba(255, 69, 0, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  isDead() { return this.life <= 0; }
}

function pickBalloonType() {
  const r = Math.random();
  let acc = 0;
  for (const [type, info] of Object.entries(BALLOON_TYPES)) {
    acc += info.prob;
    if (r <= acc) return type;
  }
  return 'red';
}

function spawnBalloon() {
  const type = pickBalloonType();
  const t = BALLOON_TYPES[type];
  const x = t.radius + Math.random() * (W - t.radius * 2);
  balloons.push(new Balloon(type, x));
}

function createFragments(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function spawnFireParticles() {
  const panel = document.querySelector('.combo-panel');
  if (gameState.combo <= 0) return;
  const rect = panel.getBoundingClientRect();
  const cx = rect.right - 40;
  const cy = rect.top + 50;
  for (let i = 0; i < Math.min(gameState.combo, 5); i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 20;
    fireParticles.push(new FireParticle(
      cx + Math.cos(angle) * dist,
      cy + Math.sin(angle) * dist
    ));
  }
}

function drawCrosshair(x, y) {
  ctx.save();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 4;

  switch (gameState.currentCrosshair) {
    case 'cross':
      ctx.beginPath();
      ctx.moveTo(x - 15, y); ctx.lineTo(x - 5, y);
      ctx.moveTo(x + 5, y); ctx.lineTo(x + 15, y);
      ctx.moveTo(x, y - 15); ctx.lineTo(x, y - 5);
      ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 15);
      ctx.stroke();
      ctx.strokeStyle = '#FF4444';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.stroke();
      break;
    case 'circle':
      ctx.strokeStyle = '#00FF88';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(0,255,136,0.5)';
      ctx.beginPath();
      ctx.moveTo(x - 25, y); ctx.lineTo(x - 10, y);
      ctx.moveTo(x + 10, y); ctx.lineTo(x + 25, y);
      ctx.moveTo(x, y - 25); ctx.lineTo(x, y - 10);
      ctx.moveTo(x, y + 10); ctx.lineTo(x, y + 25);
      ctx.stroke();
      break;
    case 'eagle':
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI) / 2;
        const ix = x + Math.cos(a) * 6;
        const iy = y + Math.sin(a) * 6;
        const ox = x + Math.cos(a) * 22;
        const oy = y + Math.sin(a) * 22;
        ctx.moveTo(ix, iy);
        ctx.lineTo(ox, oy);
      }
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,215,0,0.4)';
      ctx.beginPath();
      ctx.arc(x, y, 28, 0, Math.PI * 2);
      ctx.stroke();
      break;
    case 'laser':
      ctx.strokeStyle = '#FF00FF';
      ctx.lineWidth = 1;
      ctx.shadowColor = '#FF00FF';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 25, y); ctx.lineTo(x - 8, y);
      ctx.moveTo(x + 8, y); ctx.lineTo(x + 25, y);
      ctx.moveTo(x, y - 25); ctx.lineTo(x, y - 8);
      ctx.moveTo(x, y + 8); ctx.lineTo(x, y + 25);
      ctx.stroke();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.moveTo(x - 3, y); ctx.lineTo(x + 3, y);
      ctx.moveTo(x, y - 3); ctx.lineTo(x, y + 3);
      ctx.stroke();
      break;
  }
  ctx.restore();
}

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('click', (e) => {
  ensureAudio();
  const clickX = e.clientX;
  const clickY = e.clientY;
  shockwaves.push(new Shockwave(clickX, clickY));

  let hitSomething = false;
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    if (b.contains(clickX, clickY)) {
      balloons.splice(i, 1);
      hitSomething = true;

      if (b.isBomb) {
        playBombExplode();
        createFragments(b.x, b.y, '#333333');
        createFragments(b.x, b.y, '#FF4444');
        gameState.lives--;
        updateLivesUI();
        if (gameState.lives <= 0) {
          endGame();
        }
        gameState.combo = 0;
        updateComboUI();
      } else {
        if (b.type === 'red') playRedPop();
        else if (b.type === 'blue') playBluePop();
        else if (b.type === 'gold') playGoldPop();

        createFragments(b.x, b.y, b.color);
        createFragments(b.x, b.y, b.darkColor);

        if (gameState.comboTimer > 0) {
          gameState.combo++;
        } else {
          gameState.combo = 1;
        }
        gameState.comboTimer = 1000;

        const multiplier = Math.min(5, 1 + gameState.combo * 0.2);
        const points = Math.floor(b.score * multiplier);
        gameState.score += points;
        updateScoreUI();
        if (gameState.combo > 1) playComboSound(gameState.combo);
        updateComboUI();
        checkCrosshairUnlocks();
      }
      saveGame();
      break;
    }
  }
});

function updateScoreUI() {
  document.getElementById('score').textContent = gameState.score;
  document.getElementById('highscore').textContent = `最高分: ${gameState.highScore}`;
}

function updateLivesUI() {
  const hearts = '❤'.repeat(Math.max(0, gameState.lives));
  document.getElementById('hearts').textContent = hearts || '💀';
}

function updateComboUI() {
  const comboEl = document.getElementById('comboCount');
  const multEl = document.getElementById('comboMultiplier');
  comboEl.textContent = gameState.combo;
  const mult = Math.min(5, 1 + gameState.combo * 0.2);
  multEl.textContent = `x${mult.toFixed(1)}`;
  const scale = 1 + Math.min(gameState.combo * 0.05, 0.5);
  comboEl.style.transform = `scale(${scale})`;
  if (gameState.combo > gameState.maxCombo) {
    gameState.maxCombo = gameState.combo;
  }
}

function updateWindUI() {
  const arrow = document.getElementById('windArrow');
  const valEl = document.getElementById('windValue');
  let angle = 0;
  if (gameState.wind > 0) {
    angle = 90;
  } else if (gameState.wind < 0) {
    angle = -90;
  }
  const strength = Math.abs(gameState.wind);
  if (gameState.wind === 0) {
    arrow.style.opacity = '0.3';
  } else {
    arrow.style.opacity = '1';
  }
  arrow.style.transform = `rotate(${angle}deg)`;
  valEl.textContent = `风力: ${gameState.wind > 0 ? '+' : ''}${gameState.wind.toFixed(1)}`;
}

function changeWind() {
  gameState.wind = (Math.random() * 4 - 2);
  playWindSound();
  updateWindUI();
}

function checkCrosshairUnlocks() {
  let newlyUnlocked = [];
  for (const c of CROSSHAIR_UNLOCKS) {
    if (gameState.score >= c.score && !gameState.unlockedCrosshairs.includes(c.id)) {
      gameState.unlockedCrosshairs.push(c.id);
      newlyUnlocked.push(c);
    }
  }
  if (newlyUnlocked.length > 0) {
    saveGame();
    renderCrosshairSelector();
    showNotification(`🎉 解锁新准星: ${newlyUnlocked.map(c => c.name).join(', ')}`);
  }
}

function renderCrosshairSelector() {
  const container = document.getElementById('crosshairSelector');
  container.innerHTML = '';
  for (const c of CROSSHAIR_UNLOCKS) {
    const btn = document.createElement('div');
    btn.className = 'crosshair-btn';
    if (gameState.unlockedCrosshairs.includes(c.id)) {
      if (gameState.currentCrosshair === c.id) btn.classList.add('active');
      btn.innerHTML = getCrosshairPreview(c.id);
      btn.onclick = () => {
        gameState.currentCrosshair = c.id;
        saveGame();
        renderCrosshairSelector();
      };
    } else {
      btn.classList.add('locked');
      btn.innerHTML = getCrosshairPreview(c.id);
      const req = document.createElement('div');
      req.className = 'unlock-req';
      req.textContent = `${c.score}分`;
      btn.appendChild(req);
    }
    container.appendChild(btn);
  }
}

function getCrosshairPreview(id) {
  const size = 30;
  switch(id) {
    case 'cross':
      return `<svg width="${size}" height="${size}" viewBox="0 0 30 30" stroke="#fff" stroke-width="2" fill="none">
        <line x1="2" y1="15" x2="11" y2="15"/><line x1="19" y1="15" x2="28" y2="15"/>
        <line x1="15" y1="2" x2="15" y2="11"/><line x1="15" y1="19" x2="15" y2="28"/>
        <circle cx="15" cy="15" r="2" stroke="#FF4444"/></svg>`;
    case 'circle':
      return `<svg width="${size}" height="${size}" viewBox="0 0 30 30" stroke="#00FF88" stroke-width="2" fill="none">
        <circle cx="15" cy="15" r="10"/><circle cx="15" cy="15" r="2"/>
        <line x1="2" y1="15" x2="7" y2="15"/><line x1="23" y1="15" x2="28" y2="15"/>
        <line x1="15" y1="2" x2="15" y2="7"/><line x1="15" y1="23" x2="15" y2="28"/></svg>`;
    case 'eagle':
      return `<svg width="${size}" height="${size}" viewBox="0 0 30 30" stroke="#FFD700" stroke-width="1.5" fill="none">
        <circle cx="15" cy="15" r="12"/>
        <line x1="15" y1="3" x2="15" y2="9"/><line x1="15" y1="21" x2="15" y2="27"/>
        <line x1="3" y1="15" x2="9" y2="15"/><line x1="21" y1="15" x2="27" y2="15"/></svg>`;
    case 'laser':
      return `<svg width="${size}" height="${size}" viewBox="0 0 30 30" stroke="#FF00FF" stroke-width="1.5" fill="none" style="filter:drop-shadow(0 0 3px #FF00FF)">
        <circle cx="15" cy="15" r="9"/>
        <line x1="2" y1="15" x2="10" y2="15"/><line x1="20" y1="15" x2="28" y2="15"/>
        <line x1="15" y1="2" x2="15" y2="10"/><line x1="15" y1="20" x2="15" y2="28"/>
        <line x1="13" y1="15" x2="17" y2="15" stroke="#fff"/><line x1="15" y1="13" x2="15" y2="17" stroke="#fff"/></svg>`;
  }
  return '';
}

function showNotification(text) {
  const el = document.getElementById('notification');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function endGame() {
  let newRecord = false;
  if (gameState.score > gameState.highScore) {
    gameState.highScore = gameState.score;
    newRecord = true;
  }
  gameState.gameOver = true;
  saveGame();

  document.getElementById('finalScore').textContent = gameState.score;
  document.getElementById('newRecord').style.display = newRecord ? 'block' : 'none';
  document.getElementById('gameOver').style.display = 'block';
}

function restartGame() {
  gameState.score = 0;
  gameState.lives = 3;
  gameState.combo = 0;
  gameState.comboTimer = 0;
  gameState.maxCombo = 0;
  gameState.wind = 0;
  gameState.windTimer = 0;
  gameState.gameOver = false;
  balloons = [];
  particles = [];
  shockwaves = [];
  fireParticles = [];
  saveGame();

  document.getElementById('gameOver').style.display = 'none';
  updateScoreUI();
  updateLivesUI();
  updateComboUI();
  updateWindUI();
  renderCrosshairSelector();
}

let lastTime = performance.now();
let spawnAccumulator = 0;

let autoSaveTimer = 0;

function gameLoop(currentTime) {
  let dt = currentTime - lastTime;
  lastTime = currentTime;
  if (dt > 100) dt = 100;

  ctx.clearRect(0, 0, W, H);

  autoSaveTimer += dt;
  if (autoSaveTimer >= 1000) {
    autoSaveTimer = 0;
    saveGame();
  }

  if (!gameState.gameOver) {
    gameState.windTimer += dt;
    if (gameState.windTimer >= 15000) {
      gameState.windTimer = 0;
      changeWind();
    }

    if (gameState.comboTimer > 0) {
      gameState.comboTimer -= dt;
      if (gameState.comboTimer <= 0) {
        gameState.combo = 0;
        updateComboUI();
      }
    }

    spawnAccumulator += dt;
    let spawnedThisFrame = 0;
    while (spawnAccumulator >= 16.67 && spawnedThisFrame < 3) {
      if (Math.random() < 0.03) {
        spawnBalloon();
        spawnedThisFrame++;
      }
      spawnAccumulator -= 16.67;
    }
    if (spawnAccumulator > 1000) spawnAccumulator = 0;

    for (let i = balloons.length - 1; i >= 0; i--) {
      balloons[i].update();
      if (balloons[i].isOffScreen()) {
        balloons.splice(i, 1);
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    if (particles[i].isDead()) particles.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    shockwaves[i].update();
    if (shockwaves[i].isDead()) shockwaves.splice(i, 1);
  }

  if (!gameState.gameOver && gameState.combo > 0) {
    if (Math.random() < 0.3) spawnFireParticles();
  }
  for (let i = fireParticles.length - 1; i >= 0; i--) {
    fireParticles[i].update();
    if (fireParticles[i].isDead()) fireParticles.splice(i, 1);
  }

  drawClouds();

  for (const b of balloons) b.draw(ctx);
  for (const p of particles) p.draw(ctx);
  for (const s of shockwaves) s.draw(ctx);
  for (const f of fireParticles) f.draw(ctx);

  if (!gameState.gameOver) {
    drawCrosshair(mouseX, mouseY);
  }

  requestAnimationFrame(gameLoop);
}

let cloudOffsets = [
  { x: 100, y: 80, size: 1.0 },
  { x: 400, y: 150, size: 1.3 },
  { x: 700, y: 60, size: 0.8 },
  { x: 1000, y: 120, size: 1.1 },
  { x: 200, y: 300, size: 0.9 },
  { x: 800, y: 280, size: 1.2 }
];

function drawClouds() {
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  for (const c of cloudOffsets) {
    c.x += 0.2;
    if (c.x > W + 200) c.x = -200;
    const s = c.size;
    const x = c.x, y = c.y;
    ctx.beginPath();
    ctx.arc(x, y, 30 * s, 0, Math.PI * 2);
    ctx.arc(x + 25 * s, y - 10 * s, 35 * s, 0, Math.PI * 2);
    ctx.arc(x + 55 * s, y, 30 * s, 0, Math.PI * 2);
    ctx.arc(x + 30 * s, y + 10 * s, 25 * s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

window.addEventListener('beforeunload', () => saveGame());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveGame();
});

updateScoreUI();
updateLivesUI();
updateComboUI();
updateWindUI();
renderCrosshairSelector();
if (gameState.gameOver) {
  document.getElementById('finalScore').textContent = gameState.score;
  document.getElementById('gameOver').style.display = 'block';
}
requestAnimationFrame(gameLoop);
</script>
